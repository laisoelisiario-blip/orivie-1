const TEXTS=[
 {id:'t0',title:'Os 4 temperamentos: de onde vem essa ideia',cat:'temperamentos',cats:['temperamentos'],prefs:['Temperamentos'],
  body:['A ideia dos quatro temperamentos é muito antiga. Médicos gregos como Hipócrates e, depois, Galeno acreditavam que o jeito de cada pessoa vinha do equilíbrio de "humores" do corpo. A medicina moderna abandonou essa explicação, mas os nomes ficaram: sanguíneo, colérico, melancólico e fleumático.',
   'No século 20, o pastor Tim LaHaye popularizou os temperamentos entre cristãos no livro "Temperamento controlado pelo Espírito". Ele usou Pedro, Paulo, Moisés e Abraão como exemplos de pessoas cujo jeito foi transformado por Deus. Florence Littauer levou o tema para milhares de mulheres com o livro "Personality Plus", mostrando que cada pessoa é uma mistura dos quatro.',
   'Por isso, aqui no Orivie, os temperamentos são um mapa, não uma sentença. Eles ajudam você a perceber tendências: como você reage, o que te cansa, onde você brilha. Mas a Bíblia não divide as pessoas em quatro tipos, e a ciência hoje usa outros modelos, como o Big Five.',
   'O mais importante é a mensagem que LaHaye repetia: o caráter não muda só por conhecer o próprio temperamento, e sim pela ação do Espírito Santo. Conhecer-se é o primeiro passo para entregar a Deus as suas forças e as suas fraquezas.'],
  you:{sanguinea:'Use o mapa para entender a sua alegria e os seus impulsos, sem se rotular.',colerica:'Use o mapa como ferramenta de crescimento, não como desculpa para a pressa.',melancolica:'Não use o resultado para se cobrar: use para se acolher.',fleumatica:'Deixe o mapa te dar coragem para crescer onde você costuma se acomodar.'},
  try:'Escreva em uma frase: "Neste temperamento, eu me reconheci em..."',pray:'Senhor, me ajuda a me conhecer para te conhecer melhor.',
  src:'Tim LaHaye, Temperamento controlado pelo Espírito e Temperamentos transformados (Mundo Cristão); Florence Littauer, Personality Plus; Martins, Silva e Mutarelli (2008), A teoria dos temperamentos.'},
 {id:'t1',title:'Sanguínea: alegria que encoraja',cat:'temperamentos',cats:['temperamentos'],prefs:['Temperamentos'],
  body:['A sanguínea é a mulher que enche a sala. Fala com facilidade, faz amizade em qualquer fila e transforma o culto de domingo em um reencontro cheio de abraços. Ela vive o presente, sente tudo com intensidade e se recupera rápido das tristezas.',
   'Essa alegria é preciosa no Reino de Deus. Neemias lembrou ao povo que "a alegria do Senhor os fortalecerá" (Neemias 8:10). A sanguínea encoraja, acolhe e lembra a igreja de que a fé também é celebração.',
   'O desafio aparece quando a emoção manda sozinha. Palavras saem antes do pensamento, promessas ficam pela metade e a vida espiritual oscila conforme o ânimo. Pedro viveu isso: prometeu nunca negar Jesus e, horas depois, negou três vezes (Lucas 22:54-62).',
   'O fruto do Espírito que mais transforma a sanguínea é o domínio próprio, junto com a fidelidade (Gálatas 5:22-23). Com eles, o entusiasmo ganha raízes. Pedro, o impulsivo, terminou a vida como uma rocha da igreja, pregando com coragem e escrevendo cartas cheias de esperança.'],
  you:{sanguinea:'Este é o seu retrato. Celebre a sua alegria e escolha um compromisso para cumprir até o fim esta semana.',colerica:'Se você convive com uma sanguínea, valorize o calor dela e tenha paciência com a falta de método.',melancolica:'A sanguínea pode te ensinar leveza. Deixe que ela te tire um pouco da sua cabeça.',fleumatica:'A sanguínea pode te dar o empurrão de energia que às vezes falta.'},
  try:'Antes de responder uma mensagem hoje, espere um minuto e ore: "Senhor, guarda a minha boca".',pray:'Senhor, dá raízes à minha alegria.',
  src:'Neemias 8:10; Lucas 22:54-62; João 21:15-17; Gálatas 5:22-23; Tim LaHaye, Temperamentos transformados.'},
 {id:'t2',title:'Colérica: coragem que lidera',cat:'temperamentos',cats:['temperamentos'],prefs:['Temperamentos'],
  body:['A colérica enxerga o objetivo e vai. Ela organiza o evento, assume o ministério, resolve o problema da família e não se intimida com obstáculos. É prática, decidida e tem uma energia que impressiona.',
   'A igreja precisa de mulheres assim. Débora liderou Israel com coragem e fé (Juízes 4-5). Paulo plantou igrejas pelo mundo, movido por um zelo que nunca diminuiu (Filipenses 3:13-14). Coragem e iniciativa são dons.',
   'Mas a colérica costuma tropeçar na pressa e no controle. Pode atropelar quem é mais lento, falar duro e achar que descansar é perder tempo. Marta, ocupada com tantas tarefas, ouviu de Jesus: "Você está preocupada e inquieta com muitas coisas; todavia apenas uma é necessária" (Lucas 10:41-42).',
   'O fruto do Espírito que mais transforma a colérica é a paciência, com mansidão e amor. Jesus, o maior líder da história, disse: "Aprendam de mim, pois sou manso e humilde de coração" (Mateus 11:29). Força sob controle é a marca de uma líder cheia do Espírito.'],
  you:{sanguinea:'A colérica pode te ajudar a transformar ideias em realidade. Aceite a ajuda dela com o planejamento.',colerica:'Este é o seu retrato. Escolha hoje um momento para desacelerar e ouvir antes de agir.',melancolica:'A colérica pode parecer dura, mas costuma ser leal. Diga a ela, com calma, o que te machuca.',fleumatica:'Não deixe a colérica decidir tudo por você: sua opinião também importa.'},
  try:'Pergunte a alguém da sua casa ou ministério: "Como você está?" e apenas ouça por 5 minutos.',pray:'Jesus, ensina-me a liderar servindo.',
  src:'Juízes 4-5; Filipenses 3:13-14; Lucas 10:38-42; Mateus 11:29; Gálatas 5:22-23.'},
 {id:'t3',title:'Melancólica: profundidade que adora',cat:'temperamentos',cats:['temperamentos'],prefs:['Temperamentos'],
  body:['A melancólica sente e pensa com o coração inteiro. Ela se emociona com uma letra de louvor, percebe a tristeza de alguém pelo olhar e faz tudo com capricho. Gosta de ordem, de profundidade e de relações verdadeiras.',
   'Muitos salmos parecem escritos por corações assim: honestos, profundos, cheios de perguntas e de adoração. Ana derramou a alma diante de Deus (1 Samuel 1:15), e Moisés, inseguro para falar, se tornou um líder humilde e fiel (Êxodo 3-4).',
   'O lado difícil é a autocrítica. A melancólica pode se cobrar perfeição, remoer mágoas e enxergar primeiro o que falta. Nos dias ruins, a tristeza pesa mais. Elias, depois de uma grande vitória, chegou a pedir para morrer de tão exausto, e Deus cuidou dele com descanso e comida (1 Reis 19:4-8).',
   'Os frutos que mais transformam a melancólica são a alegria e a paz. Paulo escreveu: "Minha graça é suficiente a você" (2 Coríntios 12:9). A melancólica não precisa ser perfeita para ser amada. A graça ilumina a profundidade e a transforma em adoração.'],
  you:{sanguinea:'A melancólica pode te ensinar profundidade. Ouça o que ela percebe.',colerica:'Seja gentil com a sensibilidade da melancólica: ela nota cada palavra.',melancolica:'Este é o seu retrato. Hoje, troque uma frase de cobrança por uma frase de graça.',fleumatica:'Vocês duas valorizam a calma. Ofereça a ela sua presença tranquila nos dias difíceis.'},
  try:'Escreva três coisas que você fez bem hoje, mesmo que pequenas.',pray:'Senhor, que a tua graça seja maior do que a minha autocrítica.',
  src:'1 Samuel 1:10-18; Êxodo 3-4; 1 Reis 19:4-8; 2 Coríntios 12:9; Gálatas 5:22-23.'},
 {id:'t4',title:'Fleumática: paz que sustenta',cat:'temperamentos',cats:['temperamentos'],prefs:['Temperamentos'],
  body:['A fleumática é o porto seguro do grupo. Calma, leal e constante, ela ouve sem julgar, evita brigas e está sempre presente. Não precisa de holofote: serve nos bastidores e mantém a paz.',
   'Jesus disse: "Bem-aventurados os pacificadores, pois serão chamados filhos de Deus" (Mateus 5:9). Rute mostrou essa lealdade ao ficar com a sogra quando tudo era incerto (Rute 1:16-17), e Maria de Betânia escolheu ficar aos pés de Jesus (Lucas 10:39).',
   'O desafio da fleumática é a passividade. Para evitar conflito, ela pode guardar o que sente, adiar decisões e deixar de usar os dons que Deus lhe deu. Abraão, homem de paz, também teve momentos de medo e passividade, mas aprendeu a confiar e a dar passos ousados (Gênesis 12; Hebreus 11:8).',
   'O fruto que mais transforma a fleumática é a fidelidade que age, junto com a bondade ativa. "A fé, por si só, se não for acompanhada de obras, está morta" (Tiago 2:17). Abigail mostra o equilíbrio: pacificadora, mas rápida em agir quando foi preciso (1 Samuel 25).'],
  you:{sanguinea:'A fleumática equilibra a sua intensidade. Valorize a calma dela.',colerica:'Não confunda a calma da fleumática com falta de interesse. Pergunte a opinião dela.',melancolica:'A fleumática pode ser a amiga que te ouve sem pressa.',fleumatica:'Este é o seu retrato. Escolha hoje uma decisão pendente e dê o primeiro passo.'},
  try:'Diga com carinho uma coisa que você sente e costuma guardar.',pray:'Senhor, me dá coragem para dar o próximo passo.',
  src:'Mateus 5:9; Rute 1:16-17; Lucas 10:39; Gênesis 12; Hebreus 11:8; Tiago 2:17; 1 Samuel 25.'},
 {id:'t5',title:'Temperamento não é destino',cat:'fruto',cats:['fruto','temperamentos'],prefs:['Temperamentos','Identidade'],
  body:['É fácil usar o temperamento como desculpa: "sou colérica, por isso sou grossa" ou "sou melancólica, então sempre vou ser triste". Mas a Bíblia aponta para outro caminho: "Se alguém está em Cristo, é nova criação" (2 Coríntios 5:17).',
   'Deus não apaga quem você é. Pedro continuou intenso, Paulo continuou determinado, Moisés continuou sensível. O que mudou foi a direção: as forças passaram a servir ao Reino, e as fraquezas foram sendo moldadas pelo Espírito.',
   'Paulo escreveu: "Não se amoldem ao padrão deste mundo, mas transformem-se pela renovação da sua mente" (Romanos 12:2). Transformação é um processo, não um evento. Acontece em escolhas pequenas: uma palavra segurada, um descanso aceito, um passo dado, uma mágoa entregue.',
   'O fruto do Espírito (Gálatas 5:22-23) é o retrato do caráter que Deus quer formar em todas nós, independentemente do temperamento: amor, alegria, paz, paciência, amabilidade, bondade, fidelidade, mansidão e domínio próprio. Seu temperamento mostra por onde começar.'],
  you:{sanguinea:'Comece pelo domínio próprio.',colerica:'Comece pela paciência.',melancolica:'Comece pela alegria.',fleumatica:'Comece pela fidelidade que age.'},
  try:'Escolha um fruto do Espírito para praticar esta semana e escreva onde vai praticá-lo.',pray:'Espírito Santo, transforma o meu caráter.',
  src:'2 Coríntios 5:17; Romanos 12:2; Gálatas 5:22-23; Tim LaHaye, Temperamentos transformados.'},
 {id:'t6',title:'Jesus, o caráter perfeito',cat:'fruto',cats:['fruto','temperamentos'],prefs:['Temperamentos','Identidade'],
  body:['Se olharmos para Jesus com as lentes dos temperamentos, encontramos algo bonito: ele reúne o melhor de todos, sem as fraquezas de nenhum.',
   'Como uma sanguínea, Jesus acolhia multidões, ia a festas e comia com pessoas que ninguém queria por perto (Lucas 15:1-2). Como uma colérica, agiu com firmeza ao expulsar os vendilhões do templo (Marcos 11:15-17) e caminhou decidido para Jerusalém.',
   'Como uma melancólica, chorou diante do túmulo do amigo Lázaro (João 11:35) e passou noites em oração. Como uma fleumática, foi manso e humilde de coração (Mateus 11:29), dormiu no barco durante a tempestade e nunca perdeu a paz.',
   'Por isso, o alvo da vida cristã não é virar outro temperamento, e sim parecer cada vez mais com Jesus. Cada uma de nós começa de um lugar diferente, mas o destino é o mesmo: ser transformada à imagem dele.'],
  you:{sanguinea:'Olhe para a firmeza e a profundidade de Jesus.',colerica:'Olhe para a mansidão e as lágrimas de Jesus.',melancolica:'Olhe para a alegria e a leveza de Jesus com as pessoas.',fleumatica:'Olhe para a coragem e a iniciativa de Jesus.'},
  try:'Leia Marcos 4:35-41 e repare na calma e na autoridade de Jesus juntas.',pray:'Jesus, quero me parecer contigo.',
  src:'Lucas 15:1-2; Marcos 11:15-17; João 11:35; Mateus 11:29; Marcos 4:35-41.'},
 {id:'f1',title:'O fruto do Espírito e o seu temperamento',cat:'fruto',cats:['fruto'],prefs:['Temperamentos','Rotina com Deus'],
  body:['Em Gálatas 5:22-23, Paulo descreve o fruto do Espírito: "amor, alegria, paz, paciência, amabilidade, bondade, fidelidade, mansidão e domínio próprio". Repare que é "fruto", no singular: um único caráter, com nove sabores.',
   'Cada temperamento tem mais facilidade com alguns desses sabores. A sanguínea costuma transbordar alegria e amabilidade. A colérica tem iniciativa e fidelidade às metas. A melancólica tem bondade e profundidade no amor. A fleumática tem paz e paciência.',
   'E cada temperamento tem mais dificuldade com outros: a sanguínea com domínio próprio, a colérica com paciência e mansidão, a melancólica com alegria e paz, a fleumática com fidelidade que age.',
   'Fruto não nasce de esforço sozinho: nasce de ligação com a videira. Jesus disse: "Quem permanece em mim, e eu nele, esse dá muito fruto" (João 15:5). Oração, Palavra e comunhão são a seiva que faz o fruto crescer.'],
  you:{sanguinea:'Peça a Deus domínio próprio nas palavras.',colerica:'Peça paciência nas relações.',melancolica:'Peça alegria nos pensamentos.',fleumatica:'Peça fidelidade que se move.'},
  try:'Leia João 15:1-8 e anote o que significa "permanecer" para você hoje.',pray:'Senhor, quero dar fruto permanecendo em ti.',
  src:'Gálatas 5:22-23; João 15:1-8.'},
 {id:'c1',title:'O que a ciência diz sobre fé e personalidade',cat:'temperamentos',cats:['temperamentos'],prefs:['Temperamentos','Fé e dúvidas'],
  body:['A psicologia de hoje usa principalmente o modelo Big Five, que descreve a personalidade em cinco grandes traços: abertura, responsabilidade (conscienciosidade), extroversão, amabilidade e tendência a emoções negativas.',
   'Estudos internacionais que comparam fé e personalidade encontram um padrão: pessoas religiosas tendem a ter mais amabilidade e mais responsabilidade. Pesquisas com dezenas de países mostram que essa ligação é mais forte em culturas religiosas, como a brasileira.',
   'Isso não quer dizer que a fé "produz" um tipo de personalidade, nem que pessoas de outros jeitos tenham menos fé. Mostra apenas tendências médias em grandes grupos. Cada pessoa é única.',
   'Para nós, a mensagem é animadora: práticas como oração, comunidade e serviço caminham junto com traços como cuidado com o outro e compromisso. Conhecer a sua personalidade, com a Bíblia e a ciência, ajuda você a crescer com mais consciência.'],
  you:{sanguinea:'Sua extroversão é um dom para a comunhão.',colerica:'Sua responsabilidade pode servir a muitos.',melancolica:'Sua sensibilidade pode virar cuidado e empatia.',fleumatica:'Sua amabilidade é uma ponte para as pessoas.'},
  try:'Pense em uma prática de fé que te faz uma pessoa mais gentil e repita hoje.',pray:'Senhor, obrigada por me criar com tanto cuidado.',
  src:'Saroglou (2010), Religiousness as a cultural adaptation of basic traits; Entringer et al. (2020), Journal of Personality and Social Psychology; Religion and personality (revisões).'},
 {id:'w1',title:'Ester: coragem para um momento como este',cat:'mulheres',cats:['mulheres'],prefs:['Mulheres da Bíblia','Propósito'],
  body:['Ester era uma jovem judia órfã, criada pelo primo Mardoqueu, que se tornou rainha da Pérsia. Quando um decreto ameaçou exterminar o seu povo, Mardoqueu disse: "Quem sabe se não foi para um momento como este que você chegou à posição de rainha?" (Ester 4:14).',
   'Ester não agiu por impulso. Pediu três dias de jejum e, só então, decidiu: "Se eu tiver que morrer, morrerei" (Ester 4:16). Depois, preparou banquetes e esperou o momento certo de falar com o rei. Sua história mostra traços melancólicos: cautela, planejamento e profundidade.',
   'Ester nos ensina que coragem não é ausência de medo. É decidir obedecer mesmo com medo, com oração e sabedoria. Ela também mostra que Deus age nos bastidores: o nome de Deus nem aparece no livro, mas a sua mão está em cada detalhe.',
   'Talvez você esteja num lugar difícil e se pergunte por quê. A história de Ester lembra que nenhuma posição é por acaso, e que a sua voz pode proteger e abençoar outras pessoas.'],
  you:{sanguinea:'Aprenda com Ester a esperar o momento certo antes de falar.',colerica:'Aprenda com Ester a orar antes de agir.',melancolica:'Ester mostra que a sua prudência pode virar coragem.',fleumatica:'Ester mostra que às vezes a paz exige que você fale.'},
  try:'Ore sobre uma situação em que Deus talvez esteja pedindo a sua voz.',pray:'Senhor, me dá coragem para o momento em que tu me colocaste.',
  src:'Ester 4:14-16; Ester 5-7.'},
 {id:'w2',title:'Rute: a lealdade que Deus honra',cat:'mulheres',cats:['mulheres','relacionamentos'],prefs:['Mulheres da Bíblia','Relacionamentos'],
  body:['Rute era moabita e ficou viúva jovem. Quando a sogra, Noemi, decidiu voltar para Belém, Rute poderia ter ficado na sua terra. Mas respondeu: "Aonde você for, irei; onde você ficar, ficarei! O seu povo será o meu povo e o seu Deus será o meu Deus!" (Rute 1:16).',
   'Em Belém, Rute trabalhou com humildade recolhendo espigas nos campos para sustentar as duas (Rute 2:2-3). Boaz notou sua bondade e fidelidade, e mais tarde a chamou de mulher de valor (Rute 3:11). Ela se tornou bisavó do rei Davi e faz parte da genealogia de Jesus.',
   'Rute lembra o temperamento fleumático no seu melhor: lealdade constante, humildade e paz. Mas não foi passiva: tomou decisões corajosas, foi trabalhar e seguiu as orientações de Noemi com iniciativa.',
   'Sua história mostra que a fidelidade silenciosa é vista por Deus. O que parece pequeno, como cuidar de alguém e trabalhar com dedicação, pode fazer parte de uma história muito maior.'],
  you:{sanguinea:'Aprenda com Rute a constância nas relações.',colerica:'Aprenda com Rute a humildade de servir.',melancolica:'Rute mostra que recomeçar depois da perda é possível.',fleumatica:'Rute mostra que a sua lealdade, unida à iniciativa, é poderosa.'},
  try:'Faça um gesto concreto de cuidado por alguém da sua família hoje.',pray:'Senhor, que a minha fidelidade seja vista por ti.',
  src:'Rute 1-4; Mateus 1:5.'},
 {id:'w3',title:'Ana: a oração que derrama a alma',cat:'mulheres',cats:['mulheres'],prefs:['Mulheres da Bíblia','Saúde emocional'],
  body:['Ana não conseguia ter filhos e, todos os anos, era provocada por outra mulher da casa. A dor era tão grande que ela chorava e não comia (1 Samuel 1:6-7).',
   'No templo, Ana orou em silêncio, só mexendo os lábios. O sacerdote Eli achou que ela estava embriagada. Ela explicou: "Eu estava derramando a minha alma diante do Senhor" (1 Samuel 1:15). E, depois daquela oração, seu rosto já não estava triste (1 Samuel 1:18).',
   'Ana mostra traços melancólicos: dor profunda, oração intensa e fidelidade. Ela não fingiu estar bem: levou a sua tristeza inteira para Deus. Mais tarde, deu à luz Samuel e o consagrou ao Senhor, cantando um lindo louvor (1 Samuel 2:1-10).',
   'A paz de Ana chegou antes da resposta. Às vezes, o milagre começa no coração: quando entregamos a dor a Deus, recebemos descanso mesmo sem saber o que vai acontecer.'],
  you:{sanguinea:'Aprenda com Ana a orar com profundidade, não só com palavras.',colerica:'Aprenda com Ana a entregar o que você não controla.',melancolica:'Ana mostra que você pode levar a dor inteira a Deus.',fleumatica:'Ana mostra que é bom colocar para fora o que você guarda.'},
  try:'Escreva uma oração honesta sobre algo que dói e entregue a Deus.',pray:'Senhor, eu derramo a minha alma diante de ti.',
  src:'1 Samuel 1:1-2:10.'},
 {id:'w4',title:'Débora: liderança com fé',cat:'mulheres',cats:['mulheres','temperamentos'],prefs:['Mulheres da Bíblia','Propósito'],
  body:['Débora era profetisa e julgava Israel. As pessoas iam até ela, debaixo de uma palmeira, para resolver suas questões (Juízes 4:4-5). Num tempo de opressão, Deus a usou para chamar Baraque para a batalha.',
   'Quando Baraque disse que só iria se ela fosse junto, Débora respondeu: "Irei com você" (Juízes 4:9). Depois da vitória, ela compôs um cântico que dá toda a glória a Deus (Juízes 5).',
   'Débora lembra o temperamento colérico: coragem, iniciativa e liderança. Mas sua força vinha da fé. Ela não liderou para se exaltar, e sim para cumprir o que Deus tinha dito.',
   'Se você tem facilidade para liderar, Débora mostra o caminho: ouvir a Deus primeiro, encorajar outras pessoas a assumirem seus lugares e celebrar a vitória como obra dele.'],
  you:{sanguinea:'Aprenda com Débora a firmeza na missão.',colerica:'Débora mostra que liderar é encorajar outros a crescerem.',melancolica:'Aprenda com Débora a agir quando Deus fala.',fleumatica:'Débora mostra que você também pode dar o primeiro passo.'},
  try:'Encoraje alguém a assumir uma responsabilidade que ela tem medo de assumir.',pray:'Senhor, que a minha liderança te glorifique.',
  src:'Juízes 4-5.'},
 {id:'w5',title:'Marta: do servir aflito ao servir em paz',cat:'mulheres',cats:['mulheres','dores'],prefs:['Mulheres da Bíblia','Servir na igreja'],
  body:['Marta recebeu Jesus em casa e se ocupou com muitos preparativos. Ao ver a irmã Maria sentada aos pés dele, reclamou: "Senhor, não te importas que minha irmã tenha me deixado sozinha com o serviço?" (Lucas 10:40).',
   'Jesus respondeu com carinho: "Marta! Marta! Você está preocupada e inquieta com muitas coisas; todavia apenas uma é necessária. Maria escolheu a boa parte" (Lucas 10:41-42). Ele não condenou o serviço, mas a ansiedade.',
   'Marta mostra traços coléricos: praticidade, iniciativa e responsabilidade. E sua história não termina ali. Quando Lázaro morreu, foi Marta quem correu ao encontro de Jesus e fez uma das declarações de fé mais fortes dos Evangelhos: "Eu tenho crido que tu és o Cristo, o Filho de Deus" (João 11:27).',
   'Marta continuou servindo (João 12:2), mas agora com outro coração. A lição é que servir é lindo quando nasce da presença de Jesus, e não da pressão de fazer tudo.'],
  you:{sanguinea:'Aprenda com Marta a terminar o que começa.',colerica:'Marta é o seu espelho: sirva, mas sente-se aos pés de Jesus primeiro.',melancolica:'Aprenda com Marta a falar com Jesus sobre o que te incomoda.',fleumatica:'Aprenda com Marta a iniciativa de ir ao encontro de Jesus.'},
  try:'Antes da sua primeira tarefa amanhã, sente-se 5 minutos só para estar com Deus.',pray:'Jesus, quero escolher a boa parte.',
  src:'Lucas 10:38-42; João 11:20-27; João 12:2.'},
 {id:'w6',title:'Maria de Betânia: aos pés de Jesus',cat:'mulheres',cats:['mulheres'],prefs:['Mulheres da Bíblia','Rotina com Deus'],
  body:['Enquanto a casa estava agitada, Maria sentou-se aos pés de Jesus para ouvir o que ele dizia (Lucas 10:39). Jesus defendeu a escolha dela: era a boa parte, que não lhe seria tirada.',
   'Quando o irmão Lázaro morreu, Maria também caiu aos pés de Jesus, chorando (João 11:32). E, antes da crucificação, derramou um perfume muito caro sobre ele, num gesto de adoração que encheu a casa de fragrância (João 12:3).',
   'Maria lembra o temperamento fleumático e melancólico: calma, presença e profundidade. Ela não fazia muito barulho, mas entendia o que importava.',
   'Num mundo apressado, Maria nos ensina que estar com Jesus não é perda de tempo. É de lá que vem a força para tudo o resto.'],
  you:{sanguinea:'Aprenda com Maria o silêncio diante de Deus.',colerica:'Aprenda com Maria a parar antes de fazer.',melancolica:'Maria mostra que a sua adoração profunda é preciosa.',fleumatica:'Maria é o seu espelho: sua calma é um lugar de encontro com Jesus.'},
  try:'Fique 10 minutos em silêncio, sem celular, lendo um trecho dos Evangelhos.',pray:'Jesus, quero ficar aos teus pés.',
  src:'Lucas 10:38-42; João 11:28-32; João 12:1-8.'},
 {id:'w7',title:'Abigail: sabedoria que pacifica',cat:'mulheres',cats:['mulheres','relacionamentos'],prefs:['Mulheres da Bíblia','Relacionamentos'],
  body:['Abigail era casada com Nabal, um homem rico e grosseiro. Quando Nabal humilhou Davi e seus homens, Davi decidiu se vingar (1 Samuel 25).',
   'Ao saber, Abigail agiu rápido: preparou provisões, foi ao encontro de Davi e falou com humildade e sabedoria, lembrando a ele quem Deus o tinha chamado para ser. Davi louvou a Deus e reconheceu o bom senso dela (1 Samuel 25:32-33).',
   'Abigail mostra que pacificar não é se omitir. Ela lembra o melhor do temperamento fleumático, a busca pela paz, unido à iniciativa. Agiu na hora certa, com as palavras certas.',
   'Talvez você viva relações difíceis. A história de Abigail não manda aceitar tudo calada: mostra que a sabedoria, a coragem e a palavra mansa podem evitar tragédias e proteger pessoas.'],
  you:{sanguinea:'Aprenda com Abigail a escolher bem as palavras.',colerica:'Aprenda com Abigail que a resposta mansa vence batalhas.',melancolica:'Abigail mostra que agir rápido também pode ser sábio.',fleumatica:'Abigail é o seu espelho: paz com iniciativa.'},
  try:'Numa conversa tensa, responda com calma e uma palavra que construa.',pray:'Senhor, me dá sabedoria para pacificar.',
  src:'1 Samuel 25; Provérbios 15:1.'},
 {id:'w8',title:'Miriã: louvor e palavras',cat:'mulheres',cats:['mulheres'],prefs:['Mulheres da Bíblia','Comparação'],
  body:['Miriã, irmã de Moisés e Arão, aparece na Bíblia como profetisa. Depois que Israel atravessou o mar, ela pegou um tamborim e liderou as mulheres em louvor e dança (Êxodo 15:20-21).',
   'Muitos estudiosos entendem que foi ela a irmã que vigiou o cesto de Moisés no rio e falou com a filha do faraó (Êxodo 2:4-8): uma menina esperta e comunicativa.',
   'Mas Miriã também errou. Junto com Arão, falou contra Moisés e questionou a autoridade dele, e foi corrigida por Deus (Números 12). Moisés orou por ela, e ela foi restaurada.',
   'Miriã lembra o temperamento sanguíneo: alegria, liderança no louvor e palavras rápidas. Sua história mostra que a mesma boca que louva precisa ser guardada da crítica e da comparação.'],
  you:{sanguinea:'Miriã é o seu espelho: louve com alegria e guarde as palavras.',colerica:'Aprenda com Miriã a lidar com a autoridade dos outros.',melancolica:'Aprenda com Miriã a celebrar as vitórias.',fleumatica:'Aprenda com Miriã a se expressar no louvor.'},
  try:'Cante um louvor hoje e transforme uma crítica em oração.',pray:'Senhor, que a minha boca te louve e edifique.',
  src:'Êxodo 2:4-8; Êxodo 15:20-21; Números 12.'},
 {id:'w9',title:'A samaritana: a história que vira testemunho',cat:'mulheres',cats:['mulheres','dores'],prefs:['Mulheres da Bíblia','Identidade'],
  body:['Ela foi buscar água ao meio-dia, num horário em que quase ninguém ia ao poço. Ali, Jesus pediu água e começou uma conversa que mudou a sua vida (João 4).',
   'Jesus conhecia toda a história dela, inclusive as partes de que ela se envergonhava. Mesmo assim, ofereceu "água viva" e se revelou como o Messias.',
   'A samaritana deixou o cântaro e correu para a cidade: "Venham ver um homem que me disse tudo o que tenho feito" (João 4:29). Muitos creram por causa do seu testemunho (João 4:39). Ela mostra traços sanguíneos: espontaneidade e comunicação.',
   'Sua história lembra que o seu passado não desqualifica você. Quando encontramos Jesus, a vergonha vira testemunho, e a nossa voz pode levar outras pessoas até ele.'],
  you:{sanguinea:'A samaritana é o seu espelho: sua comunicação pode levar pessoas a Jesus.',colerica:'Aprenda com ela a humildade de reconhecer a própria história.',melancolica:'Ela mostra que Jesus acolhe as partes que você esconde.',fleumatica:'Ela mostra que vale a pena compartilhar o que Deus fez.'},
  try:'Conte a alguém uma coisa que Deus fez na sua vida.',pray:'Jesus, transforma a minha história em testemunho.',
  src:'João 4:1-42.'},
 {id:'w10',title:'Maria, mãe de Jesus: o sim que guarda no coração',cat:'mulheres',cats:['mulheres'],prefs:['Mulheres da Bíblia','Propósito'],
  body:['Maria era uma jovem de Nazaré quando o anjo anunciou que ela seria a mãe do Salvador. Mesmo sem entender tudo, respondeu: "Sou serva do Senhor; que aconteça comigo conforme a tua palavra" (Lucas 1:38).',
   'Depois do nascimento de Jesus, a Bíblia diz que Maria guardava todas aquelas coisas e meditava sobre elas no coração (Lucas 2:19). Ela vivia com profundidade e calma.',
   'Em Caná, quando faltou vinho, Maria orientou os servos: "Façam tudo o que ele lhes mandar" (João 2:5). E esteve ao pé da cruz, presente na dor (João 19:25).',
   'Maria nos ensina a dizer sim a Deus mesmo sem ter todas as respostas, a meditar no que ele faz e a apontar sempre para Jesus.'],
  you:{sanguinea:'Aprenda com Maria a meditar antes de falar.',colerica:'Aprenda com Maria a confiar sem controlar.',melancolica:'Maria mostra que guardar no coração pode ser adoração, não preocupação.',fleumatica:'Aprenda com Maria a dizer sim com coragem.'},
  try:'Anote algo que Deus fez esta semana e medite sobre isso antes de dormir.',pray:'Senhor, que aconteça comigo conforme a tua palavra.',
  src:'Lucas 1:26-38; Lucas 2:19; João 2:1-5; João 19:25.'},
 {id:'w11',title:'Sara: do riso de dúvida ao riso de alegria',cat:'mulheres',cats:['mulheres','dores'],prefs:['Mulheres da Bíblia','Fé e dúvidas'],
  body:['Sara esperou décadas pelo filho prometido. Cansada de esperar, sugeriu que Abraão tivesse um filho com a serva Agar, e isso trouxe muito sofrimento para a família (Gênesis 16).',
   'Já idosa, ouviu que teria um filho e riu por dentro, sem acreditar (Gênesis 18:12). Deus respondeu: "Existe alguma coisa impossível para o Senhor?" (Gênesis 18:14).',
   'Quando Isaque nasceu, Sara disse: "Deus me encheu de riso" (Gênesis 21:6). E Hebreus a lembra como uma mulher de fé, que considerou fiel aquele que tinha prometido (Hebreus 11:11).',
   'A história de Sara é para quem está cansada de esperar. Ela mostra que a dúvida não cancela a promessa de Deus, e que tentar resolver tudo do nosso jeito pode trazer dor. Esperar em Deus também é fé.'],
  you:{sanguinea:'Aprenda com Sara a paciência na espera.',colerica:'Sara é um alerta: não force o que Deus prometeu fazer.',melancolica:'Sara mostra que Deus é paciente com as nossas dúvidas.',fleumatica:'Aprenda com Sara a continuar crendo mesmo depois de muito tempo.'},
  try:'Escreva uma promessa ou um sonho que você entregou a Deus e ore por ele com confiança.',pray:'Senhor, eu creio; ajuda-me na espera.',
  src:'Gênesis 16; 18:9-15; 21:1-7; Hebreus 11:11.'},
 {id:'w12',title:'Lídia: um coração aberto e uma casa aberta',cat:'mulheres',cats:['mulheres','relacionamentos'],prefs:['Mulheres da Bíblia','Servir na igreja'],
  body:['Lídia era uma comerciante de tecidos de púrpura, da cidade de Tiatira, que adorava a Deus. Num sábado, à beira de um rio em Filipos, ouviu Paulo falar sobre Jesus (Atos 16:13-14).',
   'A Bíblia diz que o Senhor abriu o coração dela para atender ao que Paulo dizia. Lídia foi batizada com toda a sua casa e insistiu para que os missionários se hospedassem com ela (Atos 16:15).',
   'Sua casa virou ponto de encontro dos irmãos em Filipos (Atos 16:40). Lídia mostra traços coléricos e sanguíneos: iniciativa, generosidade e hospitalidade.',
   'Ela lembra que o trabalho, os recursos e a casa podem servir ao Reino. Hospitalidade é um dom que abre caminho para o evangelho.'],
  you:{sanguinea:'Lídia mostra como a sua hospitalidade pode servir a Deus.',colerica:'Aprenda com Lídia a usar o seu trabalho e os seus recursos para o Reino.',melancolica:'Aprenda com Lídia a abrir a casa e o coração.',fleumatica:'Lídia mostra que receber pessoas é uma forma linda de servir.'},
  try:'Convide alguém para um café, uma refeição ou uma oração na sua casa.',pray:'Senhor, abre o meu coração e a minha casa.',
  src:'Atos 16:11-15, 40.'}
];

const PAIN_TEXTS=[
 {id:'d1',title:'Comparação: quando a vida da outra parece melhor',prefs:['Comparação','Identidade'],
  body:['Você abre o celular e vê a amiga da igreja com a casa perfeita, o ministério crescendo, o casamento lindo. Em segundos, a sua vida parece pequena. A comparação rouba a alegria e faz a gente esquecer o que Deus já fez.',
   'Paulo escreveu: "Cada um examine os próprios atos, e então poderá orgulhar-se de si mesmo, sem se comparar com ninguém" (Gálatas 6:4). Deus não te chamou para viver a história de outra pessoa, e sim a sua.',
   'Cada temperamento se compara de um jeito. A sanguínea compara popularidade e atenção. A colérica compara resultados e conquistas. A melancólica compara qualidade e se sente sempre abaixo. A fleumática compara pouco, mas pode desistir de tentar, achando que outras fazem melhor.',
   'Miriã e Arão se compararam a Moisés e caíram na crítica (Números 12). O antídoto é a gratidão: olhar para o que Deus colocou nas suas mãos e celebrar o que ele faz na vida das outras, sem competir.'],
  you:{sanguinea:'Use as redes para encorajar, não para medir sua aceitação.',colerica:'Seu valor não está nos seus resultados.',melancolica:'Pare de medir a sua vida pelos destaques da vida dos outros.',fleumatica:'Não desista do seu chamado por achar que outras fazem melhor.'},
  try:'Fique um dia sem rolar o feed e anote 5 coisas que Deus te deu.',pray:'Senhor, me livra da comparação e me enche de gratidão.',
  src:'Gálatas 6:4-5; Números 12.'},
 {id:'d2',title:'Ansiedade e medo do futuro',prefs:['Ansiedade','Saúde emocional'],
  body:['Ansiedade é aquele aperto no peito, a mente que não para e o futuro que parece ameaçador. Ela atinge muitas mulheres cristãs, e não é sinal de que você tem pouca fé.',
   'A Bíblia trata a ansiedade com carinho: "Não andem ansiosos por coisa alguma, mas em tudo, pela oração e súplicas, e com ação de graças, apresentem seus pedidos a Deus. E a paz de Deus, que excede todo o entendimento, guardará o coração e a mente de vocês" (Filipenses 4:6-7). E também: "Lancem sobre ele toda a sua ansiedade, porque ele tem cuidado de vocês" (1 Pedro 5:7).',
   'Na sanguínea, a ansiedade aparece como agitação e fuga para distrações. Na colérica, como necessidade de controlar tudo. Na melancólica, como pensamentos repetitivos e medo do pior. Na fleumática, como paralisia e adiamento.',
   'Oração, Palavra, descanso, movimento e conversa com pessoas de confiança ajudam muito. Se a ansiedade estiver forte, frequente ou atrapalhando a sua vida, procure também um psicólogo ou médico. Cuidar da mente é cuidar do templo que Deus te deu.'],
  you:{sanguinea:'Em vez de fugir para o celular, pare 2 minutos para respirar e orar.',colerica:'Escreva o que é seu e o que é de Deus, e entregue a segunda lista.',melancolica:'Quando a mente for para o pior, pergunte: "O que é verdade agora?".',fleumatica:'Dê um passo pequeno na decisão que você está adiando.'},
  try:'Respire devagar por 2 minutos (inspire em 4 segundos, solte em 6) e ore Filipenses 4:6-7.',pray:'Senhor, eu lanço sobre ti toda a minha ansiedade.',
  src:'Filipenses 4:6-7; 1 Pedro 5:7; Mateus 6:34. Em crise, ligue para o CVV: 188.'},
 {id:'d3',title:'Perfeccionismo e culpa: nunca boa o bastante',prefs:['Identidade','Saúde emocional'],
  body:['Você revisa tudo mil vezes, se cobra por cada falha e sente que nunca é boa o bastante: como cristã, mãe, esposa, filha, profissional. A culpa vira companhia constante.',
   'O evangelho é o oposto do perfeccionismo. "Agora já não há condenação para os que estão em Cristo Jesus" (Romanos 8:1). E Jesus disse a Paulo: "Minha graça é suficiente a você, pois o meu poder se aperfeiçoa na fraqueza" (2 Coríntios 12:9).',
   'A melancólica sente o perfeccionismo como autocrítica. A colérica, como cobrança de desempenho. A sanguínea sente culpa por não cumprir promessas. A fleumática, por não ter feito o que devia.',
   'Diferencie culpa de convicção. A convicção do Espírito aponta um ponto específico e leva ao arrependimento e à paz. A culpa sem fim acusa tudo e leva ao desânimo. Deus corrige como Pai, não como carrasco.'],
  you:{sanguinea:'Prometa menos e cumpra com alegria.',colerica:'Você não é o que você produz.',melancolica:'Feito com amor vale mais do que perfeito e parado.',fleumatica:'Comece imperfeito, mas comece.'},
  try:'Entregue algo hoje sem revisar pela décima vez.',pray:'Pai, eu descanso na tua graça e não na minha perfeição.',
  src:'Romanos 8:1; 2 Coríntios 12:9; 1 João 1:9.'},
 {id:'d4',title:'Identidade: quem eu sou em Cristo',prefs:['Identidade'],
  body:['Muitas de nós buscamos identidade no corpo, no relacionamento, no ministério, nos filhos, no trabalho ou na opinião dos outros. Quando algo disso falha, parece que nós falhamos.',
   'Deus diz outra coisa: "Eu te louvo porque me fizeste de modo especial e admirável" (Salmos 139:14). "Somos criação de Deus realizada em Cristo Jesus para fazermos boas obras" (Efésios 2:10). E ainda: "Eu o chamei pelo nome; você é meu" (Isaías 43:1).',
   'Seu temperamento faz parte de como Deus te criou, mas não é a sua identidade. A sanguínea não é "a engraçada", a colérica não é "a que resolve", a melancólica não é "a sensível demais", a fleumática não é "a que nunca reclama". Vocês são filhas amadas.',
   'Quando a identidade está firme em Cristo, você pode reconhecer fraquezas sem se destruir e celebrar forças sem se exaltar.'],
  you:{sanguinea:'Seu valor não depende de ser notada.',colerica:'Seu valor não depende de ser útil.',melancolica:'Seu valor não depende de ser perfeita.',fleumatica:'Seu valor não depende de agradar a todos.'},
  try:'Escreva Salmos 139:14 num papel e cole no espelho.',pray:'Senhor, eu sou tua. Firma a minha identidade em ti.',
  src:'Salmos 139:13-16; Efésios 2:10; Isaías 43:1.'},
 {id:'d5',title:'Cansaço de servir: quando a alma esgota',prefs:['Servir na igreja','Saúde emocional'],
  body:['Ministério, casa, trabalho, filhos, pais, células, eventos. Muitas mulheres cristãs servem tanto que esquecem de ser cuidadas. O cansaço vira irritação, e o serviço perde a alegria.',
   'Jesus convida: "Venham a mim, todos os que estão cansados e sobrecarregados, e eu darei descanso a vocês" (Mateus 11:28). E lembrou a Marta que uma coisa é necessária: estar com ele (Lucas 10:41-42).',
   'A colérica se esgota porque não para. A sanguínea, porque diz sim a tudo. A melancólica, porque quer fazer tudo perfeito. A fleumática, porque não consegue dizer não e não pede ajuda.',
   'Até Jesus se retirava para orar (Marcos 1:35). Descanso não é preguiça: é confiança. Servir a partir do descanso em Deus é muito diferente de servir para provar o próprio valor.'],
  you:{sanguinea:'Antes do próximo sim, ore e confira sua agenda.',colerica:'Descansar também é obediência.',melancolica:'Faça bem feito o essencial e solte o resto.',fleumatica:'Peça ajuda: você não precisa carregar sozinha.'},
  try:'Marque na agenda um momento desta semana só para descansar com Deus.',pray:'Jesus, eu venho a ti cansada. Dá-me o teu descanso.',
  src:'Mateus 11:28-30; Lucas 10:38-42; Marcos 1:35.'},
 {id:'d6',title:'Dizer não e colocar limites',prefs:['Limites','Relacionamentos'],
  body:['Você aceita mais um compromisso, mais uma tarefa, mais um favor, mesmo sem ter tempo ou energia. Depois fica cansada, ressentida e com culpa por estar ressentida.',
   'Jesus disse: "Seja o seu sim, sim, e o seu não, não" (Mateus 5:37). Ele mesmo disse não: quando todos o procuravam, saiu para orar e decidiu ir para outros lugares (Marcos 1:35-38).',
   'A fleumática tem mais dificuldade de dizer não, para evitar conflito. A sanguínea diz sim no entusiasmo. A melancólica diz sim por culpa. A colérica diz sim porque acha que ninguém faz melhor.',
   'Limites não são egoísmo: são mordomia do tempo e da energia que Deus te deu. Um não dito com amor protege o seu sim para o que realmente importa.'],
  you:{sanguinea:'Espere um dia antes de aceitar algo novo.',colerica:'Delegue em vez de assumir tudo.',melancolica:'Um não com amor não é pecado.',fleumatica:'Treine dizer "agora não consigo" com calma.'},
  try:'Diga um não gentil hoje para algo que não é prioridade.',pray:'Senhor, me ensina a dizer sim e não segundo a tua vontade.',
  src:'Mateus 5:37; Marcos 1:35-38; Eclesiastes 3:1.'},
 {id:'d7',title:'Raiva, impaciência e palavras duras',prefs:['Relacionamentos','Saúde emocional'],
  body:['Você explode com os filhos, responde atravessado ao marido, fala duro com a amiga. Depois vem a culpa. A raiva em si não é pecado, mas o que fazemos com ela pode ferir.',
   'Tiago aconselha: "Sejam todos prontos para ouvir, tardios para falar e tardios para irar-se, pois a ira do homem não produz a justiça de Deus" (Tiago 1:19-20). E Provérbios ensina: "A resposta calma desvia a fúria, mas a palavra ríspida desperta a ira" (Provérbios 15:1).',
   'Na colérica, a raiva é rápida e direta. Na sanguínea, explode e passa. Na melancólica, vira mágoa guardada e frieza. Na fleumática, fica escondida até virar silêncio e afastamento.',
   'Paulo orienta: "Quando vocês ficarem irados, não pequem. Apazíguem a sua ira antes que o sol se ponha" (Efésios 4:26). Dar nome ao sentimento, respirar, orar e conversar depois, com calma, transforma a raiva em diálogo.'],
  you:{sanguinea:'Conte até dez antes de responder.',colerica:'Peça perdão rápido quando falar duro.',melancolica:'Fale da mágoa antes que ela endureça.',fleumatica:'Coloque em palavras o que te incomoda, com calma.'},
  try:'Em um momento de irritação hoje, saia por 2 minutos e ore antes de falar.',pray:'Senhor, guarda a minha boca e acalma o meu coração.',
  src:'Tiago 1:19-20; Provérbios 15:1; Efésios 4:26.'},
 {id:'d8',title:'Mágoas, perdão e feridas da igreja',prefs:['Perdão','Relacionamentos'],
  body:['Algumas das feridas mais profundas acontecem justamente na igreja: uma liderança que machucou, uma amiga que traiu, uma palavra de julgamento. Isso dói em dobro, porque esperávamos amor.',
   'A Bíblia nos chama a perdoar: "Perdoem como o Senhor lhes perdoou" (Colossenses 3:13). E também a tirar do coração a amargura (Efésios 4:31-32). Perdoar não é dizer que não doeu, nem voltar a confiar de imediato: é entregar a dívida a Deus.',
   'A melancólica tende a guardar mágoas por muito tempo. A fleumática finge que está tudo bem. A colérica corta relações. A sanguínea esquece rápido, mas pode não tratar a ferida.',
   'O perdão é um processo. Ore pela pessoa, fale com alguém de confiança e, se necessário, coloque limites saudáveis. Em casos de abuso, perdoar não significa permanecer em perigo: procure ajuda.'],
  you:{sanguinea:'Não pule a etapa de olhar a ferida com Deus.',colerica:'Antes de cortar, ore pela pessoa.',melancolica:'Entregue a lista de dívidas a Deus, uma por uma.',fleumatica:'Admita que doeu: isso faz parte do perdão.'},
  try:'Ore pelo nome de alguém que te feriu, mesmo que com poucas palavras.',pray:'Pai, eu entrego a ti essa dor e escolho perdoar.',
  src:'Colossenses 3:13; Efésios 4:31-32; Mateus 18:21-22.'},
 {id:'d9',title:'Medo de não cumprir o propósito de Deus',prefs:['Propósito'],
  body:['"Será que estou no lugar certo?" "Será que perdi o meu chamado?" Muitas mulheres vivem com medo de não estarem cumprindo o propósito de Deus, especialmente quando comparam a própria vida com a de outras.',
   'Deus diz: "Sou eu que conheço os planos que tenho para vocês, planos de dar a vocês esperança e um futuro" (Jeremias 29:11). E Paulo garante: "Aquele que começou boa obra em vocês, vai completá-la" (Filipenses 1:6).',
   'A colérica teme não fazer o suficiente. A melancólica teme errar a vontade de Deus. A sanguínea muda de direção a cada novidade. A fleumática espera um sinal claro e não sai do lugar.',
   'O propósito começa no lugar onde você está: amar a Deus e ao próximo nas tarefas de hoje (Colossenses 3:23). Ester descobriu seu propósito no lugar onde Deus a colocou.'],
  you:{sanguinea:'Escolha um chamado e persevere nele.',colerica:'Propósito não é produtividade.',melancolica:'Deus guia passo a passo; você não precisa ver o fim.',fleumatica:'Dê o próximo passo de obediência, mesmo pequeno.'},
  try:'Escreva: "Hoje, onde estou, posso servir a Deus fazendo..."',pray:'Senhor, eu confio nos teus planos para mim.',
  src:'Jeremias 29:11; Filipenses 1:6; Colossenses 3:23; Ester 4:14.'},
 {id:'d10',title:'Timidez para servir, falar e evangelizar',prefs:['Servir na igreja','Propósito'],
  body:['Você sente vontade de servir, falar de Jesus ou assumir algo na igreja, mas trava. A voz some, a vergonha aparece e você deixa para outra pessoa.',
   'Moisés sentiu isso: "Nunca tive facilidade para falar" (Êxodo 4:10). Deus respondeu que estaria com a boca dele. E Paulo encorajou Timóteo: "Deus não nos deu espírito de covardia, mas de poder, de amor e de equilíbrio" (2 Timóteo 1:7).',
   'A fleumática e a melancólica sentem mais a timidez. A sanguínea fala com facilidade, mas pode ter medo de aprofundar. A colérica tem medo de errar em público.',
   'Servir não exige ser extrovertida. Uma mensagem, uma oração, uma visita, um café: Deus usa todos os jeitos. Comece pequeno e lembre que quem capacita é ele.'],
  you:{sanguinea:'Use a sua facilidade para encorajar quem é tímida.',colerica:'Deixe espaço para outras servirem também.',melancolica:'Sirva com o que você faz bem: escrever, orar, organizar.',fleumatica:'Ofereça um pequeno serviço esta semana.'},
  try:'Mande uma mensagem dizendo a alguém que você está orando por ela.',pray:'Senhor, eu tenho medo, mas confio que tu estás comigo.',
  src:'Êxodo 4:10-12; 2 Timóteo 1:7; 1 Pedro 4:10.'},
 {id:'d11',title:'Controle e dificuldade de confiar',prefs:['Ansiedade','Fé e dúvidas'],
  body:['Você planeja tudo, vigia tudo e tem dificuldade de deixar nas mãos de outras pessoas, e até nas mãos de Deus. Quando algo foge do controle, vem a irritação ou a ansiedade.',
   'Provérbios ensina: "Confie no Senhor de todo o seu coração e não se apoie em seu próprio entendimento" (Provérbios 3:5). E lembra: "Em seu coração o homem planeja o seu caminho, mas o Senhor determina os seus passos" (Provérbios 16:9).',
   'Na colérica, o controle é a forma de garantir resultados. Na melancólica, de evitar erros. Na sanguínea e na fleumática, aparece menos, mas surge como medo quando a vida sai do roteiro.',
   'Sara tentou resolver a promessa do jeito dela e trouxe dor para a família (Gênesis 16). Confiar não é ficar parada: é fazer a sua parte e soltar o resultado.'],
  you:{sanguinea:'Confie em Deus também nos detalhes chatos.',colerica:'Solte o resultado: a vitória vem do Senhor.',melancolica:'Você não precisa prever tudo para estar segura.',fleumatica:'Confiar inclui agir.'},
  try:'Escreva algo que você não controla e ore: "Isso é teu, Senhor".',pray:'Senhor, eu solto o controle e confio em ti.',
  src:'Provérbios 3:5-6; Provérbios 16:9; Gênesis 16.'},
 {id:'d12',title:'Procrastinação e falta de constância',prefs:['Rotina com Deus','Propósito'],
  body:['Você começa a leitura da Bíblia com animação e para na segunda semana. Adia aquele projeto, aquela conversa, aquele cuidado. A falta de constância gera frustração.',
   'Provérbios usa a formiga como exemplo: sem ninguém mandar, ela prepara tudo no tempo certo (Provérbios 6:6-8). E Paulo orienta: "Tudo o que fizerem, façam de todo o coração, como para o Senhor" (Colossenses 3:23).',
   'A sanguínea começa com empolgação e perde o ritmo. A fleumática adia para evitar desconforto. A melancólica adia porque quer fazer perfeito. A colérica procrastina o que não acha importante, como o descanso.',
   'Constância nasce de passos pequenos e repetidos. Um capítulo por dia, cinco minutos de oração, uma tarefa por vez. Deus valoriza a fidelidade no pouco (Lucas 16:10).'],
  you:{sanguinea:'Escolha um hábito só e mantenha por 7 dias.',colerica:'Coloque o descanso na agenda.',melancolica:'Comece antes de estar perfeito.',fleumatica:'Faça os primeiros 5 minutos agora.'},
  try:'Escolha um hábito espiritual de 5 minutos e marque no checklist todos os dias.',pray:'Senhor, me ajuda a ser fiel no pouco.',
  src:'Provérbios 6:6-8; Colossenses 3:23; Lucas 16:10.'},
 {id:'d13',title:'Solidão, inclusive dentro da igreja',prefs:['Relacionamentos','Saúde emocional'],
  body:['É possível estar cercada de gente no culto e, mesmo assim, se sentir sozinha. Pesquisas com cristãos mostram que a solidão é uma dor real, inclusive entre líderes.',
   'Deus vê isso: "Deus dá um lar aos solitários" (Salmos 68:6). E a Bíblia nos chama a cuidar uns dos outros: "Consideremos uns aos outros para incentivar-nos ao amor e às boas obras" (Hebreus 10:24).',
   'A sanguínea sente a solidão quando as conversas são superficiais. A melancólica, quando não encontra profundidade. A colérica, porque raramente mostra fragilidade. A fleumática, porque espera que alguém se aproxime primeiro.',
   'Comunidade se constrói com pequenos passos: um convite, uma pergunta sincera, um pequeno grupo. E, enquanto isso, lembre que Jesus prometeu estar com você todos os dias (Mateus 28:20).'],
  you:{sanguinea:'Aprofunde uma amizade em vez de abrir dez.',colerica:'Mostre a alguém uma fragilidade sua.',melancolica:'Dê uma chance a quem ainda não te conhece bem.',fleumatica:'Dê o primeiro passo e faça o convite.'},
  try:'Convide uma irmã da igreja para um café nesta semana.',pray:'Senhor, me dá amizades verdadeiras e me ajuda a ser uma.',
  src:'Salmos 68:6; Hebreus 10:24-25; Mateus 28:20; Barna Group, pesquisas sobre saúde relacional de cristãos.'},
 {id:'d14',title:'Relacionamentos e casamento com temperamentos diferentes',prefs:['Casamento','Relacionamentos'],
  body:['Ela é sanguínea e ele é melancólico. Ela é colérica e ele é fleumático. As diferenças que atraíram no começo podem virar fonte de brigas no dia a dia.',
   'Paulo orienta: "Sejam completamente humildes e dóceis, e sejam pacientes, suportando uns aos outros com amor" (Efésios 4:2). E Pedro: "Vivam em harmonia uns com os outros; sejam compassivos" (1 Pedro 3:8).',
   'A sanguínea precisa de atenção e conversa. A colérica, de respeito e eficiência. A melancólica, de cuidado e profundidade. A fleumática, de paz e paciência. Entender isso ajuda a não levar tudo para o lado pessoal.',
   'Diferenças não são defeitos: são peças que se completam quando há amor, humildade e diálogo. Conhecer o temperamento do outro é uma forma de amar melhor. Em situações de violência ou abuso, procure ajuda imediatamente.'],
  you:{sanguinea:'Ouça mais do que fala nas conversas difíceis.',colerica:'Pergunte antes de decidir pelo casal ou pela família.',melancolica:'Diga o que precisa em vez de esperar que adivinhem.',fleumatica:'Traga os assuntos difíceis antes que acumulem.'},
  try:'Pergunte a alguém próximo: "O que faz você se sentir amado(a)?"',pray:'Senhor, me ensina a amar as diferenças.',
  src:'Efésios 4:2-3; 1 Pedro 3:8; 1 Coríntios 13:4-7.'},
 {id:'d15',title:'Dúvidas na fé e fases de deserto',prefs:['Fé e dúvidas'],
  body:['Há fases em que a oração parece não passar do teto, a Bíblia parece seca e as perguntas se multiplicam. Muitas mulheres sentem culpa por isso, como se duvidar fosse falta de fé.',
   'Um pai desesperado disse a Jesus: "Creio, ajuda-me a vencer a minha incredulidade!" (Marcos 9:24). E Jesus curou o filho dele. O salmista escreveu: "Por que você está assim tão triste, ó minha alma? Ponha a sua esperança em Deus!" (Salmos 42:5).',
   'A melancólica sente o deserto com intensidade e se questiona muito. A sanguínea sente falta da emoção dos primeiros tempos. A colérica quer resolver as dúvidas rápido. A fleumática pode simplesmente se afastar em silêncio.',
   'O deserto faz parte da caminhada de muitos personagens bíblicos. Continue indo a Deus com honestidade, converse com uma liderança de confiança e lembre: a fidelidade de Deus não depende do que você sente.'],
  you:{sanguinea:'A fé continua mesmo quando a emoção baixa.',colerica:'Dê tempo às perguntas.',melancolica:'Leve as suas dúvidas para Deus, como os salmistas.',fleumatica:'Não se afaste: converse com alguém.'},
  try:'Leia o Salmo 42 em voz baixa e escreva a sua própria versão.',pray:'Senhor, eu creio; ajuda-me na minha incredulidade.',
  src:'Marcos 9:24; Salmos 42; Lamentações 3:22-23.'},
 {id:'d16',title:'Tristeza profunda: fé e cuidado com a saúde mental',prefs:['Saúde emocional','Fé e dúvidas'],
  body:['Às vezes a tristeza não passa. Perde-se a vontade de fazer as coisas, o sono muda, tudo parece pesado. Isso pode ser depressão, e depressão não é falta de fé, fraqueza espiritual nem frescura.',
   'A Bíblia mostra pessoas de muita fé que passaram por momentos sombrios. Elias pediu para morrer depois de uma grande vitória, e Deus cuidou dele com descanso, comida e presença (1 Reis 19:4-8). "O Senhor está perto dos que têm o coração quebrantado" (Salmos 34:18).',
   'Qualquer temperamento pode passar por isso. A melancólica tende a sentir mais os dias escuros, mas sanguíneas, coléricas e fleumáticas também adoecem, muitas vezes escondendo atrás do sorriso, da produtividade ou do silêncio.',
   'Procure ajuda: um psicólogo, um médico e pessoas de confiança da sua igreja. Tratamento e fé caminham juntos. Se você tiver pensamentos de se machucar, ligue agora para o CVV no 188 (24 horas, grátis) ou procure um pronto-socorro.'],
  you:{sanguinea:'Você não precisa sorrir o tempo todo.',colerica:'Pedir ajuda é força, não fraqueza.',melancolica:'Os dias escuros não são o fim da sua história.',fleumatica:'Conte a alguém como você realmente está.'},
  try:'Conte a uma pessoa de confiança como você está se sentindo de verdade.',pray:'Senhor, fica perto do meu coração cansado.',
  src:'1 Reis 19:4-8; Salmos 34:18; Salmos 42. CVV: 188 (24h, grátis). SAMU: 192.'}
];

let AC=null;

function sfx(kind){
 if(!soundOn())return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const notes={tap:[[620,.05]],ok:[[660,.08],[880,.13]],win:[[523,.1],[659,.1],[784,.1],[1047,.28]],soft:[[330,.14]]}[kind]||[];
  let t=AC.currentTime;
  notes.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.85});
 }catch(e){}
 if(kind==='ok')vib(18);if(kind==='win')vib([30,40,60]);if(kind==='soft')vib(40);
}

function countUp(){

  const to=+el.dataset.count||0;el.removeAttribute('data-count');

  requestAnimationFrame(step);

const PUBLIC=['boas-vindas','cadastro','login'];
const TABS=[{id:'hoje',n:'Hoje',ic:'t_hoje'},{id:'combina',n:'Combina',ic:'t_combina'},{id:'checklist',n:'Checklist',ic:'t_check'},{id:'diario',n:'Diário',ic:'t_diario'},{id:'aprender',n:'Aprender',ic:'t_aprender'},{id:'eu',n:'Eu',ic:'t_eu'}];
/* A tela é desenhada direto pelo app; o endereço (#) é só um extra para o botão Voltar.
   Assim o app funciona mesmo em visualizadores que bloqueiam ou não avisam mudanças de endereço. */
function hashRoute(){let h='';try{h=location.hash||''}catch(e){}h=h.replace(/^#\/?/,'').replace('/','-');return h||'boas-vindas'}
const route=()=>ui.route||hashRoute();
function setHash(r,push){
 try{if(location.hash==='#'+r)return}catch(e){return}
 ui.ownHash='#'+r;
 try{if(push)location.hash=r;else history.replaceState(null,'','#'+r)}
 catch(e){try{location.replace('#'+r)}catch(e2){ui.ownHash=null}}
}
function go(r){ui.route=r;render();setHash(r,true)}
function stepFor(u){if(!u.paid)return 'pagamento';if(!u.testDone)return 'teste';if(!u.prefsDone)return 'personalizacao';return 'app-hoje'}
function allowed(r,u){
 if(!u)return PUBLIC.includes(r)?r:'boas-vindas';
 if(PUBLIC.includes(r))return stepFor(u);
 if(r==='pagamento')return u.paid?stepFor(u):r;
 if(!u.paid)return 'pagamento';
 if(r==='teste')return u.testDone?stepFor(u):r;
 if(!u.testDone)return 'teste';
 if(r==='personalizacao')return r;
 if(!u.prefsDone)return 'personalizacao';
 if(r==='resultado')return r;
 if(TABS.some(t=>'app-'+t.id===r)||r==='app-board')return r;
 return 'app-hoje';
}
const APP=()=>document.getElementById('app');
function render(){
 clearInterval(ui.pixTimer);
 try{
  const u=U();const want=route();const r=allowed(want,u);
  if(r!==want){ui.route=r;setHash(r,false)}
  if(r!=='personalizacao')ui.prefs=null;
  if(r!=='teste')ui.q=null;
  let html='';
  if(r==='boas-vindas')html=vWelcome();
  else if(r==='cadastro'||r==='login')html=vAuth(r);
  else if(r==='pagamento')html=vPay(u);
  else if(r==='teste')html=vTest(u);
  else if(r==='personalizacao')html=vPrefs(u);
  else if(r==='resultado')html=vResult(u);
  else html=vApp(u,r.slice(4));
  APP().innerHTML=html;
  if(ui.lastRoute!==r)window.scrollTo(0,0);
  ui.lastRoute=r;
  after(r,u);
 }catch(e){
  console.error(e);
  APP().innerHTML=brand()+`<main class="screen"><div class="empty">${mascot('sad',120)}<h1 class="h1 mt-4">Opa, tropecei aqui!</h1><p class="muted mt-2">Seus dados estão seguros. Vamos voltar para um lugar conhecido?</p><button class="btn btn-primary mt-6" data-act="hardHome">Voltar ao início</button></div></main>`;
 }
}
function after(r,u){
 countUp();ui.justPicked=false;
 if(r==='app-board')paintBoards();
 if(r==='pagamento'&&PAY.mode==='real'&&u&&u.pix)ui.pixTimer=setInterval(()=>pixCheck(true),5000);
 if(r==='resultado'&&u&&!u.resultSeen){u.resultSeen=true;save();setTimeout(()=>{confetti();sfx('win')},250)}
 if(ui.scrollTo){const el=document.getElementById(ui.scrollTo);ui.scrollTo=null;if(el)setTimeout(()=>el.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'}),80)}
}

function qrSvg(){
 const n=25;let r='';let seed=1290;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const inF=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inF(x,y))continue;if(rnd()>.5)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="${C.T}"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="${C.T}"/>`;
 return `<svg viewBox="-1 -1 ${n+2} ${n+2}" width="190" height="190" shape-rendering="crispEdges" role="img" aria-label="QR Code PIX"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><g fill="${C.T}">${r}</g>${fin(0,0)}${fin(n-7,0)}${fin(0,n-7)}</svg>`;
}

async function pixCheck(silent){
 const u=U();if(!u||!u.pix||ui.pixChecking)return;
 ui.pixChecking=true;const r=await api('pix-status?id='+encodeURIComponent(u.pix.id));ui.pixChecking=false;
 if(r.ok&&r.data.paid){unlockPaid(u,'pix');return}
 const st=r.data&&r.data.status;
 if(['cancelled','rejected','expired','refunded','charged_back'].includes(st)){u.pix=null;save();render();toast('Esse PIX expirou ou foi cancelado. Gere um novo para continuar.');return}
 if(!silent){if(r.status===0)toast('Sem conexão agora. Tente de novo em instantes.');else infoBox({title:'Ainda não recebemos',text:'Pode levar alguns segundos depois de pagar. Continuamos verificando sozinhos, não precisa gerar outro PIX.',mood:'think'})}
}
function unlockPaid(u,method){
 if(CONFIG.metodo==='codigo'&&method!=='codigo')return;
 u.paid=true;u.payMethod=method;u.payDate=today();u.pix=null;save();clearInterval(ui.pixTimer);
 sfx('win');confetti();
 openModal(()=>`<div class="text-center">${mascot('celebrate',130,'hop')}<h2 class="display mt-3">Pagamento aprovado!</h2><p class="muted mt-2">Seu acesso de 1 ano está liberado. Agora vem a parte mais gostosa: te conhecer.</p></div><button class="btn btn-primary mt-6" data-act="afterPay" autofocus>Começar o teste</button>`,{center:true,lock:true});
}

/* 4. Teste (formato lição) */
function vTest(u){
 if(ui.q==null||ui.q<0||ui.q>N_Q-1){const i=u.answers.findIndex(a=>!a);ui.q=i<0?N_Q-1:i}
 const i=ui.q,q=QUESTIONS[i],a=u.answers[i];
 const answered=u.answers.filter(Boolean).length;const pct=Math.round(answered/N_Q*100);
 const opts=q.o.map((o,j)=>({...o,r:((i+3)*7+j*13)%17})).sort((x,y)=>x.r-y.r); // ordem embaralhada fixa
 const lines=['Sem resposta certa ou errada: só a sua verdade.','Escolha o que mais parece com você no dia a dia.','A primeira ideia costuma ser a mais sincera.','Deus te conhece por inteiro. Responda sem medo.','Pense em como você é, não em como gostaria de ser.','Já passamos de um terço!','Metade do caminho! Você está indo muito bem.','Essa diz muito sobre o seu jeito.','Sem julgamentos aqui.','Faltam só três.','Quase lá!','Última! Capricha.'];
 const say=a?'Anotado!':lines[i]||'';
 return brand(`<button class="ibtn" data-act="quitTest" aria-label="Pausar teste">${ic('x',22)}</button>`)+`<main class="screen pt-4">
  ${u.migrated&&answered===0?`<div class="card mb-5" style="background:#E4EBE0;border:0"><b>O Orivie foi atualizado!</b><p class="small mt-1" style="font-weight:400">Agora o teste mostra o seu temperamento à luz da fé. Seu pagamento e seus dados continuam salvos.</p></div>`:''}
  <h2 class="h1" style="font-size:26px">Pergunta ${i+1} de ${N_Q}</h2>
  <div class="flex items-center gap-3 mt-3"><div class="prog" role="progressbar" aria-label="Progresso do teste" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="pct">${pct}%</span></div>
  <h1 class="h1 mt-6 mb-5">${q.q}</h1>
  <div class="flex flex-col gap-3" role="radiogroup" aria-label="${esc(q.q)}">
   ${opts.map((o,j)=>{const sel=a===o.k;return `<button class="tile ${sel?'sel':''} ${sel&&ui.justPicked?'pop':''}" role="radio" aria-checked="${sel}" data-act="answer" data-k="${o.k}"><span class="key">${'ABCD'[j]}</span><span style="flex:1">${o.t}</span></button>`}).join('')}
  <p class="small muted text-center mt-5" style="font-weight:400">${say}</p>
  </div>
 </main>
 <footer class="footbar"><button class="btn btn-outline" style="flex:0 0 36%" data-act="qBack" ${i===0?'disabled':''}>Voltar</button><button class="btn btn-primary" data-act="qNext" ${a?'':'disabled'}>${i===N_Q-1?'Ver resultado':'Continuar'}</button></footer>`;
}

  case 'semana':{const st=streakOf(u);const cl=u.checklist||{items:[]};const done=cl.items.filter(i=>i.done).length;const days=weekDays().filter(d=>u.days.includes(ymd(d))).length;

/* ---- Aba Hoje ---- */
function ring(r){const L=2*Math.PI*44;return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="${C.BE}" stroke-width="7"/><circle cx="50" cy="50" r="44" fill="none" stroke="${C.TE}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(L*Math.max(.03,Math.min(1,r))).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 50 50)"/></svg>`}
function weekDays(){const now=new Date();const dow=(now.getDay()+6)%7;const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);return Array.from({length:7},(_,i)=>new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i))}
function dayState(u,k){const t=today();const act=u.days.includes(k);if(k<t&&!act&&k<(u.created||t))return 'before';return k<t?(act?'done':'missed'):k===t?(act?'done':'current'):'locked'}
function weekTrail(u){
 const offs=[0,45,70,45,0,-45,-70];const cl=u.checklist;const ratio=cl.items.length?cl.items.filter(i=>i.done).length/cl.items.length:0;
 const th=prof(u).themes[isoWeek()%4];
 const rows=weekDays().map((d,i)=>{const k=ymd(d);const st=dayState(u,k);
  const icn=st==='done'?ic('tick',30):st==='locked'?ic('lock',24):st==='current'?ic('starc',30):ic('leaf',26);
  const lab={done:'concluído',missed:'em branco',before:'antes de você chegar',current:'hoje, a fazer',locked:'ainda não chegou'}[st];
  return `<div class="trow" style="transform:translateX(${offs[i]}px)">${st==='current'?`<span class="balloon">Começar</span>${ring(ratio)}`:''}<button class="node ${st==='before'?'missed':st}" data-act="dayInfo" data-d="${k}" aria-label="${DIAS[d.getDay()]}: ${lab}">${icn}</button><span class="node-cap">${k===today()?'Hoje':DIAS[d.getDay()].slice(0,3)}</span></div>`}).join('');
 return `<section class="mt-6" id="semana"><div class="unit-head"><div><p class="unit-kicker">Semana ${isoWeek()} · Tema da semana</p><h2 class="unit-title">${th.t}</h2></div><button class="btn btn-outline btn-sm" data-act="guide" data-v="semana">${ic('bookc',16)} Guia</button></div>
 <div class="trail">${rows}<div class="trail-pal left">${mascot(new Date().getHours()>=22||new Date().getHours()<5?'sleep':'happy',62,'floaty')}</div><div class="trail-pal right">${mascot('think',56)}</div></div></section>`;
}
function tHoje(u){
 const p=prof(u);const h=new Date().getHours();
 const g=h>=5&&h<12?'Bom dia':h>=12&&h<18?'Boa tarde':'Boa noite';
 const phrase=p.phrases[dayOfYear()%p.phrases.length];const th=p.themes[isoWeek()%4];const vd=p.verses[dayOfYear()%p.verses.length];const pr=p.prayers[dayOfYear()%p.prayers.length];
 const cl=u.checklist;const done=cl.items.filter(i=>i.done).length,tot=cl.items.length;const pct=tot?Math.round(done/tot*100):0;

async function drawBoard(cv,b){
 if(!cv||!b)return;
 const tok=(cv._tok=(cv._tok||0)+1);
 try{
  await Promise.all([loadFonts(),loadScrapFonts()]);
  const imgs=(await Promise.all((b.photos||[]).map(loadImg))).filter(Boolean);
  const stk=(await Promise.all((b.stickers||[]).map(id=>{const st=STICKERS.find(s=>s.id===id);return st?loadImg(svgUrl(st.svg)).then(im=>im&&{st,im}):null}))).filter(Boolean);
  if(cv._tok!==tok)return;
  const ctx=cv.getContext('2d');const sc=cv.width/1080;ctx.setTransform(sc,0,0,sc,0,0);
  const r=rng(seedOf(b));
  const order=imgs.map((_,i)=>i).sort(()=>r()-.5).map(i=>imgs[i]);
  const pick=i=>order.length?order[i%order.length]:null;
  const j=()=>(r()-.5);
  /* fundo: foto clareada */
  ctx.fillStyle='#F7F3EE';ctx.fillRect(0,0,1080,1920);
  if(order.length){coverImg(ctx,pick(order.length>7?7:0),0,0,1080,1920);ctx.fillStyle='rgba(255,255,255,.28)';ctx.fillRect(0,0,1080,1920)}
  else{const g=ctx.createLinearGradient(0,0,0,1920);g.addColorStop(0,'#DCE6D6');g.addColorStop(1,'#F1ECE4');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1920)}
  /* enfeites cristãos (desenhados a partir dos adesivos) */
  const deco={};for(const id of ['pomba','cruz','lirio','margarida','gerbera','coracao']){const st=STICKERS.find(x=>x.id===id);if(st)deco[id]=await loadImg(svgUrl(st.svg))}
  if(cv._tok!==tok)return;
  const put=(id,x,y,w,rot)=>{const im=deco[id];if(!im)return;ctx.save();ctx.translate(x,y);ctx.rotate(rot);shadowOn(ctx,12,5,.22);ctx.drawImage(im,-w/2,-w/2,w,w);ctx.restore()};
  sprig(ctx,120,560,260,-.5);sprig(ctx,990,1380,240,.4);sprig(ctx,70,1700,220,-.2);
  let uu=null,pp=null;try{uu=U();pp=prof(uu)}catch(e){}
  /* polaroids de cima */
  polaroid(ctx,pick(0),560,390,380,320,.04+j()*.04,'',0,'#EBC2B2');
  polaroid(ctx,pick(1),230,650,320,290,-.1+j()*.04,'',0,'#C9D5C3');
  polaroid(ctx,pick(2),870,650,290,290,.06+j()*.04,'',0,'#EAE2D9',true);
  tape(ctx,970,480,150,44,.6,'#F5D35E');
  put('cruz',120,330,170,-.12);put('pomba',900,290,250,-.08);
  /* faixa com o temperamento */
  banner(ctx,540,110,uu?pname(uu):'Mural da fé',pp?pp.title:'Do seu jeito, com Deus');
  /* Bíblia aberta com o versículo e a gratidão */
  let vv=null;try{vv=pp.verses[isoWeek()%pp.verses.length]}catch(e){}if(!vv)vv={t:'Eu te louvo porque me fizeste de modo especial e admirável.',r:'Salmos 139:14'};
  bibleOpen(ctx,540,1040,900,460,vv,b.grat||[]);
  /* polaroids de baixo */
  polaroid(ctx,pick(3),260,1470,320,290,-.04+j()*.05,'',0,'#EAE2D9');
  polaroid(ctx,pick(4),830,1460,320,290,.05+j()*.05,'',0,'#EBC2B2');
  polaroid(ctx,pick(5),540,1690,380,300,-.02+j()*.04,String(b.title||'').trim()||'minha semana',72,'#C9D5C3');
  put('lirio',930,1720,300,.08);put('margarida',90,1300,130,.2);put('gerbera',1010,830,120,-.2);put('margarida',140,1860,110,0);put('coracao',380,1250,90,-.2);
  /* adesivos escolhidos */
  const spots=[[80,820],[1000,860],[540,560],[1000,1550],[60,1300],[540,1880],[380,1240],[700,1240]].sort(()=>r()-.5);
  stk.forEach(({st,im},i)=>{const [px,py]=spots[i%spots.length];const w=st.size*(.6+r()*.2),h=w*(st.ar||1);
   ctx.save();ctx.translate(px,py);ctx.rotate(j()*.7);shadowOn(ctx,14,6,.25);ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()});
 }catch(e){console.error(e)}
}

function compress(file,max,q){
 return new Promise(res=>{try{
  if(!file||!/^image\//.test(file.type||'image/'))return res(null);
  const r=new FileReader();r.onerror=()=>res(null);
  r.onload=()=>{const im=new Image();im.onerror=()=>res(null);im.onload=()=>{try{let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;if(!w||!h)return res(null);const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))}catch(e){res(null)}};im.src=r.result};
  r.readAsDataURL(file);
 }catch(e){res(null)}});
}

function calendar(u){
 const d=new Date(),y=d.getFullYear(),m=d.getMonth();const fd=(new Date(y,m,1).getDay()+6)%7;const n=new Date(y,m+1,0).getDate();const set=new Set(u.days);const t=today();const created=u.created||t;
 let cells=['S','T','Q','Q','S','S','D'].map(x=>`<span class="cal-h">${x}</span>`).join('');
 for(let i=0;i<fd;i++)cells+='<span></span>';
 for(let k=1;k<=n;k++){const key=`${y}-${pad(m+1)}-${pad(k)}`;let c=set.has(key)?'on':key<t&&key>=created?'miss':key>t?'fut':'';if(key===t)c+=' today';cells+=`<span class="cal-d ${c}">${k}</span>`}
 return `<p class="small muted mt-1">${cap(MESES[m])} de ${y}</p><div class="cal mt-3" aria-label="Calendário de dias ativos">${cells}</div><div class="flex gap-4 mt-3 small muted"><span class="legend"><i class="lg on"></i>Dia ativo</span><span class="legend"><i class="lg miss"></i>Dia em branco</span></div>`;
}

function clearErr(f){f.querySelectorAll('.err').forEach(e=>e.textContent='');f.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'))}
function setErr(f,name,msg){const e=f.querySelector(`[data-err="${name}"]`);if(e)e.textContent=msg;const i=f.querySelector(`[name="${name}"]`);if(i)i.classList.add('bad')}
function nope(f){sfx('soft');const b=f.querySelector('.bad');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.focus()}}
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function birthErr(b){if(!b)return 'Escolha sua data de nascimento.';const d=parseYmd(b);if(isNaN(d)||b>today())return 'Essa data ainda não chegou!';if(d.getFullYear()<1900)return 'Confere o ano para mim?';return ''}
const FORMS={
 prayer(f){clearErr(f);const t=String(f.t.value||'').trim();if(t.length<3){setErr(f,'t','Escreva o seu pedido.');return nope(f)}
  const u=U();u.prayers.unshift({id:uid(),t,cat:ui.prayCat||'Família',date:today(),answered:false,ansDate:'',note:'',prayed:0,last:''});ui.prayDraft='';ui.prayF='orando';
  addXP(5);markActive();checkAch();save();sfx('ok');toast('Pedido guardado no seu diário.');render()},
 prayerAns(f){const u=U();const x=u.prayers.find(p=>p.id===f.dataset.id);if(!x)return;x.answered=true;x.ansDate=today();x.note=String(f.n.value||'').trim();
  closeModal();addXP(10);markActive();save();confetti();sfx('win');ui.prayF='respondidos';toast('Glória a Deus! Testemunho guardado.');render()},
 prayerEdit(f){clearErr(f);const u=U();const x=u.prayers.find(p=>p.id===f.dataset.id);if(!x)return;const t=String(f.t.value||'').trim();if(t.length<3){setErr(f,'t','Escreva o seu pedido.');return nope(f)}
  x.t=t;x.cat=PRAYER_CATS.includes(f.c.value)?f.c.value:x.cat;if(f.n)x.note=String(f.n.value||'').trim();save();closeModal();render();toast('Pedido atualizado.')},
 ori(f){const t=String(f.t.value||'').trim();if(!t)return;oriSay(oriTopicOf(t)||'?',t);const i=document.getElementById('oriT');if(i)i.focus()},
 async cadastro(f){
  clearErr(f);const name=f.name.value.trim(),email=f.email.value.trim().toLowerCase(),pass=f.pass.value,birth=f.birth.value;
  if(name.length<2)setErr(f,'name','Conta pra gente o seu nome.');
  if(!emailOk(email))setErr(f,'email','Esse e-mail parece incompleto.');else if(DB.users[email])setErr(f,'email','Esse e-mail já tem conta. Que tal entrar?');
  if(pass.length<6)setErr(f,'pass','Use pelo menos 6 caracteres.');
  const be=birthErr(birth);if(be)setErr(f,'birth',be);
  if(f.querySelector('.bad'))return nope(f);
  if(ui.authBusy)return;
  ui.authBusy=true;await ui.cloudReady;
  if(CLOUD.on){
   const r=await cloud('register',{name,email,pass,birth,data:dataOf(blankUser())});ui.authBusy=false;
   if(!r.ok){if(r.data.error==='exists')setErr(f,'email',r.data.message);else setErr(f,'form',r.status===0?'Sem conexão com a internet. Confira e tente de novo.':(r.data.message||'Não consegui criar sua conta agora. Tente de novo.'));return nope(f)}
   setToken(r.data.token);const cu=applyCloud(r.data);DB.session=email;saveLocal();
   sfx('ok');toast(`Conta criada! Que bom ter você aqui, ${esc(first(name))}.`);go(stepFor(cu));return;
  }
  ui.authBusy=false;
  const u=blankUser();u.name=name;u.email=email;u.birth=birth;u.pass=await hashPass(pass);
  DB.users[email]=u;DB.session=email;
  const stored=save();
  sfx('ok');toast(stored?`Conta criada! Que bom ter você aqui, ${esc(first(name))}.`:'Conta criada! Este navegador não está guardando dados, então seu progresso vale só até fechar a página.');go(stepFor(u));
  syncAccess(u).then(ok=>{if(ok){toast('Encontramos seu pagamento! Acesso liberado.');go(stepFor(u))}});
 },
 async login(f){
  clearErr(f);const email=f.email.value.trim().toLowerCase(),pass=f.pass.value;
  if(!email||!pass){setErr(f,'form','Preencha e-mail e senha.');if(!email)setErr(f,'email','');if(!pass)setErr(f,'pass','');return nope(f)}
  if(ui.authBusy)return;
  ui.authBusy=true;await ui.cloudReady;
  if(CLOUD.on){
   let r=await cloud('login',{email,pass});
   const local=DB.users[email];
   if(r.status===404&&local&&local.pass&&await checkPass(pass,local.pass)){
    r=await cloud('register',{name:local.name,email,pass,birth:local.birth,data:dataOf(local)});
    if(r.ok&&local.paid)setTimeout(()=>toast('Se você já tinha liberado o acesso, digite seu código de novo para confirmar.'),1500);
   }
   ui.authBusy=false;
   if(!r.ok){setErr(f,'form',r.status===0?'Sem conexão com a internet. Confira e tente de novo.':(r.data.message||'E-mail ou senha incorretos.'));setErr(f,'pass','');return nope(f)}
   setToken(r.data.token);const cu=applyCloud(r.data,local);DB.session=email;saveLocal();
   sfx('ok');toast(`Oi de novo, ${esc(first(cu.name))}!`);go(stepFor(cu));return;
  }
  ui.authBusy=false;
  const u=DB.users[email];
  if(!u||!(await checkPass(pass,u.pass))){setErr(f,'form','E-mail ou senha incorretos.');setErr(f,'pass','');return nope(f)}
  DB.session=email;save();sfx('ok');toast(`Oi de novo, ${esc(first(u.name))}!`);go(stepFor(u));
  syncAccess(u).then(ok=>{if(ok)go(stepFor(u))});
 },
 card(f){
  clearErr(f);const num=f.cnum.value.replace(/\D/g,''),exp=f.cexp.value,cvv=f.ccvv.value.replace(/\D/g,''),nm=f.cname.value.trim();
  if(num.length<13||num.length>19)setErr(f,'cnum','Confere o número do cartão?');
  const m=/^(\d{2})\/(\d{2})$/.exec(exp);
  if(!m||+m[1]<1||+m[1]>12)setErr(f,'cexp','Use o formato MM/AA.');
  else{const end=new Date(2000+ +m[2],+m[1],0,23,59);if(end<new Date())setErr(f,'cexp','Esse cartão já venceu.')}
  if(cvv.length<3||cvv.length>4)setErr(f,'ccvv','3 ou 4 dígitos.');
  if(nm.length<3)setErr(f,'cname','Digite o nome como está no cartão.');
  if(f.querySelector('.bad'))return nope(f);
  f.reset();if(PAY.mode==='demo')processPayment('cartao');
 },
 async code(f){
  clearErr(f);const u=U();if(!u)return;
  if(ui.codeLock&&Date.now()<ui.codeLock){setErr(f,'code','Muitas tentativas. Aguarde alguns segundos e tente de novo.');return nope(f)}
  const c=normCode(f.code.value);
  if(c.length!==15||!c.startsWith('ORV')){setErr(f,'code','O código tem o formato ORV-XXXX-XXXX-XXXX.');return nope(f)}
  await ui.cloudReady;
  if(CLOUD.on){
   if(ui.codeBusy)return;ui.codeBusy=true;
   const r=await cloud('redeem',{code:c});ui.codeBusy=false;
   if(r.status===401){sessionExpired();return}
   if(!r.ok||!r.data.profile||!r.data.profile.paid){setErr(f,'code',r.status===0?'Sem conexão com a internet. Confira e tente de novo.':(r.data.message||'Não consegui verificar o código agora.'));return nope(f)}
   unlockPaid(u,'codigo');return;
  }
  let h='';try{h=await codeHash(c)}catch(e){setErr(f,'code','Este navegador não conseguiu verificar o código. Tente pelo Chrome ou Safari atualizados.');return}
  if(!CODE_HASHES.has(h)&&h!==HOTMART_HASH_LOCAL){ui.codeFails=(ui.codeFails||0)+1;if(ui.codeFails>=5){ui.codeLock=Date.now()+30000;ui.codeFails=0}setErr(f,'code','Código não encontrado. Confira se digitou igual ao que recebeu.');return nope(f)}
  u.accessCode=h===HOTMART_HASH_LOCAL?'hotmart':h.slice(0,10);unlockPaid(u,'codigo');
 },
 act(f){
  clearErr(f);const t=f.t.value.trim();if(!t){setErr(f,'t','Escreva a atividade.');return nope(f)}
  const u=U();
  if(ui.actId){const it=u.checklist.items.find(i=>i.id===ui.actId);if(it){it.t=t;it.g=ui.actG}toast('Atividade atualizada!')}
  else{u.checklist.items.push({id:uid(),g:ui.actG,t,done:false,note:''});toast('Atividade criada!')}
  save();sfx('ok');closeModal();render();
 },
 goal(f){
  clearErr(f);const t=f.t.value.trim();if(!t){setErr(f,'t','Escreva sua meta ou hábito.');return nope(f)}
  const u=U();u.goals.unshift({id:uid(),t,type:ui.goalType,done:false,xp:false,created:today()});ui.goalDraft='';
  save();sfx('ok');refreshModal();render();toast(`${ui.goalType} adicionad${ui.goalType==='Meta'?'a':'o'}!`);
 },
 goalEdit(f){
  const t=f.t.value.trim();if(!t){f.t.classList.add('bad');return nope(f)}

  ui.editGoal=null;save();refreshModal();render();toast('Salvo!');
 },
 async perfil(f){
  clearErr(f);const u=U();const name=f.name.value.trim(),birth=f.birth.value,cur=f.cur.value,nw=f.nw.value;
  if(name.length<2)setErr(f,'name','Conta pra gente o seu nome.');
  const be=birthErr(birth);if(be)setErr(f,'birth',be);
  if(nw||cur){
   if(nw.length<6)setErr(f,'nw','Use pelo menos 6 caracteres.');
   else if(CLOUD.on){const r=await cloud('password',{cur,nw});if(!r.ok)setErr(f,'cur',r.data.message||'Não consegui trocar a senha agora.')}
   else if(!cur||!(await checkPass(cur,u.pass)))setErr(f,'cur','Senha atual incorreta.')}
  if(f.querySelector('.bad'))return nope(f);
  u.name=name;u.birth=birth;if(nw&&!CLOUD.on)u.pass=await hashPass(nw);
  save();sfx('ok');closeModal();render();toast('Perfil atualizado!');
 }
};
function mask(el){
 const d=el.value.replace(/\D/g,'');
 if(el.dataset.mask==='card')el.value=d.slice(0,19).replace(/(\d{4})(?=\d)/g,'$1 ');
 if(el.dataset.mask==='exp')el.value=d.length>2?d.slice(0,2)+'/'+d.slice(2,4):d;
 if(el.dataset.mask==='cvv')el.value=d.slice(0,4);
 if(el.dataset.mask==='code'){const a=normCode(el.value).slice(0,15);el.value=[a.slice(0,3),a.slice(3,7),a.slice(7,11),a.slice(11,15)].filter(Boolean).join('-')}
}

 setTimeout(()=>{
  const u=U();if(!u){closeModal();go('boas-vindas');return}
  unlockPaid(u,method);
 },1500);
}
async function copyText(txt){
 try{await navigator.clipboard.writeText(txt);return true}catch(e){
  try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}}
}
