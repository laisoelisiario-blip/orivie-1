<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orivie - Sua Personalidade</title>
<meta name="description" content="Descubra quem você é, do seu jeito, e viva o que combina com você.">
<meta name="theme-color" content="#F7F3EE">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='38' rx='22' ry='23' fill='%23D9A08B'/%3E%3Cellipse cx='24' cy='10' rx='9' ry='4.5' fill='%23A8B8A0' transform='rotate(-25 24 10)'/%3E%3Cellipse cx='40' cy='9' rx='9' ry='4.5' fill='%23A8B8A0' transform='rotate(25 40 9)'/%3E%3Ccircle cx='25' cy='35' r='6' fill='%23fff'/%3E%3Ccircle cx='39' cy='35' r='6' fill='%23fff'/%3E%3Ccircle cx='25' cy='36' r='3.4' fill='%233A2E28'/%3E%3Ccircle cx='39' cy='36' r='3.4' fill='%233A2E28'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=Playfair+Display:wght@600;700;800&family=Abril+Fatface&family=Caveat:wght@700&family=Archivo+Black&family=Special+Elite&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
try{tailwind.config={corePlugins:{preflight:false},theme:{extend:{colors:{creme:'#F7F3EE',salvia:'#A8B8A0',terracota:'#D9A08B',texto:'#3A2E28',bege:'#EAE2D9'},fontFamily:{display:['"Playfair Display"','serif'],ui:['"DM Sans"','sans-serif']}}}}}catch(e){}
</script>
<style>
/* =========================================================
   ORIVIE - SUA PERSONALIDADE · Design system
   Estilo lúdico/gamificado (lábio sólido, afundar ao tocar,
   bordas de 2px, trilha, mascote) com a paleta Orivie.
   ========================================================= */
:root{
  --creme:#F7F3EE;--branco:#FFFFFF;
  --salvia:#A8B8A0;--salvia-sh:#879A7E;--salvia-lt:#EDF1EA;--salvia-dk:#4F6249;
  --terra:#D9A08B;--terra-sh:#B97F6A;--terra-lt:#F8EAE3;--terra-dk:#94553F;
  --texto:#3A2E28;--muted:#75655B;
  --bege:#EAE2D9;--bege-sh:#D5C8BA;
  --mel:#E3B65E;--mel-sh:#C49840;--mel-lt:#FBF0DA;--mel-dk:#8A621A;
  --erro:#B5544A;--erro-sh:#934038;--erro-lt:#F8E1DD;
  --cinza:#ADA198;
  --f-display:"Playfair Display",Georgia,serif;
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--texto);font-family:var(--f-ui);font-weight:500;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,figure{margin:0}
ul{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
body.modal-open{overflow:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--creme);position:relative}
:focus-visible{outline:3px solid var(--salvia-dk);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
/* Fallback das utilidades Tailwind usadas: o layout continua íntegro mesmo se o CDN falhar */
.block{display:block}.flex{display:flex}.grid{display:grid}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.justify-end{justify-content:flex-end}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.grid-cols-1{grid-template-columns:repeat(1,minmax(0,1fr))}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}.mt-6{margin-top:24px}.mt-8{margin-top:32px}
.mb-1{margin-bottom:4px}.mb-3{margin-bottom:12px}.mb-5{margin-bottom:20px}.mb-6{margin-bottom:24px}.mx-auto{margin-left:auto;margin-right:auto}.pt-4{padding-top:16px}
.text-center{text-align:center}.text-left{text-align:left}

/* ---------- Tipografia ---------- */
.display{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:40px;letter-spacing:-.3px}
.h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:33px}
.h2{font-weight:800;font-size:20px;line-height:28px}
.h3{font-weight:700;font-size:17px;line-height:24px}
.body{font-size:17px;line-height:26px}
.lead{font-size:17px;line-height:26px;color:var(--muted)}
.small{font-size:14.5px;line-height:21px;font-weight:600}
.muted{color:var(--muted)}
.link{color:var(--terra-dk);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.c-terra{color:var(--terra-dk)}.c-mel{color:var(--mel-dk)}.c-gray{color:var(--cinza)}.c-sage{color:var(--salvia-dk)}

/* ---------- Estrutura ---------- */
.brandbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;padding:8px 14px;background:var(--creme);border-bottom:2px solid var(--bege)}
.brand{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--texto);white-space:nowrap}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800}
.screen{padding:20px 16px 190px}
.screen.app{padding-bottom:120px}
.footbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--creme);border-top:2px solid var(--bege);display:flex;gap:12px;z-index:40}
.footbar.stack{flex-direction:column}
.center-col{display:flex;flex-direction:column;align-items:center}

/* ---------- Botões (lábio sólido + afundar) ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 20px;border:2px solid transparent;border-radius:12px;font:700 15px/1.15 var(--f-ui);letter-spacing:.64px;text-transform:uppercase;text-align:center;cursor:pointer;user-select:none;transition:transform 80ms,box-shadow 80ms,background-color 150ms,filter 150ms;text-decoration:none}
.btn:hover:not(:disabled){filter:brightness(1.03)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none!important}
.btn-primary{background:var(--terra);color:var(--texto);box-shadow:0 4px 0 var(--terra-sh)}
.btn-sage{background:var(--salvia);color:var(--texto);box-shadow:0 4px 0 var(--salvia-sh)}
.btn-mel{background:var(--mel);color:var(--texto);box-shadow:0 4px 0 var(--mel-sh)}
.btn-danger{background:var(--erro);color:#fff;box-shadow:0 4px 0 var(--erro-sh)}
.btn-outline{background:#fff;color:var(--terra-dk);border-color:var(--bege);box-shadow:0 2px 0 var(--bege-sh)}
.btn-outline:active:not(:disabled){background:var(--bege);border-color:var(--bege-sh);transform:translateY(2px)}
.btn-ghost{background:transparent;color:var(--terra-dk);min-height:46px}
.btn-ghost:active:not(:disabled){transform:none;background:var(--bege)}
.btn-premium{background:linear-gradient(135deg,#A8B8A0 0%,#D9A08B 55%,#E3B65E 100%);color:var(--texto);box-shadow:0 4px 0 var(--terra-sh)}
.btn:disabled,.btn.is-disabled{background:var(--bege);color:var(--cinza);box-shadow:none;border-color:transparent;cursor:not-allowed;filter:none;pointer-events:none}
.btn-sm{width:auto;min-height:40px;padding:8px 14px;font-size:12.5px}
.ibtn{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;color:var(--muted);transition:background-color 150ms}
.ibtn:hover{background:var(--bege)}
.ibtn.danger{color:var(--erro)}
.btn-x{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--cinza)}
.btn-x:hover{background:var(--bege);color:var(--texto)}

/* ---------- Segmentado / chips ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;background:var(--bege);border-radius:14px}
.seg button{min-height:44px;border-radius:10px;font:800 13.5px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);transition:background-color 150ms}
.seg button.on{background:#fff;color:var(--terra-dk);box-shadow:0 2px 0 var(--bege-sh)}
.seg.sm button{min-height:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-f{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:12px;font:700 13.5px var(--f-ui);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);transition:transform 80ms}
.chip-f:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.chip-f.on{background:var(--salvia-lt);border-color:var(--salvia);color:var(--salvia-dk)}
.chip-f b{font-weight:800;color:var(--terra-dk)}

/* ---------- Tiles / opções ---------- */
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:#fff;color:var(--texto);border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px;font:700 16px/1.35 var(--f-ui);text-align:left;cursor:pointer;transition:transform 80ms,background-color 150ms,border-color 150ms}
.tile:hover{background:#FDFBF8}
.tile:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.tile.sel{background:var(--salvia-lt);border-color:var(--salvia);color:var(--salvia-dk)}
.tile .key{flex:none;display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--bege);border-radius:8px;font-size:14px;font-weight:800;color:var(--muted)}
.tile.sel .key{background:var(--salvia);border-color:var(--salvia);color:var(--texto)}
.tile.chip{padding:12px;min-height:56px;font-size:15px}
.check-dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--salvia);color:var(--texto);flex:none}
.cbox{display:grid;place-items:center;flex:none;width:26px;height:26px;border:2px solid var(--bege-sh);border-radius:8px;background:#fff;color:var(--texto)}
.tile.sel .cbox,.cbox.on{background:var(--salvia);border-color:var(--salvia-sh)}
.cbox.big{width:34px;height:34px;border-radius:9px;border-bottom-width:4px}
.cbox.big:active{transform:translateY(2px);border-bottom-width:2px}

/* ---------- Cards / tags ---------- */
.card{background:#fff;border:2px solid var(--bege);border-radius:16px;padding:16px 18px}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:8px;background:var(--salvia-lt);color:var(--salvia-dk);font:800 11.5px/1 var(--f-ui);letter-spacing:.48px;text-transform:uppercase;white-space:nowrap}
.tag-terra{background:var(--terra-lt);color:var(--terra-dk)}
.tag-mel{background:var(--mel-lt);color:var(--mel-dk)}
.tag-premium{background:linear-gradient(135deg,#EDF1EA,#F8EAE3,#FBF0DA);color:var(--terra-dk);border:2px solid var(--terra)}
.list li{display:flex;align-items:center;gap:12px;padding:8px 0;font-weight:700;font-size:16px}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.6px;text-transform:uppercase}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 12px}

/* ---------- Progresso ---------- */
.prog{height:14px;background:var(--bege);border-radius:999px;overflow:hidden;flex:1}
.prog>i{display:block;position:relative;height:100%;width:0;background:var(--terra);border-radius:999px;transition:width .5s var(--spring)}
.prog>i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;background:rgba(255,255,255,.4);border-radius:999px}
.prog.sage>i{background:var(--salvia)}
.prog.mel>i{background:var(--mel)}
.prog.sm{height:10px}.prog.sm>i::after{display:none}
.lesson-bar{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.btn-icon-plain{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--cinza)}
.btn-icon-plain:hover{background:var(--bege);color:var(--texto)}
.dim{display:grid;grid-template-columns:110px 1fr 26px;align-items:center;gap:10px;padding:5px 0;font-size:14px;font-weight:700}
.dim b{text-align:right;color:var(--muted)}

/* ---------- Inputs ---------- */
.lbl-f{display:block;font-weight:800;font-size:14px;margin:0 0 6px}
.input{width:100%;min-height:50px;padding:12px 14px;background:#FBF8F4;color:var(--texto);border:2px solid var(--bege);border-radius:12px;font:500 16px var(--f-ui);transition:border-color 150ms,background-color 150ms}
.input::placeholder{color:#A69A91}
.input:focus{outline:none;border-color:var(--salvia);background:#fff}
.input.bad{border-color:var(--erro);background:var(--erro-lt)}
.input.sm{min-height:42px;padding:8px 12px;font-size:16px}
.err{color:var(--erro);font-size:13.5px;font-weight:700;margin-top:6px}
.err:empty{display:none}

/* ---------- Fala / mascote ---------- */
.speech{display:flex;align-items:flex-end;gap:10px}
.speech>svg{flex:none}
.bubble{position:relative;flex:1;background:#fff;border:2px solid var(--bege);border-radius:16px;padding:12px 14px;font-weight:600;font-size:15.5px;line-height:1.45}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:#fff;border-left:2px solid var(--bege);border-bottom:2px solid var(--bege);transform:rotate(45deg)}
.bubble.up::before{left:50%;top:-9px;bottom:auto;margin-left:-7px;transform:rotate(135deg)}
.mascot .m-wave{transform-box:fill-box;transform-origin:30% 95%;animation:wave 1.3s ease-in-out infinite}
.floaty{animation:floaty 2.6s ease-in-out infinite}
.hop{animation:hop .9s var(--spring) infinite alternate}
.pop{animation:pop .3s var(--spring)}
.shake{animation:shake .3s}
.welcome-art{position:relative;margin:8px 0 6px}
.spark{position:absolute;animation:floaty 3s ease-in-out infinite}
.spark.s1{top:10px;left:-26px}.spark.s2{top:40px;right:-30px;animation-delay:.6s}

/* ---------- Pagamento ---------- */
.premium-card{border-radius:24px;padding:20px;border:2px solid var(--bege);background:linear-gradient(135deg,#EDF1EA 0%,#F8EAE3 55%,#FBF0DA 100%)}
.price{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;margin:16px 0 8px;color:var(--terra-dk)}
.benefits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.benefits li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.qr-box{display:grid;place-items:center;padding:14px;background:#fff;border:2px solid var(--bege);border-radius:16px;width:fit-content;margin:0 auto}
.code-box{display:flex;gap:8px;align-items:center}
.code-box .input{font-size:13px;font-family:ui-monospace,Menlo,monospace}
.step-n{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--terra);color:var(--texto);font-weight:800;box-shadow:0 3px 0 var(--terra-sh)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--terra);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--salvia)}
.dots i:nth-child(3){animation-delay:.3s;background:var(--mel)}

/* ---------- App: header de status e tab bar ---------- */
.stat{display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:44px;border-radius:12px;font-weight:800;font-size:16px}
.stat:hover{background:var(--bege)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--bege);z-index:40}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:2px solid transparent;border-radius:12px;font:800 10px var(--f-ui);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);transition:background-color 150ms}
.tabbar button svg{transition:transform 150ms var(--spring)}
.tabbar button[aria-current="page"]{background:var(--salvia-lt);border-color:var(--salvia);color:var(--salvia-dk)}
.tabbar button[aria-current="page"] svg{transform:scale(1.1)}

/* ---------- Unidade / trilha ---------- */
.unit-head{position:sticky;top:60px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--terra);color:var(--texto);box-shadow:0 4px 0 var(--terra-sh)}
.unit-head.sage{background:var(--salvia);box-shadow:0 4px 0 var(--salvia-sh)}
.unit-kicker{font:800 11.5px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.unit-title{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:26px}
.unit-head .btn-outline{background:rgba(255,255,255,.85)}
#semana{scroll-margin-top:66px}
.trail{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:60px 0 12px}
.trow{position:relative;display:flex;flex-direction:column;align-items:center}
.node{position:relative;z-index:1;display:grid;place-items:center;width:72px;height:66px;border:0;border-radius:50%;background:var(--terra);color:#fff;box-shadow:0 7px 0 var(--terra-sh);cursor:pointer;transition:transform 80ms}
.node:active{transform:translateY(7px);box-shadow:none}
.node.done{background:var(--salvia);color:var(--texto);box-shadow:0 7px 0 var(--salvia-sh)}
.node.locked,.node.missed{background:var(--bege);color:var(--cinza);box-shadow:0 7px 0 var(--bege-sh)}
.node.todo{background:#fff;border:2px solid var(--bege);box-shadow:0 7px 0 var(--bege-sh)}
.node-cap{margin-top:12px;font-weight:800;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;max-width:120px;text-align:center;line-height:1.25}
.ring{position:absolute;width:100px;height:100px;left:50%;top:-17px;transform:translateX(-50%);pointer-events:none}
.balloon{position:absolute;z-index:2;top:-50px;left:50%;transform:translate(-50%,0);background:#fff;border:2px solid var(--bege);border-radius:12px;padding:6px 12px;font:800 13px var(--f-ui);color:var(--terra-dk);letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.balloon::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;width:12px;height:12px;background:#fff;border-right:2px solid var(--bege);border-bottom:2px solid var(--bege);transform:rotate(45deg)}
.trail-pal{position:absolute;top:150px;pointer-events:none}
.trail-pal.left{left:4px}.trail-pal.right{right:4px;top:330px}

/* ---------- Combina ---------- */
.icard{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px;overflow:hidden;transition:transform 80ms}
.icard:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.img-box{position:relative;display:grid;place-items:center;aspect-ratio:16/10;background:var(--bege);overflow:hidden}
.img-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img-box.big{border-radius:16px;aspect-ratio:4/3}
.img-box.cover{border-radius:16px}
.img-box.thumb{width:76px;height:76px;aspect-ratio:auto;border-radius:12px;flex:none}
.why{font-size:14.5px;line-height:21px;color:var(--salvia-dk);background:var(--salvia-lt);border-radius:12px;padding:10px 12px}
.whybox{background:var(--salvia-lt);border-radius:16px;padding:14px}
.whybox .bubble{background:#fff}

/* ---------- Checklist ---------- */
.crow{background:#fff;border:2px solid var(--bege);border-radius:16px;padding:10px 10px 12px 12px;transition:background-color 150ms}
.crow.is-done{background:var(--salvia-lt);border-color:var(--salvia)}
.crow-t{flex:1;font-weight:700;font-size:15.5px;line-height:1.35}
.crow.is-done .crow-t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--salvia-dk)}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--bege)}
.hist:last-child{border-bottom:0}

/* ---------- Missões ---------- */
.mission{display:flex;align-items:center;gap:12px;padding:10px 0}
.mission-txt{flex:1;min-width:0}
.mission-txt p{font-weight:700;font-size:15px;line-height:1.3;margin-bottom:6px}
.mission .prog{height:12px}

/* ---------- Board ---------- */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bege)}
.bcell img{width:100%;height:100%;object-fit:cover}
.bcell.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--bege-sh);background:#fff;cursor:pointer;font:800 11.5px var(--f-ui);letter-spacing:.4px;text-transform:uppercase;color:var(--terra-dk)}
.bcell.add:hover{background:var(--terra-lt)}
.bdel{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(58,46,40,.78);color:#fff}
.bdel::before{content:"";position:absolute;inset:-7px}
.prev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px}
.prev:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.prev-thumbs{display:grid;grid-template-columns:repeat(3,26px);gap:3px;flex:none}
.prev-thumbs img,.prev-thumbs span{width:26px;height:26px;border-radius:6px;object-fit:cover;background:var(--bege)}

.board-wrap{display:flex;justify-content:center}
.board-canvas{display:block;width:100%;max-width:340px;aspect-ratio:9/16;height:auto;border-radius:16px;border:2px solid var(--bege);background:var(--bege)}
.board-wrap .board-canvas{box-shadow:0 4px 0 var(--bege-sh)}
.stk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:14px;font:800 10.5px/1.2 var(--f-ui);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);transition:transform 80ms}
.stk img{width:44px;height:44px;object-fit:contain}
.stk:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.stk.on{background:var(--salvia-lt);border-color:var(--salvia);color:var(--salvia-dk)}
.prev-card{display:block;width:100%;text-align:left;padding:8px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px}
.prev-card:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.prev-card .board-canvas{max-width:none;border-radius:10px;border:0}
/* ---------- Aprender ---------- */
.reading p{font-size:17px;line-height:28px;margin-bottom:16px}
.tcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px}
.tcard:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}

/* ---------- Eu ---------- */
.avatar{position:relative;width:104px;height:104px;border-radius:50%;background:var(--terra);display:grid;place-items:center;font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--texto);box-shadow:0 5px 0 var(--terra-sh)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar-edit{position:absolute;right:-4px;bottom:-2px;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--bege);box-shadow:0 3px 0 var(--bege-sh);cursor:pointer}
.paid{display:inline-flex;text-align:left;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--salvia-lt);color:var(--salvia-dk);font-weight:800;font-size:14px}
.stile{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border:2px solid var(--bege);border-radius:16px}
.stile b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.stile span{font-size:12.5px;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-h{font:800 11.5px var(--f-ui);color:var(--muted)}
.cal-d{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-weight:700;font-size:13.5px}
.cal-d.on{background:var(--terra);color:var(--texto);font-weight:800}
.cal-d.miss{color:var(--cinza);background:#F3EEE8}
.cal-d.fut{color:#C9BFB6}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--terra-dk)}
.legend{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:50%;display:inline-block}
.lg.on{background:var(--terra)}.lg.miss{background:#E5DDD4}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px;text-align:center;font:800 11.5px/1.25 var(--f-ui)}
.badge:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.badge-ic{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--mel-lt);box-shadow:0 3px 0 var(--mel)}
.badge.locked{color:var(--cinza)}
.badge.locked .badge-ic{filter:grayscale(1);opacity:.45;box-shadow:0 3px 0 var(--bege-sh);background:var(--bege)}
.menu-ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--creme)}
.switch{position:relative;flex:none;width:52px;height:30px;border-radius:999px;background:var(--bege-sh);transition:background-color 150ms}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s var(--spring)}
.switch.on{background:var(--salvia-dk)}
.switch.on::after{transform:translateX(22px)}

/* ---------- Modal / toast / celebração ---------- */
.backdrop{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(58,46,40,.5);animation:fade .2s ease-out}
.backdrop.noanim,.backdrop.noanim .sheet{animation:none}
.sheet{width:100%;max-width:430px;max-height:92vh;max-height:92dvh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));animation:sheetUp .32s var(--spring)}
.backdrop.center{align-items:center;padding:16px}
.backdrop.center .sheet{border-radius:24px;animation:popIn .38s var(--spring)}
.sheet.full{min-height:70vh}
.toast{position:fixed;left:50%;top:70px;z-index:150;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);width:max-content;padding:12px 16px;background:var(--texto);color:#fff;border-radius:14px;font-weight:700;font-size:14.5px;line-height:1.35;box-shadow:0 4px 0 #1F1814;animation:toastIn .35s var(--spring)}
.toast.out{opacity:0;transform:translate(-50%,-10px);transition:all .3s}
.xp-pill{position:fixed;left:50%;top:42%;z-index:160;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:var(--mel);color:var(--texto);font:800 20px var(--f-ui);box-shadow:0 4px 0 var(--mel-sh);animation:xpUp 1.3s ease-out forwards;pointer-events:none}
.stat-card{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:#fff}
.stat-k{background:var(--c);color:var(--texto);font:800 10.5px var(--f-ui);letter-spacing:.5px;text-transform:uppercase;padding:5px 2px}
.stat-v{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 2px;font:800 20px var(--f-ui)}
.sc-mel{--c:var(--mel)}.sc-sage{--c:var(--salvia)}.sc-terra{--c:var(--terra)}
.bignum{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;color:var(--terra-dk)}
.cf-box{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:3px;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}

/* Selo "Powered by Netlify" (plano gratuito): sobe o rodapé e as abas para o selo não cobrir os botões */

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}

/* =========================================================
   NOVO VISUAL (2026-11): limpo, neutro e premium
   Botões terracota lisos, campos com borda sálvia, cards suaves
   ========================================================= */
:root{--terra-btn:#C47A5F;--terra-btn-dk:#A9634A;--card:#FBF8F4;--line:#E6DDD3;--shadow:0 6px 22px rgba(58,46,40,.07)}
body{font-weight:400}
.display,.h1{font-family:var(--f-ui);font-weight:700;letter-spacing:-.6px}
.display{font-size:34px;line-height:40px}
.h1{font-size:28px;line-height:34px}
.h2{font-weight:700;font-size:20px}
.brandbar{justify-content:center;border-bottom:0;min-height:56px;position:relative}
.brandbar .brand{font-size:15px;font-weight:500;gap:8px}
.brandbar .brand b{font-family:var(--f-display);font-weight:500;font-size:19px}
.brandbar.has-right{justify-content:space-between}
.brandbar>.ibtn{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.unit-head.sage,.unit-head{box-shadow:var(--shadow)}
.brand-dot{color:var(--muted);margin:0 2px}
/* botões */
.btn{border-radius:14px;min-height:54px;text-transform:none;letter-spacing:0;font:600 17px/1.15 var(--f-ui)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary,.btn-premium{background:var(--terra-btn);color:#fff;box-shadow:0 6px 16px rgba(196,122,95,.28)}
.btn-primary:hover:not(:disabled){background:var(--terra-btn-dk);filter:none}
.btn-sage{background:var(--salvia);color:var(--texto);box-shadow:0 6px 16px rgba(168,184,160,.3)}
.btn-mel{box-shadow:none}
.btn-outline{background:transparent;color:var(--texto);border:1.5px solid var(--salvia);box-shadow:none}
.btn-outline:active:not(:disabled){background:var(--salvia-lt);transform:scale(.98)}
.btn-ghost{color:var(--texto);font-weight:500}
.btn-sm{min-height:40px;font-size:14px;border-radius:12px}
.btn:disabled,.btn.is-disabled{background:#E9E2DA;color:#A99E95;box-shadow:none}
/* campos */
.lbl-f{font-weight:500;font-size:15px;margin:0 0 8px 4px}
.input{background:transparent;border:1.5px solid #B9C6B2;border-radius:14px;min-height:54px;padding:14px 16px;font-size:17px}
.input:focus{border-color:var(--salvia-dk);background:#fff}
.field-ic{position:relative}.field-ic>svg{position:absolute;left:16px;top:16px;color:var(--salvia-dk);pointer-events:none}.field-ic .input{padding-left:50px}
/* cards e opções */
.card,.crow,.stile,.prev,.prev-card,.tcard,.icard,.badge{background:var(--card);border:1px solid var(--line);border-bottom-width:1px;border-radius:18px;box-shadow:var(--shadow)}
.tile{background:var(--card);border:1px solid var(--line);border-bottom-width:1px;border-radius:16px;box-shadow:0 3px 12px rgba(58,46,40,.05);font-weight:400;font-size:17px;padding:16px}
.tile:active,.icard:active,.tcard:active,.prev:active,.prev-card:active,.badge:active{transform:scale(.99);border-bottom-width:1px;margin-bottom:0}
.tile .key{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--texto);font-size:20px;font-weight:400;color:var(--texto)}
.tile.sel{background:var(--card);border-color:var(--terra);color:var(--texto)}
.tile.sel .key{background:var(--terra-btn);border-color:var(--terra-btn);color:#fff}
.tile.chip .key,.tile.chip .cbox{width:26px;height:26px;border-radius:8px}
.check-dot{display:none}
.cbox{border:1.5px solid #CFC5BB;border-radius:8px;background:transparent}
.tile.sel .cbox,.cbox.on{background:var(--salvia);border-color:var(--salvia);color:#fff}
.crow.is-done{background:var(--card);border-color:var(--line)}
.tag{text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;height:28px;border-radius:999px;padding:0 12px}
.tag-terra{background:#E8B5A3;color:var(--texto)}
.sec-h{text-transform:none;letter-spacing:0;font-weight:700;font-size:18px}
/* progresso */
.prog{height:12px;background:#E9E2D6}
.prog>i{background:var(--salvia)}.prog>i::after{display:none}
.prog.mel>i{background:var(--mel)}
.pct{font-size:14px;color:var(--muted);min-width:38px}
/* chips */
.chip-f{border:0;border-radius:14px;background:#C9D5C3;color:var(--texto);text-transform:none;letter-spacing:0;font-weight:500;font-size:15px;min-height:44px;padding:0 16px}
.chip-f:active{transform:scale(.97);border-bottom-width:0;margin-bottom:0}
.chip-f.on{background:#E0A58F;color:#fff}
.chip-f b{color:inherit}
.seg{background:#EAE4DC;border-radius:16px}
.seg button{text-transform:none;letter-spacing:0;font-weight:600;font-size:16px}
.seg button.on{background:var(--card);color:var(--texto);box-shadow:inset 0 -3px 0 var(--salvia)}
/* falas da Ori */
.bubble{background:var(--card);border:1px solid var(--line);font-weight:400}
.bubble::before{background:var(--card);border-color:var(--line)}
.ori-card{display:flex;align-items:center;gap:14px;padding:20px 18px;border-radius:22px;background:#C3CFBC}
.ori-card h2{font-weight:700;font-size:24px}
.ori-card p{font-size:16px;line-height:1.45}
.ori-card .ph{font-style:italic;margin-top:8px}
/* lista de checks (Hoje) */
.mini-check{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F1ECE5;margin-top:8px;width:100%;text-align:left}
.mini-check .dot{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--salvia);color:#fff;flex:none}
.mini-check.on .dot{background:var(--terra-btn);border-color:var(--terra-btn)}
.mini-check .ok{margin-left:auto;font-size:13px;padding:3px 10px;border-radius:999px;background:#C9D5C3}
/* grupos do checklist */
.gico{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--salvia)}
/* trilha da semana e unidade */
.unit-head{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--texto)}
.unit-head.sage{background:var(--card)}
.unit-title{font-family:var(--f-ui);font-weight:700}
.node{box-shadow:0 5px 0 var(--terra-sh)}
.node-cap,.unit-kicker{text-transform:none;letter-spacing:0}
.balloon{text-transform:none;letter-spacing:0}
/* menu da aba Eu */
.eu-menu .tile{border:0;box-shadow:0 3px 12px rgba(58,46,40,.05)}
.eu-menu .tile:nth-child(odd){background:#C9D5C3}
.eu-menu .tile:nth-child(even){background:#EBC2B2}
.eu-menu .menu-ic{background:rgba(255,255,255,.45);border-radius:50%}
.prof-card{display:flex;align-items:center;gap:16px}
.prof-card .avatar{width:96px;height:96px;font-size:40px;box-shadow:none;flex:none}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:#C47A5F;color:#fff;font-size:15px;font-weight:500}
.paid{background:#B9C7B2;color:var(--texto);border-radius:18px;padding:14px 16px;font-weight:600;width:100%}
/* abas */
.tabbar{background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(58,46,40,.05)}
.tabbar button{text-transform:none;letter-spacing:0;font-weight:500;font-size:11px;border:0}
.tabbar button[aria-current="page"]{background:transparent;color:var(--salvia-dk);font-weight:700}
.footbar{border-top:0;background:linear-gradient(to top,var(--creme) 70%,rgba(247,243,238,0))}
/* logo */
.logo-big{display:flex;align-items:center;justify-content:center;gap:12px}
.logo-big b{display:block;font-family:var(--f-display);font-weight:500;font-size:44px;line-height:1}
.logo-big span{display:block;font-size:16px;letter-spacing:.4px;color:var(--texto);margin-top:4px}
.or-sep{text-align:center;color:var(--muted);margin:14px 0}
.price{font-family:var(--f-ui);font-weight:700;letter-spacing:-1px;color:var(--terra-btn)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}

  body:["O Big Five é o modelo de personalidade mais estudado da psicologia. Ele nasceu de uma ideia simples: se uma característica é importante, a língua cria palavras para ela. Agrupando milhares de adjetivos, pesquisadores chegaram a cinco grandes traços.",

   "Estudos com gêmeos indicam que cerca de 40% a 50% das diferenças nesses traços têm influência genética. O resto vem da vida: relações, trabalho, experiências. E a personalidade muda: com os anos, a maioria das pessoas fica um pouco mais organizada, gentil e emocionalmente estável.",

  body:["O psicólogo Daniel Kahneman, Nobel de Economia, descreveu dois modos de pensar. O Sistema 1 é rápido, automático e intuitivo. O Sistema 2 é lento, deliberado e analítico. Usamos os dois o tempo todo.",
   "O Sistema 1 resolve a maior parte do dia usando atalhos mentais. Eles ajudam muito, mas geram vieses: dar peso demais ao que aconteceu por último, ou temer mais perder do que desejar ganhar.",
   "E a emoção? O neurocientista António Damásio estudou pacientes com lesões em áreas que processam emoções: eles raciocinavam bem, mas tinham enorme dificuldade para decidir. Emoção não é inimiga da boa decisão, ela sinaliza o que importa para você.",
   "Em decisões grandes, combine os dois sistemas: escute o que sente e depois confira os fatos. Segundo Kahneman, a intuição merece mais confiança em áreas nas quais você já tem muita experiência."],
  try:"Na próxima decisão importante, anote sua primeira impressão. Depois liste prós e contras e veja se os dois caminhos concordam.",
  src:"Kahneman, “Rápido e Devagar” (2011); Kahneman & Klein (2009), sobre quando confiar na intuição; Damásio (1994), hipótese do marcador somático.",
  you:{serena:"Você tende a decidir sentindo o clima das coisas. Dê tempo ao Sistema 2 antes de respostas grandes.",exploradora:"Seu entusiasmo acelera o Sistema 1. Uma pausa curta antes de dizer sim evita arrependimentos.",analitica:"Você confia no Sistema 2. Lembre que a emoção também é informação, não só ruído.",conectiva:"Você decide pensando em como os outros vão se sentir. Coloque na conta o que você sente também.",contemplativa:"Sua intuição é forte. Ela funciona melhor quando você a testa com um pequeno passo concreto.",determinada:"Você decide rápido e com firmeza. Em escolhas difíceis de desfazer, vale conferir os fatos com calma."}},
 {id:'a3',title:"Como você lida com o estresse",cat:'emocoes',min:4,img:'photo-1506126613408-eca07ce68773',prefs:['Emoções','Autocuidado','Energia','Conflitos'],
  body:["Para os psicólogos Richard Lazarus e Susan Folkman, o estresse surge quando sentimos que uma situação exige mais do que temos para enfrentá-la. O jeito como reagimos a isso se chama enfrentamento.",
   "Existem dois grandes caminhos. O enfrentamento focado no problema age sobre a situação: planejar, resolver, buscar informação. O focado na emoção cuida do que você sente: desabafar, respirar, enxergar o que aconteceu por outro ângulo.",
   "Uma revisão de dezenas de estudos encontrou que agir sobre o problema está ligado a melhor saúde física e mental, enquanto fugir da situação ou só torcer para ela sumir está ligado a pior saúde. Mas nenhuma estratégia funciona sempre: quando dá para mudar a situação, agir costuma ser melhor; quando não dá, cuidar da emoção é o mais sábio.",
   "Se o estresse estiver constante e intenso, procurar ajuda profissional é um gesto de cuidado, não de fraqueza."],
  try:"Pense no que está pesando hoje e pergunte: isso depende de mim? Se sim, escolha um passo pequeno. Se não, escolha um gesto de cuidado com você.",
  src:"Lazarus & Folkman (1984), modelo transacional do estresse; Penley, Tomaka & Wiebe (2002), metanálise sobre enfrentamento e saúde; estudos de Bonanno sobre flexibilidade de enfrentamento.",
  you:{serena:"Você tende a absorver tudo. Escrever ou criar ajuda a transformar o que sente em algo que dá para olhar de fora.",exploradora:"Quando aperta, você tende a fugir para o novo. Movimento ajuda, mas volte para resolver o que ficou pendente.",analitica:"Focar no problema é seu forte. Quando não houver o que resolver, permita-se cuidar da emoção.",conectiva:"Você busca pessoas no estresse. Isso ajuda mais quando a conversa termina num próximo passo.",contemplativa:"Você se recolhe para processar. Só cuide para que o recolhimento não vire evitar a situação.",determinada:"Você parte para a ação. Lembre que descansar também é estratégia, não perda de tempo."}},
 {id:'a4',title:"Seu estilo de apego",cat:'relacionamentos',min:5,img:'photo-1518199266791-5375a83190b7',prefs:['Amor','Vida social','Emoções'],
  body:["A teoria do apego nasceu com o psiquiatra John Bowlby e a psicóloga Mary Ainsworth, que estudaram como bebês reagem à separação de quem cuida deles. Nos anos 1980, Cindy Hazan e Phillip Shaver mostraram que padrões parecidos aparecem nos relacionamentos adultos.",
   "No estudo deles, mais da metade das pessoas se descreveu como segura, e o restante se dividiu entre evitativa e ansiosa. No apego seguro, há confiança e proximidade tranquila. No ansioso, há medo de abandono e necessidade de muita confirmação. No evitativo, a proximidade incomoda e a independência vira proteção.",
   "Hoje os pesquisadores preferem pensar em duas escalas, ansiedade e evitação, em vez de caixinhas. Você pode estar mais perto de um padrão com uma pessoa e de outro com outra.",
   "A boa notícia: apego não é sentença. Relações seguras, autoconhecimento e terapia ajudam muita gente a construir o que os estudos chamam de segurança conquistada."],
  try:"Quando sentir insegurança numa relação, observe: você tende a buscar mais contato ou a se afastar? Só perceber o padrão já é um passo.",
  src:"Bowlby (1969); Ainsworth et al. (1978); Hazan & Shaver (1987); Brennan, Clark & Shaver (1998), modelo de duas dimensões do apego adulto.",
  you:{serena:"Sua sensibilidade capta pequenos sinais de distância. Antes de concluir algo, pergunte o que a outra pessoa quis dizer.",exploradora:"Seu amor pela liberdade pode parecer distância. Diga com palavras que precisar de espaço não é falta de carinho.",analitica:"Você pode racionalizar o que sente numa relação. Nomear a emoção em voz alta aproxima.",conectiva:"Você investe muito nos laços, e a falta de resposta pode doer. O silêncio do outro nem sempre é rejeição.",contemplativa:"Você precisa de espaço para processar. Avise quando estiver se recolhendo, para o outro não ler como afastamento.",determinada:"Sua independência é força, mas deixar alguém te ajudar também é uma forma de confiança."}},
 {id:'a5',title:"Sua linguagem do amor",cat:'relacionamentos',min:4,img:'photo-1516589178581-6cd7833ae3b2',prefs:['Amor','Felicidade','Vida social'],
  body:["As cinco linguagens do amor foram propostas em 1992 pelo conselheiro Gary Chapman: palavras de afirmação, tempo de qualidade, presentes, atos de serviço e toque físico. A ideia é que cada pessoa tem um jeito preferido de dar e receber carinho.",
   "Em 2024, pesquisadoras da Universidade de Toronto revisaram os estudos sobre o tema e encontraram pouco apoio científico. Muita gente valoriza várias linguagens ao mesmo tempo, e não houve evidência de que casais que “falam a mesma língua” sejam mais felizes.",
   "Elas propõem outra imagem: uma alimentação equilibrada. Relações saudáveis precisam de vários nutrientes, como companhia, apoio emocional, afeto e cuidado prático, e não de uma única linguagem.",
   "O valor do conceito está na conversa que ele abre: contar o que faz você sentir amor e perguntar o que faz o outro sentir o mesmo."],
  try:"Pergunte a alguém próximo: qual foi a última vez que você sentiu muito carinho vindo de mim? A resposta costuma surpreender.",
  src:"Chapman (1992); Impett, Park & Muise (2024), revisão na Current Directions in Psychological Science.",
  you:{serena:"Você expressa afeto em gestos e detalhes. Diga também em palavras o que precisa receber.",exploradora:"Experiências juntos te alimentam. O cotidiano também precisa de pequenos cuidados.",analitica:"Você ama resolvendo. Um elogio sincero ou um abraço completam o cuidado prático.",conectiva:"Palavras e presença te nutrem muito. Variar os nutrientes deixa a relação ainda mais rica.",contemplativa:"Presença silenciosa diz muito para você. Conte isso a quem você ama, porque nem todo mundo lê o silêncio.",determinada:"Você demonstra amor apoiando metas. Reservar tempo sem agenda também é uma forma de amar."}},
 {id:'a6',title:"Sua energia social: extroversão e introversão",cat:'relacionamentos',min:4,img:'photo-1529156069898-49953e39b3ac',prefs:['Vida social','Energia','Essência'],
  body:["Os termos foram popularizados por Carl Jung em 1921. Hoje a extroversão é um dos cinco grandes traços de personalidade e funciona como uma escala: a maioria das pessoas fica no meio do caminho.",
   "Introversão não é timidez. Timidez é medo do julgamento dos outros; introversão é preferir menos estímulo, como conversas a dois e ambientes calmos. O psicólogo Hans Eysenck sugeriu que introvertidos já têm um nível de ativação interna mais alto, por isso buscam menos estímulo de fora.",
   "Um achado curioso: estudos de William Fleeson mostram que, nos momentos em que agem de forma mais sociável, até pessoas introvertidas relatam mais emoções positivas. Não é sobre se forçar, e sim sobre conexão fazer bem a todos, cada um na sua dose.",
   "Conhecer sua energia social ajuda a planejar a semana: encontros que nutrem, intervalos para recarregar e menos culpa por precisar de silêncio."],
  try:"Depois de cada encontro desta semana, anote de 1 a 5 como ficou sua energia. Em poucos dias você descobre sua dose ideal.",
  src:"Jung, “Tipos Psicológicos” (1921); Eysenck (1967), teoria da ativação; Fleeson, Malanos & Achille (2002), Journal of Personality and Social Psychology.",
  you:{serena:"Você tende ao lado introvertido: encontros pequenos e profundos te fazem melhor que festas grandes.",exploradora:"Você tende à extroversão: gente e movimento te energizam. Só não esqueça das pausas.",analitica:"Você provavelmente prefere grupos menores e conversas com propósito. Isso é estilo, não falta de habilidade social.",conectiva:"Pessoas te energizam muito. Cuide para que a agenda cheia não roube seu descanso.",contemplativa:"Silêncio é seu combustível. Planeje encontros curtos e significativos, sem culpa.",determinada:"Você usa a energia social com objetivo. Reserve também encontros sem pauta, só pelo prazer."}},
 {id:'a7',title:"Pessoa Altamente Sensível",cat:'emocoes',min:4,img:'photo-1441974231531-c6227db76b6e',prefs:['Emoções','Essência','Energia','Autocuidado'],
  body:["Em 1997, a psicóloga Elaine Aron chamou de Pessoa Altamente Sensível quem processa estímulos e emoções com mais profundidade. O nome científico do traço é sensibilidade de processamento sensorial.",
   "A estimativa inicial era de 15% a 20% das pessoas. Um estudo de 2018 com 906 adultos encontrou três grupos: cerca de 31% de alta sensibilidade (as orquídeas), 40% de sensibilidade média (as tulipas) e 29% de baixa sensibilidade (os dentes-de-leão).",
   "Estudos de imagem cerebral indicam que pessoas muito sensíveis ativam mais áreas ligadas à atenção e à empatia. Por isso podem se cansar em lugares barulhentos, mas também percebem detalhes e se comovem com a beleza.",
   "Pesquisadores falam em suscetibilidade diferencial: pessoas sensíveis sofrem mais em ambientes difíceis, mas florescem mais em ambientes bons. Sensibilidade não é fraqueza, é um traço que pede um ambiente que cuide de você."],
  try:"Crie um pequeno refúgio no seu dia: dez minutos sem telas, com luz baixa e silêncio. Observe como você volta.",
  src:"Aron & Aron (1997); Lionetti et al. (2018), Translational Psychiatry; Acevedo et al. (2014), sensibilidade e empatia no cérebro.",
  you:{serena:"A sensibilidade é central no seu perfil. Proteger sua energia é o que deixa sua criatividade florescer.",exploradora:"Mesmo buscando novidade, você pode ter momentos de sobrecarga. Respeite os sinais do corpo depois de dias intensos.",analitica:"Talvez você sinta mais do que demonstra. Dar nome às emoções ajuda a processá-las sem analisar demais.",conectiva:"Você sente muito o que os outros sentem. Separar o que é seu do que é do outro evita cansaço emocional.",contemplativa:"Você provavelmente se reconhece como orquídea. Natureza e silêncio são seus melhores reguladores.",determinada:"Você talvez não se veja como sensível, mas notar a sobrecarga cedo evita esgotamento."}},
 {id:'a8',title:"Autocontrole e força de vontade",cat:'rotina',min:4,img:'photo-1484480974693-6ca0a78fb36b',prefs:['Rotina','Carreira','Decisões'],
  body:["No famoso teste do marshmallow, Walter Mischel ofereceu a crianças um doce agora ou dois se elas esperassem. As que esperaram mais pareciam ter melhores resultados anos depois.",
   "Em 2018, uma replicação com mais de 900 crianças encontrou uma relação bem menor, que quase desapareceu ao considerar a renda e o ambiente da família. O contexto pesa muito mais do que se pensava.",
   "Outra ideia popular, a de que a força de vontade se esgota como um músculo cansado, não se confirmou num grande teste feito em 23 laboratórios em 2016. E pesquisas de Angela Duckworth mostram que pessoas com bom autocontrole não resistem mais às tentações: elas criam hábitos e ambientes que evitam a tentação.",
   "Autocontrole tem menos a ver com ser forte e mais a ver com estratégia: deixar fácil o que você quer fazer e difícil o que você quer evitar."],
  try:"Escolha um hábito e deixe o caminho pronto hoje: o tênis ao lado da cama, o livro na bolsa, o celular fora do quarto.",
  src:"Mischel, Shoda & Rodriguez (1989); Watts, Duncan & Quan (2018), Psychological Science; Hagger et al. (2016), replicação em vários laboratórios; Galla & Duckworth (2015), sobre hábitos e autocontrole.",
  you:{serena:"Rituais bonitos funcionam melhor para você do que regras rígidas. Associe o hábito a algo prazeroso.",exploradora:"A rotina repetida te entedia. Varie o jeito de cumprir o hábito e mantenha o horário.",analitica:"Planos detalhados são seu forte. Acrescente gatilhos concretos: quando X acontecer, eu faço Y.",conectiva:"Hábitos em companhia funcionam melhor para você. Combine metas com alguém querido.",contemplativa:"Comece pequeno e com significado. Um hábito ligado a um valor seu dura mais.",determinada:"Você tende a confiar na disciplina. Ambientes bem preparados poupam sua energia para o que importa."}},
 {id:'a9',title:"Sua relação com dinheiro",cat:'rotina',min:4,img:'photo-1509042239860-f550ce710b93',prefs:['Carreira','Decisões','Estilo','Rotina'],
  body:["A economia comportamental mostra que não decidimos sobre dinheiro como calculadoras. Daniel Kahneman e Amos Tversky descobriram, por exemplo, que a dor de perder costuma pesar cerca de duas vezes mais do que a alegria de ganhar o mesmo valor.",
   "A personalidade também entra na conta. Pessoas mais organizadas e disciplinadas tendem a poupar e planejar mais. E emoções fortes, como tristeza e ansiedade, aumentam as compras por impulso.",
   "E o que traz bem-estar? Estudos de Elizabeth Dunn e colegas sugerem que gastar com outras pessoas e com experiências costuma trazer mais satisfação do que comprar objetos para si. Já valorizar demais bens materiais aparece ligado a menos bem-estar em várias pesquisas.",
   "Conhecer seus gatilhos ajuda mais do que uma planilha perfeita: perceber quando você gasta para aliviar uma emoção já muda muita coisa."],
  try:"Antes da próxima compra não planejada, espere 24 horas. Se ainda fizer sentido amanhã, compre sem culpa.",
  src:"Kahneman & Tversky (1979), teoria da perspectiva; Dunn, Aknin & Norton (2008), Science; Dunn, Gilbert & Wilson (2011), sobre gastar com experiências; Kasser (2002), sobre materialismo e bem-estar.",
  you:{serena:"Você gasta com beleza e significado. Separe um valor fixo para isso e aproveite sem culpa.",exploradora:"Experiências te fazem feliz, e as pesquisas concordam. Uma reserva para aventuras evita gastos por impulso.",analitica:"Planejar é natural para você. Cuide para que o controle não vire ansiedade com dinheiro.",conectiva:"Você ama presentear. Isso traz bem-estar, desde que caiba no seu orçamento.",contemplativa:"Você tende a precisar de pouco para ser feliz. Use isso a seu favor para construir segurança.",determinada:"Metas financeiras claras te motivam. Celebre cada marco, não só o resultado final."}},
 {id:'a10',title:"Perfeccionismo e autocrítica",cat:'emocoes',min:4,img:'photo-1474932430478-367dbb6832c1',prefs:['Carreira','Emoções','Mente','Autocuidado'],
  body:["Pesquisadores como Joachim Stoeber separam dois lados do perfeccionismo. Os esforços perfeccionistas são padrões altos e dedicação. As preocupações perfeccionistas são o medo de errar, a autocrítica dura e a sensação de nunca estar bom o bastante.",
   "O primeiro lado pode impulsionar. O segundo está ligado a ansiedade, procrastinação e esgotamento. E o perfeccionismo está crescendo: uma metanálise com mais de 41 mil universitários mostrou aumento contínuo entre 1989 e 2016.",
   "A saída não é baixar todos os padrões, e sim mudar o tom. Num estudo de Juliana Breines e Serena Chen, quem olhou para um erro com autocompaixão estudou mais para a prova seguinte do que quem só tentou elevar a autoestima.",
   "Autocompaixão, como define a psicóloga Kristin Neff, é tratar a si com a gentileza que teria com alguém querido: reconhecer o erro, lembrar que errar é humano e seguir com gentileza."],
  try:"Na próxima vez que se criticar, pergunte: eu falaria isso para alguém que amo? Reescreva a frase do jeito que falaria com essa pessoa.",
  src:"Stoeber & Otto (2006); Curran & Hill (2019), Psychological Bulletin; Breines & Chen (2012), Personality and Social Psychology Bulletin; Neff (2003).",
  you:{serena:"Você pode esperar o momento perfeito para criar. Feito com carinho vale mais do que perfeito e parado.",exploradora:"Você começa muita coisa. Aceitar versões imperfeitas te ajuda a terminar.",analitica:"Padrões altos fazem parte de você. Fique atenta quando o detalhe deixar de ajudar e começar a travar.",conectiva:"Você pode temer decepcionar os outros. Quem te ama não espera perfeição.",contemplativa:"Você reflete muito sobre os próprios erros. Transforme a reflexão em aprendizado e solte o resto.",determinada:"Seu nível de exigência é alto. Celebrar o progresso evita que a cobrança vire esgotamento."}},
 {id:'a11',title:"Inteligência emocional",cat:'emocoes',min:4,img:'photo-1457369804613-52c61a468e7d',prefs:['Emoções','Conflitos','Vida social','Mente'],
  body:["O conceito foi proposto em 1990 pelos psicólogos Peter Salovey e John Mayer e ficou famoso em 1995 com o livro de Daniel Goleman. No modelo original, inteligência emocional é um conjunto de habilidades, e não um traço fixo.",
   "São quatro habilidades: perceber emoções (em você e nos outros), usar as emoções para pensar, entender de onde elas vêm e como mudam, e regular o que você sente. Por serem habilidades, podem ser treinadas.",
   "Um exemplo simples: num estudo de Matthew Lieberman, colocar em palavras o que se sente diminuiu a atividade da amígdala, região do cérebro ligada às reações de alarme. Nomear a emoção já ajuda a acalmá-la.",
   "Quanto mais preciso o nome, melhor: “frustração” ou “sobrecarga” dizem mais do que “estou mal”. Ampliar seu vocabulário emocional é um treino que vale a pena."],
  try:"Três vezes hoje, pare e complete: agora eu me sinto... Use uma palavra mais específica do que bem ou mal.",
  src:"Salovey & Mayer (1990); Mayer & Salovey (1997), modelo das quatro habilidades; Lieberman et al. (2007), Psychological Science; estudos de Lisa Feldman Barrett sobre granularidade emocional.",
  you:{serena:"Perceber emoções é natural para você. Seu treino é regular o que sente sem se afogar nelas.",exploradora:"Você lê ambientes rápido. Tente nomear também o que sente quando o entusiasmo baixa.",analitica:"Entender emoções combina com sua mente curiosa. O desafio é senti-las antes de explicá-las.",conectiva:"Você lê muito bem o que os outros sentem. Aplique essa mesma atenção a você.",contemplativa:"Você observa seu mundo interno com profundidade. Compartilhar o que percebe aproxima quem você ama.",determinada:"Regular emoções sob pressão é seu forte. Perceber o cansaço cedo também é inteligência emocional."}},
 {id:'a12',title:"Sua rotina ideal e seu cronotipo",cat:'rotina',min:4,img:'photo-1495474472287-4d71bcdd2085',prefs:['Rotina','Dia ideal','Energia','Autocuidado'],
  body:["Cronotipo é a tendência natural do seu corpo a render mais de manhã ou à noite. Ele depende do relógio biológico, que regula sono, temperatura e hormônios num ciclo de cerca de 24 horas.",
   "Em 2019, um estudo com quase 700 mil pessoas encontrou 351 regiões do DNA ligadas a ser mais matutina ou mais noturna. O cronotipo também muda com a idade: adolescentes tendem a dormir mais tarde, e o horário vai se adiantando com os anos.",
   "Quando a agenda obriga você a viver fora do seu relógio, surge o que o cronobiologista Till Roenneberg chama de jet lag social: a diferença entre o horário do corpo e o horário dos compromissos. Ele está associado a mais cansaço e pior humor.",
   "Nem sempre dá para mudar o horário de trabalho, mas dá para ajustar o resto: tomar luz natural pela manhã, guardar as tarefas difíceis para o seu pico de energia e manter horários de sono parecidos no fim de semana."],
  try:"Durante uma semana, anote em que horário você se sente mais disposta. Coloque a tarefa mais importante do dia nesse horário.",
  src:"Jones et al. (2019), Nature Communications; Roenneberg et al. (2007 e 2012), sobre cronotipo e jet lag social.",
  you:{serena:"Você rende bem em blocos criativos sem interrupção. Proteja seu horário de pico para criar.",exploradora:"Sua rotina pede flexibilidade, mas horários de sono estáveis te dão energia para as aventuras.",analitica:"Você gosta de rotina organizada. Monte-a a partir do seu cronotipo, e não de um modelo pronto.",conectiva:"Sua agenda social pode empurrar o sono para tarde. Proteger o descanso te deixa mais presente.",contemplativa:"Manhãs sem pressa combinam com você. Luz natural cedo ajuda a manter o ritmo.",determinada:"Você tende a encaixar tarefas em todo horário livre. Respeitar o ritmo do corpo rende mais do que forçar."}},
 {id:'a13',title:"Como você lida com conflitos",cat:'relacionamentos',min:4,img:'photo-1510915361894-db8b60106cad',prefs:['Conflitos','Amor','Vida social'],
  body:["O modelo de Kenneth Thomas e Ralph Kilmann descreve cinco formas de lidar com conflitos: competir, colaborar, negociar um meio-termo, ceder e evitar. Elas variam em quanto você defende o que quer e em quanto considera o que o outro quer.",
   "Nenhum estilo é sempre o certo. Evitar pode ser sábio numa discussão sem importância; colaborar é ótimo quando a relação e o resultado importam. O problema é usar um estilo só, em todas as situações.",
   "O psicólogo John Gottman observou casais por décadas. Segundo ele, a maior parte dos conflitos de um casal se repete ao longo do tempo, porque nasce de diferenças de personalidade. O segredo não é eliminá-los, e sim conversar sobre eles com respeito.",
   "Gottman aponta quatro hábitos que mais prejudicam: crítica, desprezo, defensividade e silêncio punitivo. E um que mais ajuda: as tentativas de reparo, como uma pausa, um toque de humor ou um “vamos recomeçar?”."],
  try:"No próximo desentendimento, comece pelo que você sente, e não pelo que o outro fez: “eu me chateei quando...” em vez de “você sempre...”.",
  src:"Thomas & Kilmann (1974), instrumento de modos de conflito; Gottman (1994); Gottman & Silver, “Os Sete Princípios para o Casamento Dar Certo” (1999).",
  you:{serena:"Você tende a evitar conflitos para manter a paz. Dizer o que sente com calma também protege a relação.",exploradora:"Você fala na hora e segue em frente. Confira se o outro também já está pronto para seguir.",analitica:"Você pensa antes de falar, o que é ótimo. Só não deixe a lógica soar como frieza.",conectiva:"Você busca entender o outro lado. Cuide para não ceder sempre e esquecer o que você precisa.",contemplativa:"Você se afasta para processar. Avise que vai voltar à conversa, para o silêncio não virar punição.",determinada:"Você defende seu ponto com firmeza. Colaborar pode trazer soluções melhores do que vencer."}},
 {id:'a14',title:"Resiliência: como você se levanta",cat:'forcas',min:4,img:'photo-1551632811-561732d1e306',prefs:['Emoções','Novidades','Felicidade','Essência'],
  body:["Por muito tempo se achou que resiliência era rara, coisa de pessoas excepcionais. Os estudos do psicólogo George Bonanno mostraram o contrário: depois de perdas e eventos difíceis, em média cerca de dois terços das pessoas mantêm um funcionamento estável ao longo do tempo.",
   "A psicóloga Ann Masten chamou isso de “mágica comum”: a resiliência vem de recursos do dia a dia, como vínculos próximos, sensação de capacidade, esperança e sentido.",
   "Ser resiliente não significa não sofrer. Significa sofrer e, aos poucos, voltar a funcionar. E muitos desses recursos podem ser fortalecidos: cultivar relações, cuidar do corpo, praticar um otimismo realista e lembrar do que você já superou.",
   "Pedir ajuda faz parte da resiliência. Ninguém se levanta sem apoio o tempo todo."],
  try:"Lembre de uma dificuldade que você já superou. Anote três coisas que te ajudaram naquela época: elas são seus recursos de hoje.",
  src:"Bonanno (2004), American Psychologist; Galatzer-Levy, Huang & Bonanno (2018), revisão de trajetórias após eventos potencialmente traumáticos; Masten (2001), “Ordinary Magic”.",
  you:{serena:"Sua criatividade é um recurso de resiliência: transformar dor em expressão ajuda a seguir.",exploradora:"Sua adaptabilidade te ajuda a recomeçar. Dê tempo também para sentir o que mudou.",analitica:"Entender o que aconteceu te acalma. Combine essa clareza com o apoio de pessoas próximas.",conectiva:"Seus vínculos são seu maior escudo. Deixe as pessoas cuidarem de você também.",contemplativa:"Encontrar sentido é seu jeito de se reerguer. Escrever ajuda a organizar o que você viveu.",determinada:"Você se levanta rápido. Cuide para não pular a parte de sentir, ela também faz parte."}},
 {id:'a15',title:"Seus valores e seu propósito",cat:'proposito',min:4,img:'photo-1506905925346-21bda4d32df4',prefs:['Felicidade','Essência','Carreira','Dia ideal'],
  body:["A psicologia positiva, liderada por Martin Seligman, estuda o que faz a vida valer a pena. No modelo PERMA, o bem-estar tem cinco pilares: emoções positivas, engajamento, relacionamentos, sentido e realizações.",
   "Pesquisadores diferenciam dois tipos de bem-estar: o hedônico, ligado ao prazer do momento, e o eudaimônico, ligado a viver de acordo com seus valores e com um propósito. Os dois importam, mas o segundo tende a sustentar a satisfação por mais tempo.",
   "Propósito também faz bem ao corpo. Um estudo que acompanhou mais de 6 mil adultos por 14 anos encontrou que as pessoas com mais senso de propósito viveram mais, em qualquer idade.",
   "Valores são o que é importante para você: liberdade, família, criatividade, segurança, justiça. O psicólogo Shalom Schwartz mostrou que os mesmos valores aparecem em culturas do mundo todo, mudando a ordem de prioridade. Conhecer os seus ajuda a decidir para onde ir."],
  try:"Escolha os três valores mais importantes para você hoje. Depois confira: sua agenda desta semana reflete esses três?",
  src:"Seligman, “Florescer” (2011); Huta & Ryan (2010), sobre bem-estar hedônico e eudaimônico; Hill & Turiano (2014), Psychological Science; Schwartz (1992), teoria dos valores.",
  you:{serena:"Beleza e expressão costumam estar entre seus valores. Criar algo é seu jeito de viver com propósito.",exploradora:"Liberdade e descoberta provavelmente lideram seus valores. Para você, propósito é crescer explorando.",analitica:"Conhecimento e competência tendem a guiar você. Usar o que sabe para ajudar alguém dá um sentido extra.",conectiva:"Amor e conexão são seu norte. Seu propósito costuma passar pelas pessoas de quem você cuida.",contemplativa:"Sentido é sua busca natural. Pequenas ações alinhadas aos seus valores trazem essa sensação no dia a dia.",determinada:"Realização te move. Ligar suas metas a um porquê maior torna as conquistas mais satisfatórias."}}
];

 }

const K_TOKEN='orivie_token';

function dataOf(u){const d={};for(const k in u)if(!LOCAL_ONLY.includes(k))d[k]=u[k];return d}
const cloud=(action,body={},timeout)=>api('account',{method:'POST',body:JSON.stringify({action,...body}),token:CLOUD.token,timeout:timeout||15000});
async function detectCloud(){
 CLOUD.token=LS.get(K_TOKEN,null);if(typeof CLOUD.token!=='string')CLOUD.token=null;
 if(isDemoHost()){CLOUD.on=false;return false}
 const r=await api('account',{method:'POST',body:JSON.stringify({action:'ping'}),timeout:7000});

/* Aplica no aparelho o que veio da nuvem. O status de pagamento é SEMPRE o do servidor. */
function applyCloud(res,local){
 const pr=res.profile||{};const d=res.data||{};
 const u=fix({...d});
 if(local&&Array.isArray(local.boards)){const ids=new Set(u.boards.map(b=>b.id));u.boards=u.boards.concat(local.boards.filter(b=>b&&!ids.has(b.id)))}
 Object.assign(u,{email:pr.email,name:pr.name||u.name,birth:pr.birth||u.birth,paid:!!pr.paid,payMethod:pr.payMethod||'',payDate:pr.payDate||'',created:(pr.created||'').slice(0,10)||u.created,pass:'',_cloudAt:res.updatedAt||Date.now(),_localAt:res.updatedAt||Date.now()});
 if(u.testDone&&!u.profile)u.profile='serena';
 DB.users[pr.email]=u;return u;
}
function schedulePush(){if(!CLOUD.on||!CLOUD.token||!U())return;const u=U();u._localAt=Date.now();clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(pushCloud,1200)}
async function pushCloud(){
 const u=U();if(!CLOUD.on||!CLOUD.token||!u)return;
 if(CLOUD.pushing){CLOUD.again=true;return}
 CLOUD.pushing=true;const sentAt=u._localAt;
 const r=await cloud('save',{data:dataOf(u),name:u.name,birth:u.birth});
 CLOUD.pushing=false;
 if(r.ok){u._cloudAt=r.data.updatedAt;if(u._localAt===sentAt)u._localAt=r.data.updatedAt;
  const wasPaid=u.paid;u.paid=!!(r.data.profile&&r.data.profile.paid);saveLocal();if(wasPaid&&!u.paid)render()}
 else if(r.status===401)sessionExpired();
 else if(r.status===413)toast(r.data.message||'Seus dados ficaram grandes demais. Apague boards antigos.');
 if(CLOUD.again){CLOUD.again=false;pushCloud()}
}
/* Atualiza o aparelho com a nuvem ao abrir o app (e corrige qualquer "pago" falso no navegador). */
async function refreshCloud(){
 const u=U();if(!CLOUD.on||!u)return false;
 if(!CLOUD.token){DB.session=null;saveLocal();toast('Atualizamos o Orivie! Entre de novo para guardar seu progresso na nuvem.');go('login');return true}
 const r=await cloud('me');
 if(r.status===401){sessionExpired();return true}
 if(!r.ok)return false;
 const before=JSON.stringify([u.paid,u.testDone,u.prefsDone]);
 if((r.data.updatedAt||0)>(u._cloudAt||0)||!u._localAt||u._localAt<=(u._cloudAt||0))applyCloud(r.data,u);
 else{u.paid=!!r.data.profile.paid;pushCloud()}
 saveLocal();const nu=U();
 if(JSON.stringify([nu.paid,nu.testDone,nu.prefsDone])!==before){go(stepFor(nu))}else render();
 return true;
}
async function stillValid(){for(const ms of [1500,4000]){await new Promise(r=>setTimeout(r,ms));const r=await cloud('me');if(r.ok)return true;if(r.status!==401)return true}return false}
async function sessionExpired(){if(await stillValid())return;setToken(null);DB.session=null;saveLocal();closeModal();toast('Sua sessão expirou. Entre de novo.');go('login')}

async function hashPass(p){
 try{if(window.crypto&&crypto.subtle&&window.TextEncoder){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('orivie::'+p));return 'sha256:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 return djb2(p);
}
function djb2(p){let h=5381;const s='orivie::'+p;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'djb2:'+(h>>>0).toString(16)}
async function checkPass(p,stored){if(!stored)return false;if(String(stored).startsWith('djb2:'))return djb2(p)===stored;return (await hashPass(p))===stored}

function calcProfile(answers){
 try{
  const s={};DIMS.forEach(k=>s[k]=0);
  for(let i=0;i<10;i++){
   let a=answers&&answers[i];
   if(typeof a!=='string'||a.length!==1||!'ABCDE'.includes(a))a='C';
   const add=(SCORING[i]&&SCORING[i][a])||{};
   for(const k in add)s[k]+=add[k];
  }
  let best=PROFILES[0],bv=-1;
  PROFILES.forEach(p=>{const v=p.dims.reduce((t,k)=>t+(s[k]||0),0);if(v>bv){bv=v;best=p}});
  return {profile:best.id,scores:s};
 }catch(e){return {profile:'serena',scores:{}}}
}

function markActive(){
 const u=U();if(!u)return;const t=today();
 if(!u.days.includes(t)){

  if(MILESTONES.includes(s))ui.milestone=s;
 }
}

let AC=null;
function soundOn(){const u=U();return !u||u.sound!==false}
function vib(p){try{if(soundOn()&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function sfx(kind){
 if(!soundOn())return;
 try{
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const notes={tap:[[620,.05]],ok:[[660,.08],[880,.13]],win:[[523,.1],[659,.1],[784,.1],[1047,.28]],soft:[[330,.14]]}[kind]||[];
  let t=AC.currentTime;
  notes.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.14,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.85});
 }catch(e){}
 if(kind==='ok')vib(18);if(kind==='win')vib([30,40,60]);if(kind==='soft')vib(40);
}

 const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=msg;

}

function confetti(n=70){
 if(reduced())return;
 const cols=['#D9A08B','#A8B8A0','#E3B65E','#EAE2D9','#B97F6A','#879A7E'];
 const box=document.createElement('div');box.className='cf-box';box.setAttribute('aria-hidden','true');
 for(let i=0;i<n;i++){const s=document.createElement('i');s.className='cf';s.style.left=Math.random()*100+'%';s.style.background=cols[i%cols.length];s.style.animationDelay=(Math.random()*.4)+'s';s.style.animationDuration=(1.5+Math.random()*1.1)+'s';s.style.setProperty('--dx',(Math.random()*160-80)+'px');s.style.setProperty('--r',(Math.random()*720-360)+'deg');if(i%3===0)s.style.borderRadius='50%';box.appendChild(s)}
 document.body.appendChild(box);setTimeout(()=>box.remove(),3200);
}
function countUp(){
 document.querySelectorAll('[data-count]').forEach(el=>{
  const to=+el.dataset.count||0;el.removeAttribute('data-count');
  if(reduced()||to<=0){el.textContent=to;return}
  const t0=performance.now(),D=900;el.textContent='0';
  const step=t=>{const k=Math.min(1,(t-t0)/D);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
 });
}

const PUBLIC=['boas-vindas','cadastro','login'];
const TABS=[{id:'hoje',n:'Hoje',ic:'sun'},{id:'combina',n:'Combina',ic:'heart'},{id:'checklist',n:'Checklist',ic:'check'},{id:'board',n:'Board',ic:'grid'},{id:'aprender',n:'Aprender',ic:'book'},{id:'eu',n:'Eu',ic:'user'}];
/* A tela é desenhada direto pelo app; o endereço (#) é só um extra para o botão Voltar.
   Assim o app funciona mesmo em visualizadores que bloqueiam ou não avisam mudanças de endereço. */
function hashRoute(){let h='';try{h=location.hash||''}catch(e){}h=h.replace(/^#\/?/,'').replace('/','-');return h||'boas-vindas'}
const route=()=>ui.route||hashRoute();
function setHash(r,push){
 try{if(location.hash==='#'+r)return}catch(e){return}
 ui.ownHash='#'+r;
 try{if(push)location.hash=r;else history.replaceState(null,'','#'+r)}
 catch(e){try{location.replace('#'+r)}catch(e2){ui.ownHash=null}}
}
function go(r){ui.route=r;render();setHash(r,true)}
function stepFor(u){if(!u.paid)return 'pagamento';if(!u.testDone)return 'teste';if(!u.prefsDone)return 'personalizacao';return 'app-hoje'}
function allowed(r,u){
 if(!u)return PUBLIC.includes(r)?r:'boas-vindas';
 if(PUBLIC.includes(r))return stepFor(u);
 if(r==='pagamento')return u.paid?stepFor(u):r;
 if(!u.paid)return 'pagamento';
 if(r==='teste')return u.testDone?stepFor(u):r;
 if(!u.testDone)return 'teste';
 if(r==='personalizacao')return r;
 if(!u.prefsDone)return 'personalizacao';
 if(r==='resultado')return r;
 if(TABS.some(t=>'app-'+t.id===r))return r;
 return 'app-hoje';
}
const APP=()=>document.getElementById('app');
function render(){
 clearInterval(ui.pixTimer);
 try{
  const u=U();const want=route();const r=allowed(want,u);
  if(r!==want){ui.route=r;setHash(r,false)}
  if(r!=='personalizacao')ui.prefs=null;
  if(r!=='teste')ui.q=null;
  let html='';
  if(r==='boas-vindas')html=vWelcome();
  else if(r==='cadastro'||r==='login')html=vAuth(r);
  else if(r==='pagamento')html=vPay(u);
  else if(r==='teste')html=vTest(u);
  else if(r==='personalizacao')html=vPrefs(u);
  else if(r==='resultado')html=vResult(u);
  else html=vApp(u,r.slice(4));
  APP().innerHTML=html;
  if(ui.lastRoute!==r)window.scrollTo(0,0);
  ui.lastRoute=r;
  after(r,u);
 }catch(e){
  console.error(e);
  APP().innerHTML=brand()+`<main class="screen"><div class="empty">${mascot('sad',120)}<h1 class="h1 mt-4">Opa, tropecei aqui!</h1><p class="muted mt-2">Seus dados estão seguros. Vamos voltar para um lugar conhecido?</p><button class="btn btn-primary mt-6" data-act="hardHome">Voltar ao início</button></div></main>`;
 }
}
function after(r,u){
 countUp();ui.justPicked=false;
 if(r==='app-board')paintBoards();
 if(r==='pagamento'&&PAY.mode==='real'&&u&&u.pix)ui.pixTimer=setInterval(()=>pixCheck(true),5000);
 if(r==='resultado'&&u&&!u.resultSeen){u.resultSeen=true;save();setTimeout(()=>{confetti();sfx('win')},250)}
 if(ui.scrollTo){const el=document.getElementById(ui.scrollTo);ui.scrollTo=null;if(el)setTimeout(()=>el.scrollIntoView({behavior:reduced()?'auto':'smooth',block:'start'}),80)}
}

function qrSvg(){
 const n=25;let r='';let seed=1290;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const inF=(x,y)=>(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8);
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inF(x,y))continue;if(rnd()>.5)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="${C.T}"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="${C.T}"/>`;
 return `<svg viewBox="-1 -1 ${n+2} ${n+2}" width="190" height="190" shape-rendering="crispEdges" role="img" aria-label="QR Code PIX"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><g fill="${C.T}">${r}</g>${fin(0,0)}${fin(n-7,0)}${fin(0,n-7)}</svg>`;
}

async function pixCheck(silent){
 const u=U();if(!u||!u.pix||ui.pixChecking)return;
 ui.pixChecking=true;const r=await api('pix-status?id='+encodeURIComponent(u.pix.id));ui.pixChecking=false;
 if(r.ok&&r.data.paid){unlockPaid(u,'pix');return}
 const st=r.data&&r.data.status;
 if(['cancelled','rejected','expired','refunded','charged_back'].includes(st)){u.pix=null;save();render();toast('Esse PIX expirou ou foi cancelado. Gere um novo para continuar.');return}
 if(!silent){if(r.status===0)toast('Sem conexão agora. Tente de novo em instantes.');else infoBox({title:'Ainda não recebemos',text:'Pode levar alguns segundos depois de pagar. Continuamos verificando sozinhos, não precisa gerar outro PIX.',mood:'think'})}
}
function unlockPaid(u,method){
 if(CONFIG.metodo==='codigo'&&method!=='codigo')return;

 sfx('win');confetti();

}

/* ---- Aba Hoje ---- */
function ring(r){const L=2*Math.PI*44;return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="none" stroke="${C.BE}" stroke-width="7"/><circle cx="50" cy="50" r="44" fill="none" stroke="${C.TE}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(L*Math.max(.03,Math.min(1,r))).toFixed(1)} ${L.toFixed(1)}" transform="rotate(-90 50 50)"/></svg>`}
function weekDays(){const now=new Date();const dow=(now.getDay()+6)%7;const mon=new Date(now.getFullYear(),now.getMonth(),now.getDate()-dow);return Array.from({length:7},(_,i)=>new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i))}
function dayState(u,k){const t=today();const act=u.days.includes(k);if(k<t&&!act&&k<(u.created||t))return 'before';return k<t?(act?'done':'missed'):k===t?(act?'done':'current'):'locked'}
function weekTrail(u){
 const offs=[0,45,70,45,0,-45,-70];const cl=u.checklist;const ratio=cl.items.length?cl.items.filter(i=>i.done).length/cl.items.length:0;
 const th=prof(u).themes[isoWeek()%4];
 const rows=weekDays().map((d,i)=>{const k=ymd(d);const st=dayState(u,k);
  const icn=st==='done'?ic('tick',30):st==='locked'?ic('lock',24):st==='current'?ic('starc',30):ic('leaf',26);
  const lab={done:'concluído',missed:'em branco',before:'antes de você chegar',current:'hoje, a fazer',locked:'ainda não chegou'}[st];
  return `<div class="trow" style="transform:translateX(${offs[i]}px)">${st==='current'?`<span class="balloon">Começar</span>${ring(ratio)}`:''}<button class="node ${st==='before'?'missed':st}" data-act="dayInfo" data-d="${k}" aria-label="${DIAS[d.getDay()]}: ${lab}">${icn}</button><span class="node-cap">${k===today()?'Hoje':DIAS[d.getDay()].slice(0,3)}</span></div>`}).join('');
 return `<section class="mt-6" id="semana"><div class="unit-head"><div><p class="unit-kicker">Semana ${isoWeek()} · Tema da semana</p><h2 class="unit-title">${th.t}</h2></div><button class="btn btn-outline btn-sm" data-act="guide" data-v="semana">${ic('bookc',16)} Guia</button></div>
 <div class="trail">${rows}<div class="trail-pal left">${mascot(new Date().getHours()>=22||new Date().getHours()<5?'sleep':'happy',62,'floaty')}</div><div class="trail-pal right">${mascot('think',56)}</div></div></section>`;
}

 return `

  <div class="mt-2">${cl.items.slice(0,4).map(i=>`<button class="mini-check ${i.done?'on':''}" role="checkbox" aria-checked="${i.done}" data-act="toggleCheck" data-id="${i.id}"><span class="dot">${i.done?ic('tick',16):''}</span><span><span class="block">${esc(i.t)}</span>${i.done?'':'<span class="block small muted" style="font-weight:400">Pendente</span>'}</span>${i.done?'<span class="ok">Concluído</span>':''}</button>`).join('')}</div>

  stk.forEach(({st,im},i)=>{const [px,py]=spots[i%spots.length];const w=st.size*(.7+r()*.25),h=w*(st.ar||1);

function compress(file,max,q){
 return new Promise(res=>{try{
  if(!file||!/^image\//.test(file.type||'image/'))return res(null);
  const r=new FileReader();r.onerror=()=>res(null);
  r.onload=()=>{const im=new Image();im.onerror=()=>res(null);im.onload=()=>{try{let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;if(!w||!h)return res(null);const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))}catch(e){res(null)}};im.src=r.result};
  r.readAsDataURL(file);
 }catch(e){res(null)}});
}
