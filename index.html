document.addEventListener('click',e=>{
 if(e.target.matches&&e.target.matches('[data-backdrop]')){if(ui.modal&&!ui.modal.lock)closeModal();return}
 const el=e.target.closest('[data-act]');
 if(!el||el.disabled)return;
 const fn=ACT[el.dataset.act];
 if(fn){try{fn(el,e)}catch(err){console.error(err);toast('Opa! Tenta de novo?')}}
});
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset&&f.dataset.form;if(!k||!FORMS[k])return;e.preventDefault();try{const r=FORMS[k](f);if(r&&r.catch)r.catch(err=>{console.error(err);toast('Opa! Tenta de novo?')})}catch(err){console.error(err)}});
document.addEventListener('input',e=>{
 const el=e.target;if(el.dataset.mask)mask(el);
 if(el.classList.contains('bad')){el.classList.remove('bad');const er=el.parentElement&&el.parentElement.querySelector('.err');if(er)er.textContent=''}
 const k=el.dataset.in;if(!k)return;const u=U();if(!u)return;
 if(k==='note'){const it=u.checklist&&u.checklist.items.find(i=>i.id===el.dataset.id);if(it){it.note=el.value.slice(0,200);save()}}
 if(k==='bgrat'){const n=+el.dataset.i;if(!Array.isArray(u.board.grat))u.board.grat=['','',''];u.board.grat[n]=el.value.slice(0,40);save();clearTimeout(ui.bt);ui.bt=setTimeout(()=>{const c=$('#bprev');if(c)drawBoard(c,u.board)},250)}
 if(k==='btitle'){u.board.title=el.value.slice(0,40);save();clearTimeout(ui.bt);ui.bt=setTimeout(()=>{const c=$('#bprev');if(c)drawBoard(c,u.board)},180)}
});
document.addEventListener('change',async e=>{
 const el=e.target;const kind=el.dataset&&el.dataset.file;if(!kind)return;
 const u=U();if(!u)return;const files=[...(el.files||[])];el.value='';if(!files.length)return;
 if(kind==='board'){
  const before=u.board.photos.length;const room=BOARD_MAX-before;
  if(files.length>room)toast(`Cabem mais ${room} foto${room===1?'':'s'} neste board.`);
  let fails=0;
  for(const f of files.slice(0,Math.max(0,room))){const d=await compress(f,720,.7);if(d)u.board.photos.push(d);else fails++}
  if(fails)toast('Não consegui abrir uma das imagens.');
  if(!save()){u.board.photos=u.board.photos.slice(0,before);LS.set(K_USERS,DB.users)}else if(u.board.photos.length>before)sfx('ok');
  render();
 }
 if(kind==='avatar'){
  const d=await compress(files[0],320,.82);
  if(!d){toast('Não consegui abrir essa imagem.');return}
  const old=u.photo;u.photo=d;if(!save()){u.photo=old;LS.set(K_USERS,DB.users)}else{sfx('ok');toast('Foto atualizada!')}
  render();
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&ui.modal&&!ui.modal.lock){closeModal();return}
 if(route()!=='teste'||ui.modal)return;
 const tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA')return;
 let idx='12345'.indexOf(e.key);if(idx<0)idx='ABCDE'.indexOf(String(e.key).toUpperCase());
 if(idx>=0&&e.key.length===1){e.preventDefault();pickAnswer('ABCDE'[idx]);return}
 if(e.key==='Enter'&&tag!=='BUTTON'){const b=$('[data-act="qNext"]');if(b&&!b.disabled){e.preventDefault();b.click()}}
});
window.addEventListener('hashchange',()=>{let h='';try{h=location.hash}catch(e){}if(ui.ownHash&&h===ui.ownHash){ui.ownHash=null;return}ui.ownHash=null;const r=hashRoute();if(r===ui.route)return;if(ui.modal&&!ui.modal.lock)closeModal();ui.route=r;render()});
window.addEventListener('storage',e=>{if(e.key===K_USERS||e.key===K_SESSION){loadDB();render()}});

/* =========================================================
   INÍCIO
   ========================================================= */
try{loadDB()}catch(e){DB={users:{},session:null}}
function watchBadge(){const check=()=>{try{document.body.classList.toggle('nl-badge-on',!!document.getElementById('nl-badge-frame'))}catch(e){}};check();try{new MutationObserver(check).observe(document.body,{childList:true})}catch(e){}}
watchBadge();
ui.route=hashRoute();
PAY.mode=CONFIG.metodo==='codigo'?'code':isDemoHost()?'demo':'checking';
ui.cloudReady=detectCloud().then(on=>{if(on)return refreshCloud()}).catch(()=>{});
render();
detectPay().then(async()=>{const u=U();if(u&&await syncAccess(u)){go(stepFor(u));return}if(route()==='pagamento')render()});
</script>
