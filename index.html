 {id:'a16',title:'Sócrates e o “conhece-te a ti mesmo”',cat:'filosofia',img:'photo-1457369804613-52c61a468e7d',
  body:['“Conhece-te a ti mesmo” é uma frase que, segundo autores antigos, estava inscrita no templo de Apolo, em Delfos, na Grécia. Ela virou símbolo de uma ideia que atravessou séculos: antes de entender o mundo, vale entender quem somos.',
   'Sócrates (c. 470–399 a.C.), filósofo de Atenas, não deixou nada escrito. Conhecemos suas ideias principalmente pelos diálogos de seu aluno Platão. Seu jeito de filosofar era fazer perguntas: em vez de dar respostas prontas, ele questionava as pessoas até que elas percebessem contradições no que achavam saber.',
   'Na Apologia, Platão registra uma das frases mais famosas atribuídas a Sócrates no julgamento que o condenou: “uma vida sem exame não vale a pena ser vivida”. Examinar a própria vida significa perguntar por que fazemos o que fazemos e se isso combina com o que valorizamos.',
   'Sócrates também ficou conhecido por reconhecer os limites do próprio conhecimento. Admitir que não sabemos tudo não é fraqueza: é o ponto de partida para aprender.'],
  you:{serena:'Sua sensibilidade combina com a escuta socrática: pergunte antes de concluir.',exploradora:'Use sua curiosidade para fazer perguntas, não só para buscar novidades.',analitica:'O método das perguntas é a sua praia. Só cuide para examinar também o que sente.',conectiva:'Pergunte às pessoas próximas o que elas veem em você e compare com o que você pensa.',contemplativa:'Você já vive examinando a vida. Escreva as perguntas que mais te acompanham.',determinada:'Antes da próxima meta, pergunte: por que isso importa para mim?'},
  try:'Escolha uma crença sua (por exemplo, “eu não sou criativa”) e faça três perguntas sobre ela: de onde veio, que provas eu tenho, o que pode estar errado?',
  src:'Platão, Apologia de Sócrates (38a); Stanford Encyclopedia of Philosophy, verbete “Socrates”.'},
 {id:'a17',title:'Estoicismo: o que depende de você',cat:'filosofia',img:'photo-1506905925346-21bda4d32df4',
  body:['O estoicismo é uma escola filosófica que nasceu em Atenas por volta de 300 a.C., com Zenão de Cítio, e ficou muito popular em Roma. Seus nomes mais conhecidos são Sêneca, Epicteto e o imperador Marco Aurélio.',
   'Epicteto, que viveu parte da vida como escravizado, começa o Manual (Encheirídion) com uma distinção simples: algumas coisas dependem de nós, como nossos julgamentos, escolhas e atitudes; outras não, como a opinião dos outros, o corpo, a reputação e muitos acontecimentos.',
   'Para os estoicos, boa parte do sofrimento vem de tentar controlar o que não depende de nós. A proposta é concentrar energia no que podemos escolher: como interpretamos os fatos e como agimos diante deles.',
   'Marco Aurélio escreveu suas reflexões pessoais em um caderno que hoje conhecemos como Meditações. Ali ele lembra a si mesmo de agir com justiça, calma e atenção ao presente. Muitas técnicas da psicologia atual, como a terapia cognitivo-comportamental, reconhecem influência dessas ideias.'],
  you:{serena:'Quando absorver demais o clima ao redor, pergunte: isso depende de mim?',exploradora:'Liberdade estoica é escolher a própria atitude, mesmo quando o roteiro muda.',analitica:'Separe em duas colunas o que depende e o que não depende de você.',conectiva:'Você não controla o que os outros sentem, só como você cuida e se posiciona.',contemplativa:'As Meditações de Marco Aurélio podem ser uma boa leitura para você.',determinada:'Foque a energia no seu esforço, não no resultado que não controla.'},
  try:'Pense em uma preocupação de hoje. Escreva o que depende de você e o que não depende. Escolha uma ação só para a primeira lista.',
  src:'Epicteto, Manual (Encheirídion), 1; Marco Aurélio, Meditações; Robertson, D. (2010), The Philosophy of Cognitive-Behavioural Therapy.'},
 {id:'a18',title:'Existencialismo: liberdade e escolha',cat:'filosofia',img:'photo-1481627834876-b7833e8f5570',
  body:['O existencialismo é uma corrente filosófica que ganhou força na França depois da Segunda Guerra Mundial. Seus principais nomes são Jean-Paul Sartre e Simone de Beauvoir, mas a corrente tem raízes em pensadores como Søren Kierkegaard.',
   'Na conferência “O existencialismo é um humanismo” (1945, publicada em 1946), Sartre resumiu a ideia central: “a existência precede a essência”. Ou seja, não nascemos com um propósito pronto; vamos nos definindo pelas escolhas que fazemos.',
   'Simone de Beauvoir aplicou essa reflexão à vida das mulheres em O segundo sexo (1949), com a frase famosa “Ninguém nasce mulher: torna-se mulher”. Ela mostrou como muitos papéis tratados como “naturais” são construídos pela cultura e pela história.',
   'Para os existencialistas, liberdade traz responsabilidade: escolher também é responder pelo que escolhemos. Isso pode gerar angústia, mas também abre espaço para criar uma vida com mais autenticidade.'],
  you:{serena:'Sua criatividade é uma forma de escolher quem você quer ser.',exploradora:'Você valoriza liberdade. Lembre que ela inclui assumir as consequências.',analitica:'Pergunte quais escolhas suas foram de fato suas e quais foram herdadas.',conectiva:'Ser autêntica também é cuidar de si, não só corresponder ao que esperam.',contemplativa:'As grandes perguntas que você faz são o coração do existencialismo.',determinada:'Suas metas mostram quem você está escolhendo ser.'},
  try:'Complete: “Uma escolha que eu fiz e que mostra quem eu sou foi...”. Depois escreva uma escolha que você quer fazer este mês.',
  src:'Sartre, J.-P. (1946), O existencialismo é um humanismo; Beauvoir, S. (1949), O segundo sexo; Stanford Encyclopedia of Philosophy, “Existentialism”.'},
 {id:'a19',title:'Ética: três jeitos de pensar o que é certo',cat:'filosofia',img:'photo-1474932430478-367dbb6832c1',
  body:['A ética é a parte da filosofia que pergunta como devemos agir. Ao longo da história, surgiram três grandes formas de responder a essa pergunta, e elas ainda aparecem nas nossas decisões do dia a dia.',
   'A ética das virtudes, ligada a Aristóteles (Ética a Nicômaco), pergunta: que tipo de pessoa eu quero ser? Para ele, virtudes como coragem e generosidade são hábitos construídos pela prática, e costumam estar no meio-termo entre o excesso e a falta.',
   'A ética do dever, ligada a Immanuel Kant, diz que algumas ações são certas ou erradas em si mesmas. Seu “imperativo categórico” propõe agir de um jeito que você aceitaria como regra para todos, e tratar as pessoas sempre como fins, nunca apenas como meios.',
   'O utilitarismo, de Jeremy Bentham e John Stuart Mill, avalia as ações pelas consequências: a melhor escolha é a que produz mais bem-estar para mais pessoas. Na prática, muitas decisões difíceis ficam mais claras quando olhamos por esses três ângulos.'],
  you:{serena:'Você tende a sentir o que é certo. Os três ângulos ajudam a explicar essa intuição.',exploradora:'Antes de uma decisão rápida, pense nas consequências para quem está perto.',analitica:'Use os três ângulos como um checklist para decisões importantes.',conectiva:'Você pensa muito nos outros. Lembre de incluir você na conta do bem-estar.',contemplativa:'A pergunta de Aristóteles, “quem eu quero ser?”, combina com você.',determinada:'Resultados importam, e também os meios usados para chegar lá.'},
  try:'Pense em uma decisão difícil e responda: que virtude ela pede? Ela seria aceitável como regra para todos? Quais consequências ela traz?',
  src:'Aristóteles, Ética a Nicômaco; Kant, I. (1785), Fundamentação da metafísica dos costumes; Mill, J. S. (1863), Utilitarismo.'},
 {id:'a20',title:'Mulheres que mudaram a ciência',cat:'historia',img:'photo-1554907984-15263bfd63bd',
  body:['A história da ciência tem muitas mulheres que fizeram descobertas fundamentais, muitas vezes enfrentando a exclusão das universidades e o pouco reconhecimento da época.',
   'Ada Lovelace (1815–1852) escreveu, em 1843, notas sobre a Máquina Analítica de Charles Babbage. Nelas está um procedimento para calcular números de Bernoulli, considerado um dos primeiros algoritmos pensados para uma máquina. Por isso, ela é lembrada como pioneira da programação.',
   'Marie Curie (1867–1934) estudou a radioatividade e descobriu, com Pierre Curie, os elementos polônio e rádio. Recebeu o Nobel de Física em 1903 e o de Química em 1911, sendo até hoje a única pessoa premiada em duas ciências diferentes.',
   'Rosalind Franklin (1920–1958) produziu imagens de difração de raios X, como a famosa “Foto 51”, que foram essenciais para entender a estrutura em dupla hélice do DNA, descrita em 1953. Seu papel só foi amplamente reconhecido décadas depois.'],
  you:{serena:'A curiosidade dessas mulheres também era criativa: imaginar o que ainda não existia.',exploradora:'Elas exploraram fronteiras do conhecimento. Que fronteira você quer explorar?',analitica:'Observação cuidadosa e persistência: a ciência combina com seu jeito.',conectiva:'Pierre e Marie Curie mostram a força de trabalhar em parceria.',contemplativa:'Muitas descobertas vieram de longas horas de observação silenciosa.',determinada:'Persistir diante de portas fechadas foi a marca dessas cientistas.'},
  try:'Pesquise uma cientista brasileira (por exemplo, Bertha Lutz, que também era bióloga) e anote uma coisa que você aprendeu.',
  src:'Nobel Prize Outreach, “Marie Curie – Facts”; Menabrea, L. F. e Lovelace, A. A. (1843), notas sobre a Máquina Analítica; Maddox, B. (2002), Rosalind Franklin: The Dark Lady of DNA.'},
 {id:'a21',title:'A conquista do voto feminino no Brasil',cat:'historia',img:'photo-1467269204594-9661b134dd2b',
  body:['Durante a maior parte da história do Brasil, as mulheres não podiam votar. A mudança foi resultado de décadas de mobilização.',
   'Em 1927, o Rio Grande do Norte aprovou uma lei estadual que permitiu o voto feminino. Celina Guimarães Viana, professora de Mossoró, tornou-se uma das primeiras eleitoras registradas do país e é lembrada como pioneira.',
   'A bióloga Bertha Lutz foi uma das principais líderes do movimento e fundou, em 1922, a Federação Brasileira pelo Progresso Feminino. A pressão dessas mulheres contribuiu para que o Código Eleitoral de 1932 garantisse o voto feminino em todo o país, direito confirmado pela Constituição de 1934.',
   'Em 1933, Carlota Pereira de Queirós foi eleita a primeira deputada federal do Brasil. Conhecer essa história ajuda a lembrar que direitos que hoje parecem naturais foram conquistados por pessoas que se organizaram e persistiram.'],
  you:{serena:'Sua sensibilidade para injustiças é uma força para causas coletivas.',exploradora:'Essas mulheres abriram caminhos novos. Que caminho você quer abrir?',analitica:'Leis e datas mostram como mudanças sociais acontecem passo a passo.',conectiva:'A conquista veio da união de muitas mulheres. Comunidade muda a história.',contemplativa:'Reflita sobre quais direitos você exerce hoje graças a quem veio antes.',determinada:'Décadas de persistência: um exemplo de foco no longo prazo.'},
  try:'Converse com uma mulher mais velha da sua família sobre como era a vida dela na sua idade.',
  src:'Tribunal Superior Eleitoral (TSE), “O voto da mulher”; Decreto nº 21.076/1932 (Código Eleitoral); Câmara dos Deputados, biografia de Carlota Pereira de Queirós.'},
 {id:'a22',title:'Escritoras brasileiras que você precisa conhecer',cat:'historia',img:'photo-1544947950-fa07a98d237f',
  body:['A literatura brasileira tem vozes femininas marcantes, que retratam o país, a vida interior e experiências muitas vezes deixadas de lado.',
   'Rachel de Queiroz publicou O quinze (1930), sobre a seca no Ceará, e em 1977 tornou-se a primeira mulher eleita para a Academia Brasileira de Letras. Cecília Meireles, poeta de versos delicados, escreveu o Romanceiro da Inconfidência (1953).',
   'Clarice Lispector revolucionou a prosa com mergulhos na vida interior das personagens, em obras como A paixão segundo G.H. (1964) e A hora da estrela (1977). Carolina Maria de Jesus registrou o cotidiano da favela do Canindé, em São Paulo, no diário Quarto de despejo (1960), um enorme sucesso de vendas.',
   'Entre as autoras contemporâneas, Conceição Evaristo criou o conceito de “escrevivência”, a escrita que nasce da vivência, e publicou obras como Ponciá Vicêncio (2003). Ler essas mulheres é conhecer o Brasil por outros olhares.'],
  you:{serena:'Clarice e Cecília conversam com sua sensibilidade.',exploradora:'Cada livro é uma viagem por um Brasil diferente.',analitica:'Compare como cada autora retrata a sociedade da sua época.',conectiva:'Monte um clube de leitura com amigas a partir de uma dessas autoras.',contemplativa:'A prosa introspectiva de Clarice combina com você.',determinada:'A trajetória de Carolina Maria de Jesus é uma história de persistência.'},
  try:'Escolha uma dessas autoras e leia um conto ou poema dela esta semana.',
  src:'Academia Brasileira de Letras, biografia de Rachel de Queiroz; Jesus, C. M. (1960), Quarto de despejo; Evaristo, C. (2003), Ponciá Vicêncio.'},
 {id:'a23',title:'Renascimento: quando a arte mudou o olhar',cat:'historia',img:'photo-1524995997946-a1c2e315a42f',
  body:['O Renascimento foi um movimento cultural que começou na Itália, especialmente em Florença, por volta do século XIV e se espalhou pela Europa até o século XVI. Seus artistas e pensadores retomaram ideias da Antiguidade grega e romana e colocaram o ser humano no centro das reflexões.',
   'Na arte, surgiram técnicas como a perspectiva linear, que dá sensação de profundidade. Leonardo da Vinci pintou a Mona Lisa e A última ceia; Michelangelo pintou o teto da Capela Sistina entre 1508 e 1512; Sandro Botticelli criou O nascimento de Vênus.',
   'A prensa de tipos móveis, desenvolvida por Johannes Gutenberg por volta de 1450, ajudou a espalhar livros e ideias com uma velocidade inédita, transformando o acesso ao conhecimento.',
   'Pouco depois, já no período barroco, Artemisia Gentileschi (1593–c. 1656) tornou-se uma das primeiras mulheres aceitas na Academia de Artes do Desenho de Florença, mostrando que talento feminino também marcou essa história.'],
  you:{serena:'Sua sensibilidade estética vai amar observar as obras desse período.',exploradora:'Visitar um museu (mesmo virtual) é uma viagem no tempo.',analitica:'A perspectiva é matemática aplicada à arte. Vale pesquisar como funciona.',conectiva:'Os ateliês eram espaços de aprendizado coletivo.',contemplativa:'Fique alguns minutos observando uma única obra, sem pressa.',determinada:'Michelangelo levou quatro anos no teto da Capela Sistina: disciplina também é arte.'},
  try:'Faça um passeio virtual por um museu (muitos oferecem tours online) e escolha uma obra para observar por cinco minutos.',
  src:'Gombrich, E. H., A história da arte; Encyclopaedia Britannica, verbetes “Renaissance” e “Artemisia Gentileschi”.'},
 {id:'a24',title:'Como funciona o método científico',cat:'sociedade',img:'photo-1434030216411-0b793f4b4173',
  body:['A ciência não é uma lista de verdades prontas: é um método para testar ideias e corrigir erros. Ela começa com uma observação e uma pergunta.',
   'A partir da pergunta, os pesquisadores formulam uma hipótese, ou seja, uma explicação que pode ser testada. Depois planejam experimentos ou observações para verificar se os resultados confirmam ou contradizem essa hipótese.',
   'Antes de serem publicados, os estudos costumam passar pela revisão por pares: outros especialistas avaliam o método e as conclusões. E um resultado ganha força quando é replicado, isto é, quando outros grupos chegam a resultados parecidos.',
   'Um cuidado importante é não confundir correlação com causa. Duas coisas podem acontecer juntas sem que uma provoque a outra. Entender esses passos ajuda a ler notícias sobre saúde e comportamento com mais senso crítico.'],
  you:{serena:'A curiosidade científica também é uma forma de criatividade.',exploradora:'Teste suas ideias na prática, como uma pequena experiência.',analitica:'Esse texto é a sua cara: questione, teste, revise.',conectiva:'Discutir ideias com outras pessoas é parte da ciência.',contemplativa:'Observar com atenção é o primeiro passo de qualquer descoberta.',determinada:'Errar e corrigir faz parte do caminho, na ciência e na vida.'},
  try:'Escolha uma notícia de saúde e procure: quem fez o estudo, com quantas pessoas e se outros estudos chegaram ao mesmo resultado.',
  src:'Popper, K. (1959), A lógica da descoberta científica; National Academies of Sciences (2019), Reproducibility and Replicability in Science.'},
 {id:'a25',title:'Como reconhecer notícias falsas',cat:'sociedade',img:'photo-1495474472287-4d71bcdd2085',
  body:['Notícias falsas e informações fora de contexto circulam rápido, principalmente em aplicativos de mensagem e redes sociais. Alguns cuidados simples ajudam muito.',
   'Primeiro, confira a fonte: o conteúdo vem de um veículo conhecido? Tem autor e data? Muitas vezes uma notícia antiga é compartilhada como se fosse nova, ou uma foto real é usada para outro acontecimento.',
   'Desconfie de títulos alarmantes, que pedem para você compartilhar urgentemente ou que provocam muita raiva ou medo. Busque a mesma informação em outros veículos e em agências de checagem, como Lupa, Aos Fatos e o Projeto Comprova.',
   'Também vale prestar atenção ao viés de confirmação: tendemos a acreditar mais facilmente no que concorda com o que já pensamos. Parar alguns segundos antes de compartilhar é um gesto de cuidado com quem recebe.'],
  you:{serena:'Notícias que mexem com emoções pedem uma pausa antes de reagir.',exploradora:'Sua curiosidade pode virar o hábito de investigar a fonte.',analitica:'Checar fontes é uma habilidade que combina com você.',conectiva:'Ajude amigas e familiares com carinho, sem constranger ninguém.',contemplativa:'Respirar antes de compartilhar é um ótimo filtro.',determinada:'Rapidez é boa, mas precisão vem primeiro.'},
  try:'Antes de compartilhar a próxima notícia, faça três perguntas: quem publicou, quando e onde mais isso aparece?',
  src:'Wardle, C. e Derakhshan, H. (2017), Information Disorder, Conselho da Europa; Kahneman, D. (2011), Rápido e devagar.'},
 {id:'a26',title:'Redes sociais, atenção e bem-estar',cat:'sociedade',img:'photo-1512295767273-ac109ac3acfa',
  body:['As redes sociais fazem parte da vida de quase todo mundo. A pergunta que pesquisadores tentam responder é: elas fazem mal ao bem-estar?',
   'Os estudos mostram um quadro mais complexo do que as manchetes sugerem. Uma análise com dados de mais de 350 mil adolescentes, publicada em 2019 por Amy Orben e Andrew Przybylski, encontrou uma associação negativa, porém pequena, entre uso de tecnologia digital e bem-estar.',
   'O tipo de uso parece importar mais do que o tempo total. Usar as redes para conversar e manter vínculos tende a ser diferente de rolar a tela passivamente, comparando a própria vida com recortes perfeitos da vida dos outros.',
   'Algumas atitudes ajudam: desativar notificações que não são essenciais, deixar o celular longe na hora de dormir, seguir perfis que inspiram de verdade e observar como você se sente depois de usar cada aplicativo.'],
  you:{serena:'Você absorve muito do que vê. Escolha com cuidado quem segue.',exploradora:'Troque parte da rolagem por experiências fora da tela.',analitica:'Observe seus dados: quanto tempo você usa e como se sente depois.',conectiva:'Use as redes para conversas reais, não só para assistir.',contemplativa:'Reserve momentos do dia sem tela para pensar.',determinada:'Proteja seus horários de foco desligando notificações.'},
  try:'Durante um dia, anote como você se sente depois de usar cada rede social. No fim, escolha um ajuste.',
  src:'Orben, A. e Przybylski, A. K. (2019), Nature Human Behaviour, 3, 173–182; Verduyn, P. et al. (2017), Social Issues and Policy Review.'},
 {id:'a27',title:'Empreender: primeiros passos',cat:'sociedade',img:'photo-1522202176988-66273c2fd55f',
  body:['Empreender é transformar uma ideia em algo que resolve um problema real de alguém. Pode ser um negócio, um projeto social ou uma renda extra.',
   'Um bom começo é entender o problema e o público. Converse com possíveis clientes antes de investir muito: o que elas precisam, como resolvem isso hoje e quanto pagariam por uma solução melhor.',
   'Depois, teste a ideia em pequena escala, com o mínimo de custo possível. Esse teste ajuda a aprender rápido e a ajustar o produto ou serviço antes de crescer. Organizar as finanças desde o início, separando o dinheiro pessoal do dinheiro do negócio, evita muitos problemas.',
   'No Brasil, o Sebrae oferece cursos e orientações gratuitas para quem está começando, e o regime de Microempreendedor Individual (MEI) é uma forma simples de formalizar pequenos negócios dentro do limite de faturamento definido por lei.'],
  you:{serena:'Sua criatividade pode virar um produto com a sua identidade.',exploradora:'Comece com um teste pequeno e aprenda no caminho.',analitica:'Pesquise, planeje e acompanhe números desde o começo.',conectiva:'Seu talento com pessoas é ótimo para entender clientes.',contemplativa:'Pense no propósito do seu projeto antes do formato.',determinada:'Defina uma meta simples para o primeiro mês e acompanhe.'},
  try:'Escreva em uma frase: que problema eu gostaria de resolver e para quem?',
  src:'Ries, E. (2011), A startup enxuta; Sebrae, conteúdos para empreendedores; Portal do Empreendedor (gov.br), informações sobre o MEI.'}
);

 chars:[{n:'Pedro',ref:'Mateus 14:28-31; João 21:15-17',story:'Pedro pediu para andar sobre as águas, deu os primeiros passos e afundou quando olhou para o vento. Depois prometeu nunca negar Jesus e negou três vezes. Mesmo assim, Jesus o restaurou perguntando três vezes: "Você me ama?".',lesson:'Mostra traços sanguíneos: coragem e impulso. A lição é que Jesus não desiste de corações impulsivos: ele os transforma em rocha.'},
  {n:'A mulher samaritana',ref:'João 4:28-30, 39',story:'Depois de conversar com Jesus no poço, ela deixou o cântaro e correu para a cidade dizendo: "Venham ver um homem que me disse tudo o que tenho feito". Muitos creram por causa do seu testemunho.',lesson:'Lembra o temperamento sanguíneo: comunicação espontânea. A lição é que a sua história, entregue a Jesus, vira testemunho.'},

{id:'colerica',key:'C',name:'Colérica',traits:'Coléricos',title:'Coragem que Lidera',color:'#C47A5F',

 desc:['Quando todos ainda estão pensando, você já está agindo. Você enxerga o objetivo, organiza as pessoas e não desiste diante do primeiro obstáculo. No meio cristão, esse jeito costuma ser chamado de temperamento colérico.',
  'Sua coragem é um presente para a igreja, para a família e para o trabalho. Muitos ministérios existem porque alguém como você teve iniciativa. Mas a mesma força que move montanhas pode atropelar pessoas, e a pressa pode deixar pouco espaço para ouvir, descansar e esperar em Deus.',
  'Seu desafio é unir firmeza e mansidão. Liderar como Jesus é servir, não controlar. E descansar não é perder tempo: é confiar que o resultado está nas mãos de Deus.',

 prayers:['Senhor, que a minha força sirva às pessoas e não as atropele.','Pai, me ensina a descansar confiando em ti.','Jesus, me dá paciência com quem caminha em outro ritmo.','Espírito Santo, guarda a minha boca de palavras duras.','Senhor, que os meus planos se alinhem aos teus.','Pai, me ajuda a pedir ajuda sem orgulho.','Jesus, que eu lidere servindo, como tu.'],
 phrases:['Força com mansidão é força de Cristo.','Descansar também é obediência.','Pessoas valem mais do que metas.','Peça ajuda hoje: isso é sabedoria.','Seus planos ficam melhores nas mãos de Deus.','Uma palavra gentil abre portas que a pressa fecha.','Você não precisa provar nada a ninguém.'],
 chars:[{n:'Paulo',ref:'Atos 9; Filipenses 3:13-14; 2 Timóteo 4:11',story:'Paulo perseguia os cristãos com zelo até encontrar Jesus no caminho para Damasco. Depois viajou, plantou igrejas e escreveu cartas. Chegou a se separar de Barnabé por causa de Marcos e, anos depois, pediu: "Traga Marcos, porque ele me é útil".',lesson:'Mostra traços coléricos: zelo, foco e firmeza. A lição é que Deus redireciona a determinação e ensina a liderar com graça e reconciliação.'},
  {n:'Débora',ref:'Juízes 4-5',story:'Débora era profetisa e julgava Israel debaixo de uma palmeira. Chamou Baraque para a batalha e, quando ele hesitou, respondeu: "Irei com você". Depois da vitória, cantou louvores a Deus.',lesson:'Lembra o temperamento colérico: coragem e liderança. A lição é que a liderança dela era cheia de fé e dava os créditos a Deus.'},
  {n:'Marta',ref:'Lucas 10:38-42; João 11:20-27',story:'Marta recebeu Jesus em casa e se agitou com tantas tarefas que reclamou da irmã. Jesus respondeu com carinho que só uma coisa era necessária. Mais tarde, foi ela quem correu ao encontro de Jesus e declarou: "Eu tenho crido que tu és o Cristo, o Filho de Deus".',lesson:'Mostra traços coléricos: praticidade e iniciativa. A lição é que servir é lindo, mas estar com Jesus vem primeiro.'}],
 themes:[{t:'Descanso que é fé',d:'Separe um período desta semana sem produtividade, só para estar com Deus.',txt:'d5'},{t:'Força com mansidão',d:'Responda a uma situação difícil com calma, antes de agir.',txt:'d7'},{t:'Soltar o controle',d:'Entregue a Deus, em oração, algo que você não controla.',txt:'d11'},{t:'Liderar servindo',d:'Ajude alguém num projeto que não é seu.',txt:'d14'}],
 why:'Combina com seu jeito colérico:',

{id:'melancolica',key:'M',name:'Melancólica',traits:'Melancólicos',title:'Profundidade que Adora',color:'#8FA5B8',
 palette:['#A8B8A0','#8FA5B8','#EAE2D9','#3A2E28'],
 short:'Sensível, profunda e detalhista: você sente e pensa com o coração inteiro.',
 desc:['Você percebe o que quase ninguém vê: um olhar triste, uma palavra fora do lugar, a beleza escondida numa letra de louvor. Você ama com profundidade, é fiel aos seus valores e faz tudo com capricho. No meio cristão, esse jeito costuma ser chamado de temperamento melancólico.',
  'Sua sensibilidade torna você uma intercessora natural, uma amiga leal e, muitas vezes, uma artista. Você precisa de tempo e silêncio para processar a vida. O outro lado é que essa mesma profundidade pode virar autocrítica, perfeccionismo e tristeza guardada.',
  'Seu desafio é receber a graça. Deus não espera perfeição de você: ele já a ama inteira. A alegria e a paz do Espírito Santo podem iluminar os lugares onde a sua mente costuma ver só o que falta.',
  'Moisés, que se achava incapaz de falar, e Ana, que derramou a alma em oração, mostram que Deus usa corações sensíveis de maneiras poderosas.'],
 forces:['Sensibilidade e empatia profundas','Fidelidade e lealdade','Organização e capricho','Criatividade e senso de beleza'],
 challenges:['Perfeccionismo e autocrítica','Tristeza e pessimismo nos dias difíceis','Guardar mágoas por muito tempo'],
 fruit:{n:'Alegria e paz',t:'O Espírito Santo não tira a sua profundidade: ele a enche de luz. A alegria lembra que a sua história não termina na tristeza. A paz acalma a mente que pensa demais e ensina você a descansar na graça, e não na perfeição.'},
 verses:[{r:'Salmos 139:14',t:'Eu te louvo porque me fizeste de modo especial e admirável.'},{r:'2 Coríntios 12:9',t:'Minha graça é suficiente a você, pois o meu poder se aperfeiçoa na fraqueza.'},{r:'Salmos 34:18',t:'O Senhor está perto dos que têm o coração quebrantado e salva os de espírito abatido.'},{r:'Filipenses 4:6-7',t:'Não andem ansiosos por coisa alguma, mas em tudo, pela oração e súplicas, e com ação de graças, apresentem seus pedidos a Deus.'},{r:'Romanos 8:1',t:'Agora já não há condenação para os que estão em Cristo Jesus.'},{r:'João 14:27',t:'Deixo-lhes a paz; a minha paz lhes dou.'},{r:'Romanos 15:13',t:'Que o Deus da esperança os encha de toda alegria e paz, por sua confiança nele.'}],
 prayers:['Senhor, que a tua graça seja maior do que a minha autocrítica.','Pai, acalma a minha mente e me dá a tua paz.','Jesus, me ajuda a soltar as mágoas que eu guardo.','Espírito Santo, enche de alegria os meus pensamentos hoje.','Senhor, usa a minha sensibilidade para cuidar de alguém.','Pai, eu não preciso ser perfeita para ser amada por ti.','Jesus, obrigada por me fazer de modo especial e admirável.'],
 phrases:['Você não precisa ser perfeita para ser amada.','Sua sensibilidade é um dom, não um defeito.','A graça de Deus cobre o que falta em você.','Hoje, repare em três coisas boas.','Feito com amor vale mais do que perfeito.','Deus escuta até as orações sem palavras.','Sua profundidade é lugar de encontro com Deus.'],
 chars:[{n:'Moisés',ref:'Êxodo 3-4; Números 12:3',story:'Diante da sarça ardente, Moisés perguntou: "Quem sou eu?" e disse que nunca teve facilidade para falar. Deus prometeu estar com ele. Mais tarde, a Bíblia o descreve como um homem muito manso e humilde.',lesson:'Mostra traços melancólicos: insegurança e profundidade. A lição é que Deus usa quem se sente incapaz, porque a força vem dele.'},
  {n:'Ana',ref:'1 Samuel 1:10-18',story:'Ana sofria por não ter filhos e era provocada. No templo, orou em silêncio, só mexendo os lábios, a ponto de o sacerdote achar que estava embriagada. Ela explicou que estava derramando a alma diante do Senhor. Depois daquela oração, seu rosto já não estava triste.',lesson:'Lembra o temperamento melancólico: dor profunda e oração intensa. A lição é que entregar a dor a Deus traz paz antes mesmo da resposta.'},
  {n:'Ester',ref:'Ester 4:14-16',story:'Diante de uma ameaça ao seu povo, Ester não agiu por impulso: pediu três dias de jejum, planejou com sabedoria e só então foi até o rei, dizendo: "Se eu tiver que morrer, morrerei".',lesson:'Mostra traços melancólicos: cautela e planejamento. A lição é que a prudência, somada à fé, vira coragem.'},
  {n:'Elias',ref:'1 Reis 19:4-8',story:'Depois de uma grande vitória, Elias ficou exausto e desanimado a ponto de pedir para morrer. Deus não o repreendeu: deixou-o dormir, mandou comida e disse: "Levante-se e coma, pois a sua viagem será muito longa".',lesson:'Lembra o temperamento melancólico: altos e baixos emocionais. A lição é que Deus cuida do corpo e da alma cansada com ternura.'}],
 themes:[{t:'Graça, não perfeição',d:'Faça algo bem feito, mas não perfeito, e entregue.',txt:'d3'},{t:'Ansiedade entregue a Deus',d:'Escreva suas preocupações e ore por cada uma.',txt:'d2'},{t:'Soltar mágoas',d:'Ore por alguém que te feriu, mesmo que com poucas palavras.',txt:'d8'},{t:'Gratidão que ilumina',d:'Anote três motivos de gratidão todas as noites.',txt:'d16'}],
 why:'Combina com seu jeito melancólico:',
 check:{orei:'Escrever uma oração no meu diário',li:'Ler um salmo devagar e meditar',servi:'Orar por alguém que está sofrendo',agradeci:'Anotar 3 coisas bonitas de hoje'}},
{id:'fleumatica',key:'F',name:'Fleumática',traits:'Fleumáticos',title:'Paz que Sustenta',color:'#A8B8A0',
 palette:['#A8B8A0','#C9D5C3','#F7F3EE','#3A2E28'],
 short:'Calma, leal e pacificadora: você é porto seguro para quem está por perto.',
 desc:['Você é aquela presença tranquila que acalma o ambiente. Ouve sem julgar, evita brigas, cumpre o que promete e está sempre lá. As pessoas confiam em você porque você é constante. No meio cristão, esse jeito costuma ser chamado de temperamento fleumático.',
  'Sua paz é um presente raro num mundo apressado. Você serve sem precisar de holofote e mantém a unidade nos grupos. Mas, para evitar conflitos, pode guardar o que sente, adiar decisões e deixar de usar os dons que Deus colocou em você.',
  'Seu desafio é sair da zona de conforto com fé. Deus quer usar a sua calma, mas também a sua voz e a sua iniciativa. A fidelidade que você já tem pode florescer em bondade ativa.',
  'Abraão, que saiu sem saber para onde ia, e Rute, que permaneceu fiel quando tudo era incerto, mostram que corações constantes podem dar grandes passos de fé.'],
 forces:['Calma que acalma','Lealdade e constância','Escuta paciente','Dom de pacificar'],
 challenges:['Passividade e medo de mudanças','Procrastinação nas decisões','Dificuldade de dizer o que sente'],
 fruit:{n:'Fidelidade com iniciativa e bondade ativa',t:'O Espírito Santo transforma a sua constância em fidelidade que age. Bondade não é só não fazer mal: é ir até o outro. Deus dá coragem para você falar, decidir e dar o próximo passo, sem perder a paz que é a sua marca.'},
 verses:[{r:'Isaías 41:10',t:'Por isso não tema, pois estou com você; não tenha medo, pois sou o seu Deus.'},{r:'Josué 1:9',t:'Seja forte e corajoso! Não se apavore nem desanime, pois o Senhor, o seu Deus, estará com você por onde você andar.'},{r:'2 Timóteo 1:7',t:'Pois Deus não nos deu espírito de covardia, mas de poder, de amor e de equilíbrio.'},{r:'Mateus 5:9',t:'Bem-aventurados os pacificadores, pois serão chamados filhos de Deus.'},{r:'Salmos 37:7',t:'Descanse no Senhor e aguarde por ele com paciência.'},{r:'Tiago 2:17',t:'A fé, por si só, se não for acompanhada de obras, está morta.'},{r:'Isaías 40:31',t:'Aqueles que esperam no Senhor renovam as suas forças.'}],
 prayers:['Senhor, me dá coragem para dar o próximo passo hoje.','Pai, me ajuda a falar o que sinto com amor.','Jesus, que a minha paz seja ativa e generosa.','Espírito Santo, me tira da zona de conforto com fé.','Senhor, obrigada pela calma que vem de ti.','Pai, me ensina a decidir sem medo de errar.','Jesus, usa a minha constância para abençoar alguém.'],
 phrases:['Sua paz é um presente para quem está perto.','Um pequeno passo de fé hoje já é muito.','Sua voz também importa.','Fidelidade é bonita quando vira ação.','Decida uma coisa pendente hoje.','Deus está com você no próximo passo.','Pacificar é diferente de se calar.'],
 chars:[{n:'Abraão',ref:'Gênesis 12:1-4; 13:8-9; Hebreus 11:8',story:'Abraão saiu da sua terra sem saber para onde ia, apenas confiando em Deus. Em um conflito com o sobrinho Ló, deixou que ele escolhesse a terra primeiro, para manter a paz. Também teve momentos de medo, mas aprendeu a confiar.',lesson:'Mostra traços fleumáticos: paciência e espírito pacificador. A lição é que a fé tranquila também sabe dar passos ousados.'},
  {n:'Rute',ref:'Rute 1:16-17; 2:2-3',story:'Depois de perder o marido, Rute decidiu ficar com a sogra Noemi: "Aonde você for, irei; o seu povo será o meu povo e o seu Deus será o meu Deus". Trabalhou com humildade nos campos e foi reconhecida como mulher de valor.',lesson:'Lembra o temperamento fleumático: lealdade e constância. A lição é que a fidelidade silenciosa é vista e honrada por Deus.'},
  {n:'Maria de Betânia',ref:'Lucas 10:39; João 12:3',story:'Enquanto a irmã se agitava, Maria sentou-se aos pés de Jesus para ouvi-lo. Mais tarde, derramou um perfume caro sobre ele, num gesto de adoração.',lesson:'Mostra traços fleumáticos: calma e presença. A lição é que estar aos pés de Jesus é a "boa parte" que ninguém tira de você.'},
  {n:'Abigail',ref:'1 Samuel 25',story:'Quando o marido insensato ofendeu Davi, Abigail agiu rápido: levou provisões, falou com sabedoria e evitou uma tragédia. Davi louvou a Deus e reconheceu o bom senso dela.',lesson:'Lembra o temperamento fleumático no melhor sentido: uma pacificadora com iniciativa. A lição é que buscar a paz às vezes exige agir.'}],
 themes:[{t:'Um passo de fé',d:'Escolha uma decisão que você vem adiando e dê o primeiro passo.',txt:'d12'},{t:'Sua voz importa',d:'Diga com carinho algo que você sente e costuma guardar.',txt:'d6'},{t:'Bondade ativa',d:'Faça um gesto concreto de cuidado por alguém.',txt:'d10'},{t:'Coragem para servir',d:'Ofereça um dom seu na igreja ou em casa.',txt:'d10'}],
 why:'Combina com seu jeito fleumático:',
