function clearErr(f){f.querySelectorAll('.err').forEach(e=>e.textContent='');f.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'))}
function setErr(f,name,msg){const e=f.querySelector(`[data-err="${name}"]`);if(e)e.textContent=msg;const i=f.querySelector(`[name="${name}"]`);if(i)i.classList.add('bad')}
function nope(f){sfx('soft');const b=f.querySelector('.bad');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');b.focus()}}
const emailOk=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function birthErr(b){if(!b)return 'Escolha sua data de nascimento.';const d=parseYmd(b);if(isNaN(d)||b>today())return 'Essa data ainda não chegou!';if(d.getFullYear()<1900)return 'Confere o ano para mim?';return ''}
const FORMS={
 async cadastro(f){
  clearErr(f);const name=f.name.value.trim(),email=f.email.value.trim().toLowerCase(),pass=f.pass.value,birth=f.birth.value;
  if(name.length<2)setErr(f,'name','Conta pra gente o seu nome.');
  if(!emailOk(email))setErr(f,'email','Esse e-mail parece incompleto.');else if(DB.users[email])setErr(f,'email','Esse e-mail já tem conta. Que tal entrar?');
  if(pass.length<6)setErr(f,'pass','Use pelo menos 6 caracteres.');
  const be=birthErr(birth);if(be)setErr(f,'birth',be);
  if(f.querySelector('.bad'))return nope(f);
  if(ui.authBusy)return;
  ui.authBusy=true;await ui.cloudReady;
  if(CLOUD.on){
   const r=await cloud('register',{name,email,pass,birth,data:dataOf(blankUser())});ui.authBusy=false;
   if(!r.ok){if(r.data.error==='exists')setErr(f,'email',r.data.message);else setErr(f,'form',r.status===0?'Sem conexão com a internet. Confira e tente de novo.':(r.data.message||'Não consegui criar sua conta agora. Tente de novo.'));return nope(f)}
   setToken(r.data.token);const cu=applyCloud(r.data);DB.session=email;saveLocal();
   sfx('ok');toast(`Conta criada! Que bom ter você aqui, ${esc(first(name))}.`);go(stepFor(cu));return;
  }
  ui.authBusy=false;
  const u=blankUser();u.name=name;u.email=email;u.birth=birth;u.pass=await hashPass(pass);
  DB.users[email]=u;DB.session=email;
  const stored=save();
  sfx('ok');toast(stored?`Conta criada! Que bom ter você aqui, ${esc(first(name))}.`:'Conta criada! Este navegador não está guardando dados, então seu progresso vale só até fechar a página.');go(stepFor(u));
  syncAccess(u).then(ok=>{if(ok){toast('Encontramos seu pagamento! Acesso liberado.');go(stepFor(u))}});
 },
 async login(f){
  clearErr(f);const email=f.email.value.trim().toLowerCase(),pass=f.pass.value;
  if(!email||!pass){setErr(f,'form','Preencha e-mail e senha.');if(!email)setErr(f,'email','');if(!pass)setErr(f,'pass','');return nope(f)}
  if(ui.authBusy)return;
  ui.authBusy=true;await ui.cloudReady;
  if(CLOUD.on){
   let r=await cloud('login',{email,pass});
   const local=DB.users[email];
   if(r.status===404&&local&&local.pass&&await checkPass(pass,local.pass)){
    r=await cloud('register',{name:local.name,email,pass,birth:local.birth,data:dataOf(local)});
    if(r.ok&&local.paid)setTimeout(()=>toast('Se você já tinha liberado o acesso, digite seu código de novo para confirmar.'),1500);
   }
   ui.authBusy=false;
   if(!r.ok){setErr(f,'form',r.status===0?'Sem conexão com a internet. Confira e tente de novo.':(r.data.message||'E-mail ou senha incorretos.'));setErr(f,'pass','');return nope(f)}
   setToken(r.data.token);const cu=applyCloud(r.data,local);DB.session=email;saveLocal();
   sfx('ok');toast(`Oi de novo, ${esc(first(cu.name))}!`);go(stepFor(cu));return;
  }
  ui.authBusy=false;
  const u=DB.users[email];
  if(!u||!(await checkPass(pass,u.pass))){setErr(f,'form','E-mail ou senha incorretos.');setErr(f,'pass','');return nope(f)}
  DB.session=email;save();sfx('ok');toast(`Oi de novo, ${esc(first(u.name))}!`);go(stepFor(u));
  syncAccess(u).then(ok=>{if(ok)go(stepFor(u))});
 },
 card(f){
  clearErr(f);const num=f.cnum.value.replace(/\D/g,''),exp=f.cexp.value,cvv=f.ccvv.value.replace(/\D/g,''),nm=f.cname.value.trim();
  if(num.length<13||num.length>19)setErr(f,'cnum','Confere o número do cartão?');
  const m=/^(\d{2})\/(\d{2})$/.exec(exp);
  if(!m||+m[1]<1||+m[1]>12)setErr(f,'cexp','Use o formato MM/AA.');
  else{const end=new Date(2000+ +m[2],+m[1],0,23,59);if(end<new Date())setErr(f,'cexp','Esse cartão já venceu.')}
  if(cvv.length<3||cvv.length>4)setErr(f,'ccvv','3 ou 4 dígitos.');
  if(nm.length<3)setErr(f,'cname','Digite o nome como está no cartão.');
  if(f.querySelector('.bad'))return nope(f);
  f.reset();if(PAY.mode==='demo')processPayment('cartao');
 },
 async code(f){
  clearErr(f);const u=U();if(!u)return;
  if(ui.codeLock&&Date.now()<ui.codeLock){setErr(f,'code','Muitas tentativas. Aguarde alguns segundos e tente de novo.');return nope(f)}
  const c=normCode(f.code.value);
  if(c.length!==15||!c.startsWith('ORV')){setErr(f,'code','O código tem o formato ORV-XXXX-XXXX-XXXX.');return nope(f)}
  await ui.cloudReady;
  if(CLOUD.on){
   if(ui.codeBusy)return;ui.codeBusy=true;
   const r=await cloud('redeem',{code:c});ui.codeBusy=false;
   if(r.status===401){sessionExpired();return}
   if(!r.ok||!r.data.profile||!r.data.profile.paid){setErr(f,'code',r.status===0?'Sem conexão com a internet. Confira e tente de novo.':(r.data.message||'Não consegui verificar o código agora.'));return nope(f)}
   unlockPaid(u,'codigo');return;
  }
  let h='';try{h=await codeHash(c)}catch(e){setErr(f,'code','Este navegador não conseguiu verificar o código. Tente pelo Chrome ou Safari atualizados.');return}
  if(!CODE_HASHES.has(h)&&h!==HOTMART_HASH_LOCAL){ui.codeFails=(ui.codeFails||0)+1;if(ui.codeFails>=5){ui.codeLock=Date.now()+30000;ui.codeFails=0}setErr(f,'code','Código não encontrado. Confira se digitou igual ao que recebeu.');return nope(f)}
  u.accessCode=h===HOTMART_HASH_LOCAL?'hotmart':h.slice(0,10);unlockPaid(u,'codigo');
 },
 act(f){
  clearErr(f);const t=f.t.value.trim();if(!t){setErr(f,'t','Escreva a atividade.');return nope(f)}
  const u=U();
  if(ui.actId){const it=u.checklist.items.find(i=>i.id===ui.actId);if(it){it.t=t;it.g=ui.actG}toast('Atividade atualizada!')}
  else{u.checklist.items.push({id:uid(),g:ui.actG,t,done:false,note:''});toast('Atividade criada!')}
  save();sfx('ok');closeModal();render();
 },
 goal(f){
  clearErr(f);const t=f.t.value.trim();if(!t){setErr(f,'t','Escreva sua meta ou hábito.');return nope(f)}
  const u=U();u.goals.unshift({id:uid(),t,type:ui.goalType,done:false,xp:false,created:today()});ui.goalDraft='';
  save();sfx('ok');refreshModal();render();toast(`${ui.goalType} adicionad${ui.goalType==='Meta'?'a':'o'}!`);
 },
 goalEdit(f){
  const t=f.t.value.trim();if(!t){f.t.classList.add('bad');return nope(f)}
  const u=U();const g=u.goals.find(x=>x.id===f.dataset.id);if(g){g.t=t;g.type=ui.goalEditType||g.type}
  ui.editGoal=null;save();refreshModal();render();toast('Salvo!');
 },
 async perfil(f){
  clearErr(f);const u=U();const name=f.name.value.trim(),birth=f.birth.value,cur=f.cur.value,nw=f.nw.value;
  if(name.length<2)setErr(f,'name','Conta pra gente o seu nome.');
  const be=birthErr(birth);if(be)setErr(f,'birth',be);
  if(nw||cur){
   if(nw.length<6)setErr(f,'nw','Use pelo menos 6 caracteres.');
   else if(CLOUD.on){const r=await cloud('password',{cur,nw});if(!r.ok)setErr(f,'cur',r.data.message||'Não consegui trocar a senha agora.')}
   else if(!cur||!(await checkPass(cur,u.pass)))setErr(f,'cur','Senha atual incorreta.')}
  if(f.querySelector('.bad'))return nope(f);
  u.name=name;u.birth=birth;if(nw&&!CLOUD.on)u.pass=await hashPass(nw);
  save();sfx('ok');closeModal();render();toast('Perfil atualizado!');
 }
};
function mask(el){
 const d=el.value.replace(/\D/g,'');
 if(el.dataset.mask==='card')el.value=d.slice(0,19).replace(/(\d{4})(?=\d)/g,'$1 ');
 if(el.dataset.mask==='exp')el.value=d.length>2?d.slice(0,2)+'/'+d.slice(2,4):d;
 if(el.dataset.mask==='cvv')el.value=d.slice(0,4);
 if(el.dataset.mask==='code'){const a=normCode(el.value).slice(0,15);el.value=[a.slice(0,3),a.slice(3,7),a.slice(7,11),a.slice(11,15)].filter(Boolean).join('-')}
}

 setTimeout(()=>{
  const u=U();if(!u){closeModal();go('boas-vindas');return}
  unlockPaid(u,method);
 },1500);
}
async function copyText(txt){
 try{await navigator.clipboard.writeText(txt);return true}catch(e){
  try{const ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e2){return false}}
}

  const entry={date:today(),done:done.length,total:items.length,items:done.map(i=>i.t)};
  const idx=u.history.findIndex(h=>h.date===entry.date);const firstTime=idx<0;
  if(firstTime)u.history.unshift(entry);else u.history[idx]=entry;
  if(firstTime){addXP(20);markActive()}checkAch();save();render();
  celebrate({title:firstTime?'Dia concluído!':'Dia atualizado!',sub:firstTime?'Você viveu o seu dia do seu jeito. Isso merece festa!':'Seu histórico de hoje foi atualizado.',
   stats:[{k:'XP',v:firstTime?20:0,ic:'star',c:'sc-mel'},{k:'Checks',v:done.length,ic:'check',c:'sc-sage'},{k:'Sequência',v:streakOf(u),ic:'flame',c:'sc-terra'}]})},
 closeCelebrate:()=>{closeModal();if(ui.milestone)setTimeout(showMilestone,150)},
 openChest:()=>{const u=U();if(u.chest[today()])return;if(!missions(u).every(m=>m.cur>=m.max))return;u.chest[today()]=true;addXP(20);checkAch();save();render();
  celebrate({title:'Baú aberto!',sub:'Missões do dia completas. Você é incrível!',icon:ic('chest',110),stats:[{k:'XP',v:20,ic:'star',c:'sc-mel'}]})},
 delPhoto:el=>{const u=U();const i=+el.dataset.i;u.board.photos.splice(i,1);save();render()},
 saveBoard:()=>{const u=U();const b=u.board;if(!b.photos.length)return;
  const entry={id:uid(),title:b.title.trim()||'meu universo',date:today(),photos:[...b.photos],stickers:[...b.stickers],seed:b.seed};
  u.boards.unshift(entry);u.board={title:'',photos:[],stickers:[...b.stickers],seed:newSeed()};
  if(!save()){u.boards.shift();u.board=b;LS.set(K_USERS,DB.users);return}
  addXP(15);markActive();checkAch();save();render();sfx('win');confetti(50);
  openModal(()=>`<div class="text-center">${mascot('celebrate',110,'hop')}<h2 class="h1 mt-2">Board salvo!</h2><p class="muted mt-2">Seu universo da semana está guardado em “Meus boards anteriores”. Quer enviar a colagem para alguém?</p></div>
  <div class="flex flex-col gap-3 mt-6"><button class="btn btn-primary" data-act="shareBoard" data-id="${entry.id}">${ic('share',20)} Enviar agora</button><button class="btn btn-ghost" data-act="closeCelebrate">Agora não</button></div>`,{center:true})},
 shuffleBoard:()=>{const u=U();u.board.seed=newSeed();save();sfx('tap');const c=$('#bprev');if(c)drawBoard(c,u.board)},
 toggleSticker:el=>{const u=U();const id=el.dataset.v;const st=u.board.stickers;u.board.stickers=st.includes(id)?st.filter(x=>x!==id):[...st,id];save();sfx('tap');render()},
 shareBoard:el=>shareBoard(el.dataset.id),
 viewBoard:el=>boardModal(el.dataset.id),
 delBoard:el=>{const id=el.dataset.id;confirmBox({title:'Excluir board?',text:'Essa ação não pode ser desfeita.',ok:'Excluir',danger:true,onOk:()=>{const u=U();u.boards=u.boards.filter(b=>b.id!==id);save();render();toast('Board excluído.')}})},
 learn:el=>{ui.learn=el.dataset.v;sfx('tap');render()},
 textPop:el=>textModal(el.dataset.id),
 openText:el=>{closeModal();ui.reading=el.dataset.id;render();window.scrollTo(0,0)},
 closeRead:()=>{ui.reading=null;render();window.scrollTo(0,0)},
 markRead:el=>{const u=U();const id=el.dataset.id;
  if(u.read.includes(id)){u.read=u.read.filter(x=>x!==id);delete u.readLog[id];save();render();toast('Marcado como não lido.');return}
  u.read.push(id);u.readLog[id]=today();
  if(!u.readXP.includes(id)){u.readXP.push(id);addXP(15)}
  markActive();checkAch();save();render();sfx('ok');
  const vis=visibleTexts(u);
  if(vis.every(t=>u.read.includes(t.id)))celebrate({title:'Trilha concluída!',sub:'Você leu todos os textos da sua trilha. Que mente iluminada!',stats:[{k:'Lidos',v:vis.length,ic:'book',c:'sc-sage'},{k:'XP total',v:u.xp,ic:'star',c:'sc-mel'}]});
  else{toast(`${ic('tick',18)} Leitura concluída!`);if(ui.milestone)setTimeout(showMilestone,600)}},
 metas:()=>{ui.editGoal=null;ui.goalDraft='';metasModal()},
 goalType:el=>{const i=$('#goalT');if(i)ui.goalDraft=i.value;ui.goalType=el.dataset.v;refreshModal()},
 goalEditType:el=>{const i=LAYER().querySelector('form[data-form="goalEdit"] input');const u=U();const g=u.goals.find(x=>x.id===ui.editGoal);if(g&&i)ui.goalEditDraft=i.value;ui.goalEditType=el.dataset.v;refreshModal();const i2=LAYER().querySelector('form[data-form="goalEdit"] input');if(i2&&ui.goalEditDraft!=null)i2.value=ui.goalEditDraft},
 toggleGoal:el=>{const u=U();const g=u.goals.find(x=>x.id===el.dataset.id);if(!g)return;g.done=!g.done;
  if(g.done){sfx('ok');if(!g.xp){g.xp=true;addXP(10)}markActive();checkAch();toast(`${ic('target',18)} ${g.type} cumprid${g.type==='Meta'?'a':'o'}!`)}else sfx('tap');
  save();refreshModal();render()},
 editGoal:el=>{const u=U();const g=u.goals.find(x=>x.id===el.dataset.id);if(!g)return;ui.editGoal=g.id;ui.goalEditType=g.type;ui.goalEditDraft=null;refreshModal()},
 cancelEditGoal:()=>{ui.editGoal=null;refreshModal()},
 delGoal:el=>{const u=U();const g=u.goals.find(x=>x.id===el.dataset.id);if(!g)return;
  confirmBox({title:'Excluir meta?',text:`“${esc(g.t)}” vai sair da sua lista.`,ok:'Excluir',danger:true,onOk:()=>{u.goals=u.goals.filter(x=>x.id!==g.id);save();render();metasModal();toast('Excluída.')}})},
 editPrefs:()=>{closeModal();ui.prefs=null;go('personalizacao')},
 seeResult:()=>go('resultado'),
 retake:()=>confirmBox({title:'Refazer o teste?',text:'Suas respostas e seu perfil atual serão substituídos. Pagamento, checklist, boards, metas e favoritos continuam salvos.',ok:'Refazer teste',cancel:'Agora não',mood:'think',onOk:()=>{const u=U();u.answers=Array(10).fill(null);u.testDone=false;u.profile=null;u.scores={};u.prefsDone=false;u.resultSeen=false;ui.q=0;save();go('teste')}}),
 editProfile:()=>profileModal(),
 toggleSound:()=>{const u=U();u.sound=!u.sound;save();render();if(u.sound)sfx('ok');toast(u.sound?'Sons e vibração ligados.':'Sons e vibração desligados.')},
 achInfo:el=>{const u=U();const a=ACH.find(x=>x.id===el.dataset.id);if(!a)return;const on=u.ach.includes(a.id);
  openModal(()=>`<div class="text-center"><div class="flex justify-center"><span class="badge-ic" style="width:96px;height:96px${on?'':';filter:grayscale(1);opacity:.5'}">${ic(on?a.ic:'lock',52,on?'':'c-gray')}</span></div><h2 class="h1 mt-4">${a.n}</h2><p class="muted mt-2">${on?'Desbloqueada! ':'Para desbloquear: '}${a.d}</p></div><button class="btn btn-primary mt-6" data-act="closeModal">Entendi</button>`,{center:true})},
 shareStreak:async el=>{const n=el.dataset.n;const txt=`Estou há ${n} dias seguidos cuidando de mim no Orivie - Sua Personalidade!`;
  try{if(navigator.share){await navigator.share({title:'Orivie - Sua Personalidade',text:txt});return}}catch(e){if(e&&e.name==='AbortError')return}
  const ok=await copyText(txt);toast(ok?'Texto copiado para compartilhar!':'Não consegui compartilhar agora.')}
};

/* =========================================================
   EVENTOS GLOBAIS
   ========================================================= */
document.addEventListener('click',e=>{
 if(e.target.matches&&e.target.matches('[data-backdrop]')){if(ui.modal&&!ui.modal.lock)closeModal();return}
 const el=e.target.closest('[data-act]');
 if(!el||el.disabled)return;
 const fn=ACT[el.dataset.act];
 if(fn){try{fn(el,e)}catch(err){console.error(err);toast('Opa! Tenta de novo?')}}
});
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset&&f.dataset.form;if(!k||!FORMS[k])return;e.preventDefault();try{const r=FORMS[k](f);if(r&&r.catch)r.catch(err=>{console.error(err);toast('Opa! Tenta de novo?')})}catch(err){console.error(err)}});
document.addEventListener('input',e=>{
 const el=e.target;if(el.dataset.mask)mask(el);
 if(el.classList.contains('bad')){el.classList.remove('bad');const er=el.parentElement&&el.parentElement.querySelector('.err');if(er)er.textContent=''}
 const k=el.dataset.in;if(!k)return;const u=U();if(!u)return;
 if(k==='note'){const it=u.checklist&&u.checklist.items.find(i=>i.id===el.dataset.id);if(it){it.note=el.value.slice(0,200);save()}}
 if(k==='btitle'){u.board.title=el.value.slice(0,40);save();clearTimeout(ui.bt);ui.bt=setTimeout(()=>{const c=$('#bprev');if(c)drawBoard(c,u.board)},180)}
});
document.addEventListener('change',async e=>{
 const el=e.target;const kind=el.dataset&&el.dataset.file;if(!kind)return;
 const u=U();if(!u)return;const files=[...(el.files||[])];el.value='';if(!files.length)return;
 if(kind==='board'){
  const before=u.board.photos.length;const room=BOARD_MAX-before;
  if(files.length>room)toast(`Cabem mais ${room} foto${room===1?'':'s'} neste board.`);
  let fails=0;
  for(const f of files.slice(0,Math.max(0,room))){const d=await compress(f,720,.7);if(d)u.board.photos.push(d);else fails++}
  if(fails)toast('Não consegui abrir uma das imagens.');
  if(!save()){u.board.photos=u.board.photos.slice(0,before);LS.set(K_USERS,DB.users)}else if(u.board.photos.length>before)sfx('ok');
  render();
 }
 if(kind==='avatar'){
  const d=await compress(files[0],320,.82);
  if(!d){toast('Não consegui abrir essa imagem.');return}
  const old=u.photo;u.photo=d;if(!save()){u.photo=old;LS.set(K_USERS,DB.users)}else{sfx('ok');toast('Foto atualizada!')}
  render();
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&ui.modal&&!ui.modal.lock){closeModal();return}
 if(route()!=='teste'||ui.modal)return;
 const tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA')return;
 let idx='12345'.indexOf(e.key);if(idx<0)idx='ABCDE'.indexOf(String(e.key).toUpperCase());
 if(idx>=0&&e.key.length===1){e.preventDefault();pickAnswer('ABCDE'[idx]);return}
 if(e.key==='Enter'&&tag!=='BUTTON'){const b=$('[data-act="qNext"]');if(b&&!b.disabled){e.preventDefault();b.click()}}
});
window.addEventListener('hashchange',()=>{let h='';try{h=location.hash}catch(e){}if(ui.ownHash&&h===ui.ownHash){ui.ownHash=null;return}ui.ownHash=null;const r=hashRoute();if(r===ui.route)return;if(ui.modal&&!ui.modal.lock)closeModal();ui.route=r;render()});
window.addEventListener('storage',e=>{if(e.key===K_USERS||e.key===K_SESSION){loadDB();render()}});

/* =========================================================
   INÍCIO
   ========================================================= */
try{loadDB()}catch(e){DB={users:{},session:null}}
function watchBadge(){const check=()=>{try{document.body.classList.toggle('nl-badge-on',!!document.getElementById('nl-badge-frame'))}catch(e){}};check();try{new MutationObserver(check).observe(document.body,{childList:true})}catch(e){}}
watchBadge();
ui.route=hashRoute();
PAY.mode=CONFIG.metodo==='codigo'?'code':isDemoHost()?'demo':'checking';
ui.cloudReady=detectCloud().then(on=>{if(on)return refreshCloud()}).catch(()=>{});
render();
detectPay().then(async()=>{const u=U();if(u&&await syncAccess(u)){go(stepFor(u));return}if(route()==='pagamento')render()});
</script>
</body>
