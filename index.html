<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orivie - Sua Personalidade</title>
<meta name="description" content="Descubra quem Deus te criou para ser: teste de temperamento cristão para mulheres.">
<meta name="theme-color" content="#FAF8F3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='38' rx='22' ry='23' fill='%23D9A08B'/%3E%3Cellipse cx='24' cy='10' rx='9' ry='4.5' fill='%23A8B8A0' transform='rotate(-25 24 10)'/%3E%3Cellipse cx='40' cy='9' rx='9' ry='4.5' fill='%23A8B8A0' transform='rotate(25 40 9)'/%3E%3Ccircle cx='25' cy='35' r='6' fill='%23fff'/%3E%3Ccircle cx='39' cy='35' r='6' fill='%23fff'/%3E%3Ccircle cx='25' cy='36' r='3.4' fill='%233A2E28'/%3E%3Ccircle cx='39' cy='36' r='3.4' fill='%233A2E28'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800;9..40,900&family=Playfair+Display:wght@600;700;800&family=Abril+Fatface&family=Caveat:wght@700&family=Archivo+Black&family=Special+Elite&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
try{tailwind.config={corePlugins:{preflight:false},theme:{extend:{colors:{creme:'#F7F3EE',salvia:'#A8B8A0',terracota:'#D9A08B',texto:'#3A2E28',bege:'#EAE2D9'},fontFamily:{display:['"Playfair Display"','serif'],ui:['"DM Sans"','sans-serif']}}}}}catch(e){}
</script>
<style>
/* =========================================================
   ORIVIE - SUA PERSONALIDADE · Design system
   Estilo lúdico/gamificado (lábio sólido, afundar ao tocar,
   bordas de 2px, trilha, mascote) com a paleta Orivie.
   ========================================================= */
:root{
  --creme:#F7F3EE;--branco:#FFFFFF;
  --salvia:#A8B8A0;--salvia-sh:#879A7E;--salvia-lt:#EDF1EA;--salvia-dk:#4F6249;
  --terra:#D9A08B;--terra-sh:#B97F6A;--terra-lt:#F8EAE3;--terra-dk:#94553F;
  --texto:#3A2E28;--muted:#75655B;
  --bege:#EAE2D9;--bege-sh:#D5C8BA;
  --mel:#E3B65E;--mel-sh:#C49840;--mel-lt:#FBF0DA;--mel-dk:#8A621A;
  --erro:#B5544A;--erro-sh:#934038;--erro-lt:#F8E1DD;
  --cinza:#ADA198;
  --f-display:"Playfair Display",Georgia,serif;
  --f-ui:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--texto);font-family:var(--f-ui);font-weight:500;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,figure{margin:0}
ul{padding:0;list-style:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
body.modal-open{overflow:hidden}
#app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--creme);position:relative}
:focus-visible{outline:3px solid var(--salvia-dk);outline-offset:2px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
/* Fallback das utilidades Tailwind usadas: o layout continua íntegro mesmo se o CDN falhar */
.block{display:block}.flex{display:flex}.grid{display:grid}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.justify-end{justify-content:flex-end}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.grid-cols-1{grid-template-columns:repeat(1,minmax(0,1fr))}.grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-5{margin-top:20px}.mt-6{margin-top:24px}.mt-8{margin-top:32px}
.mb-1{margin-bottom:4px}.mb-3{margin-bottom:12px}.mb-5{margin-bottom:20px}.mb-6{margin-bottom:24px}.mx-auto{margin-left:auto;margin-right:auto}.pt-4{padding-top:16px}
.text-center{text-align:center}.text-left{text-align:left}

/* ---------- Tipografia ---------- */
.display{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:40px;letter-spacing:-.3px}
.h1{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:33px}
.h2{font-weight:800;font-size:20px;line-height:28px}
.h3{font-weight:700;font-size:17px;line-height:24px}
.body{font-size:17px;line-height:26px}
.lead{font-size:17px;line-height:26px;color:var(--muted)}
.small{font-size:14.5px;line-height:21px;font-weight:600}
.muted{color:var(--muted)}
.link{color:var(--terra-dk);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.c-terra{color:var(--terra-dk)}.c-mel{color:var(--mel-dk)}.c-gray{color:var(--cinza)}.c-sage{color:var(--salvia-dk)}

/* ---------- Estrutura ---------- */
.brandbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;padding:8px 14px;background:var(--creme);border-bottom:2px solid var(--bege)}
.brand{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--texto);white-space:nowrap}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800}
.screen{padding:20px 16px 190px}
.screen.app{padding-bottom:120px}
.footbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--creme);border-top:2px solid var(--bege);display:flex;gap:12px;z-index:40}
.footbar.stack{flex-direction:column}
.center-col{display:flex;flex-direction:column;align-items:center}

/* ---------- Botões (lábio sólido + afundar) ---------- */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 20px;border:2px solid transparent;border-radius:12px;font:700 15px/1.15 var(--f-ui);letter-spacing:.64px;text-transform:uppercase;text-align:center;cursor:pointer;user-select:none;transition:transform 80ms,box-shadow 80ms,background-color 150ms,filter 150ms;text-decoration:none}
.btn:hover:not(:disabled){filter:brightness(1.03)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none!important}
.btn-primary{background:var(--terra);color:var(--texto);box-shadow:0 4px 0 var(--terra-sh)}
.btn-sage{background:var(--salvia);color:var(--texto);box-shadow:0 4px 0 var(--salvia-sh)}
.btn-mel{background:var(--mel);color:var(--texto);box-shadow:0 4px 0 var(--mel-sh)}
.btn-danger{background:var(--erro);color:#fff;box-shadow:0 4px 0 var(--erro-sh)}
.btn-outline{background:#fff;color:var(--terra-dk);border-color:var(--bege);box-shadow:0 2px 0 var(--bege-sh)}
.btn-outline:active:not(:disabled){background:var(--bege);border-color:var(--bege-sh);transform:translateY(2px)}
.btn-ghost{background:transparent;color:var(--terra-dk);min-height:46px}
.btn-ghost:active:not(:disabled){transform:none;background:var(--bege)}
.btn-premium{background:linear-gradient(135deg,#A8B8A0 0%,#D9A08B 55%,#E3B65E 100%);color:var(--texto);box-shadow:0 4px 0 var(--terra-sh)}
.btn:disabled,.btn.is-disabled{background:var(--bege);color:var(--cinza);box-shadow:none;border-color:transparent;cursor:not-allowed;filter:none;pointer-events:none}
.btn-sm{width:auto;min-height:40px;padding:8px 14px;font-size:12.5px}
.ibtn{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;color:var(--muted);transition:background-color 150ms}
.ibtn:hover{background:var(--bege)}
.ibtn.danger{color:var(--erro)}
.btn-x{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--cinza)}
.btn-x:hover{background:var(--bege);color:var(--texto)}

/* ---------- Segmentado / chips ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;padding:4px;background:var(--bege);border-radius:14px}
.seg button{min-height:44px;border-radius:10px;font:800 13.5px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;color:var(--muted);transition:background-color 150ms}
.seg button.on{background:#fff;color:var(--terra-dk);box-shadow:0 2px 0 var(--bege-sh)}
.seg.sm button{min-height:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-f{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:12px;font:700 13.5px var(--f-ui);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);transition:transform 80ms}
.chip-f:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.chip-f.on{background:var(--salvia-lt);border-color:var(--salvia);color:var(--salvia-dk)}
.chip-f b{font-weight:800;color:var(--terra-dk)}

/* ---------- Tiles / opções ---------- */
.tile{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:#fff;color:var(--texto);border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px;font:700 16px/1.35 var(--f-ui);text-align:left;cursor:pointer;transition:transform 80ms,background-color 150ms,border-color 150ms}
.tile:hover{background:#FDFBF8}
.tile:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.tile.sel{background:var(--salvia-lt);border-color:var(--salvia);color:var(--salvia-dk)}
.tile .key{flex:none;display:grid;place-items:center;width:32px;height:32px;border:2px solid var(--bege);border-radius:8px;font-size:14px;font-weight:800;color:var(--muted)}
.tile.sel .key{background:var(--salvia);border-color:var(--salvia);color:var(--texto)}
.tile.chip{padding:12px;min-height:56px;font-size:15px}
.check-dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--salvia);color:var(--texto);flex:none}
.cbox{display:grid;place-items:center;flex:none;width:26px;height:26px;border:2px solid var(--bege-sh);border-radius:8px;background:#fff;color:var(--texto)}
.tile.sel .cbox,.cbox.on{background:var(--salvia);border-color:var(--salvia-sh)}
.cbox.big{width:34px;height:34px;border-radius:9px;border-bottom-width:4px}
.cbox.big:active{transform:translateY(2px);border-bottom-width:2px}

/* ---------- Cards / tags ---------- */
.card{background:#fff;border:2px solid var(--bege);border-radius:16px;padding:16px 18px}
.tag{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:8px;background:var(--salvia-lt);color:var(--salvia-dk);font:800 11.5px/1 var(--f-ui);letter-spacing:.48px;text-transform:uppercase;white-space:nowrap}
.tag-terra{background:var(--terra-lt);color:var(--terra-dk)}
.tag-mel{background:var(--mel-lt);color:var(--mel-dk)}
.tag-premium{background:linear-gradient(135deg,#EDF1EA,#F8EAE3,#FBF0DA);color:var(--terra-dk);border:2px solid var(--terra)}
.list li{display:flex;align-items:center;gap:12px;padding:8px 0;font-weight:700;font-size:16px}
.sec-h{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.6px;text-transform:uppercase}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 12px}

/* ---------- Progresso ---------- */
.prog{height:14px;background:var(--bege);border-radius:999px;overflow:hidden;flex:1}
.prog>i{display:block;position:relative;height:100%;width:0;background:var(--terra);border-radius:999px;transition:width .5s var(--spring)}
.prog>i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;background:rgba(255,255,255,.4);border-radius:999px}
.prog.sage>i{background:var(--salvia)}
.prog.mel>i{background:var(--mel)}
.prog.sm{height:10px}.prog.sm>i::after{display:none}
.lesson-bar{display:flex;align-items:center;gap:12px;padding:12px 16px 0}
.btn-icon-plain{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:var(--cinza)}
.btn-icon-plain:hover{background:var(--bege);color:var(--texto)}
.dim{display:grid;grid-template-columns:110px 1fr 26px;align-items:center;gap:10px;padding:5px 0;font-size:14px;font-weight:700}
.dim b{text-align:right;color:var(--muted)}

/* ---------- Inputs ---------- */
.lbl-f{display:block;font-weight:800;font-size:14px;margin:0 0 6px}
.input{width:100%;min-height:50px;padding:12px 14px;background:#FBF8F4;color:var(--texto);border:2px solid var(--bege);border-radius:12px;font:500 16px var(--f-ui);transition:border-color 150ms,background-color 150ms}
.input::placeholder{color:#A69A91}
.input:focus{outline:none;border-color:var(--salvia);background:#fff}
.input.bad{border-color:var(--erro);background:var(--erro-lt)}
.input.sm{min-height:42px;padding:8px 12px;font-size:16px}
.err{color:var(--erro);font-size:13.5px;font-weight:700;margin-top:6px}
.err:empty{display:none}

/* ---------- Fala / mascote ---------- */
.speech{display:flex;align-items:flex-end;gap:10px}
.speech>svg{flex:none}
.bubble{position:relative;flex:1;background:#fff;border:2px solid var(--bege);border-radius:16px;padding:12px 14px;font-weight:600;font-size:15.5px;line-height:1.45}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:14px;height:14px;background:#fff;border-left:2px solid var(--bege);border-bottom:2px solid var(--bege);transform:rotate(45deg)}
.bubble.up::before{left:50%;top:-9px;bottom:auto;margin-left:-7px;transform:rotate(135deg)}
.mascot .m-wave{transform-box:fill-box;transform-origin:30% 95%;animation:wave 1.3s ease-in-out infinite}
.floaty{animation:floaty 2.6s ease-in-out infinite}
.hop{animation:hop .9s var(--spring) infinite alternate}
.pop{animation:pop .3s var(--spring)}
.shake{animation:shake .3s}
.welcome-art{position:relative;margin:8px 0 6px}
.spark{position:absolute;animation:floaty 3s ease-in-out infinite}
.spark.s1{top:10px;left:-26px}.spark.s2{top:40px;right:-30px;animation-delay:.6s}

/* ---------- Pagamento ---------- */
.premium-card{border-radius:24px;padding:20px;border:2px solid var(--bege);background:linear-gradient(135deg,#EDF1EA 0%,#F8EAE3 55%,#FBF0DA 100%)}
.price{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1;margin:16px 0 8px;color:var(--terra-dk)}
.benefits{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.benefits li{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.qr-box{display:grid;place-items:center;padding:14px;background:#fff;border:2px solid var(--bege);border-radius:16px;width:fit-content;margin:0 auto}
.code-box{display:flex;gap:8px;align-items:center}
.code-box .input{font-size:13px;font-family:ui-monospace,Menlo,monospace}
.step-n{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--terra);color:var(--texto);font-weight:800;box-shadow:0 3px 0 var(--terra-sh)}
.dots{display:flex;gap:8px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--terra);animation:dot 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s;background:var(--salvia)}
.dots i:nth-child(3){animation-delay:.3s;background:var(--mel)}

/* ---------- App: header de status e tab bar ---------- */
.stat{display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:44px;border-radius:12px;font-weight:800;font-size:16px}
.stat:hover{background:var(--bege)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 6px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--bege);z-index:40}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:2px solid transparent;border-radius:12px;font:800 10px var(--f-ui);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);transition:background-color 150ms}
.tabbar button svg{transition:transform 150ms var(--spring)}
.tabbar button[aria-current="page"]{background:var(--salvia-lt);border-color:var(--salvia);color:var(--salvia-dk)}
.tabbar button[aria-current="page"] svg{transform:scale(1.1)}

/* ---------- Unidade / trilha ---------- */
.unit-head{position:sticky;top:60px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;background:var(--terra);color:var(--texto);box-shadow:0 4px 0 var(--terra-sh)}
.unit-head.sage{background:var(--salvia);box-shadow:0 4px 0 var(--salvia-sh)}
.unit-kicker{font:800 11.5px var(--f-ui);letter-spacing:.6px;text-transform:uppercase;opacity:.85}
.unit-title{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:26px}
.unit-head .btn-outline{background:rgba(255,255,255,.85)}
#semana{scroll-margin-top:66px}
.trail{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:60px 0 12px}
.trow{position:relative;display:flex;flex-direction:column;align-items:center}
.node{position:relative;z-index:1;display:grid;place-items:center;width:72px;height:66px;border:0;border-radius:50%;background:var(--terra);color:#fff;box-shadow:0 7px 0 var(--terra-sh);cursor:pointer;transition:transform 80ms}
.node:active{transform:translateY(7px);box-shadow:none}
.node.done{background:var(--salvia);color:var(--texto);box-shadow:0 7px 0 var(--salvia-sh)}
.node.locked,.node.missed{background:var(--bege);color:var(--cinza);box-shadow:0 7px 0 var(--bege-sh)}
.node.todo{background:#fff;border:2px solid var(--bege);box-shadow:0 7px 0 var(--bege-sh)}
.node-cap{margin-top:12px;font-weight:800;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;max-width:120px;text-align:center;line-height:1.25}
.ring{position:absolute;width:100px;height:100px;left:50%;top:-17px;transform:translateX(-50%);pointer-events:none}
.balloon{position:absolute;z-index:2;top:-50px;left:50%;transform:translate(-50%,0);background:#fff;border:2px solid var(--bege);border-radius:12px;padding:6px 12px;font:800 13px var(--f-ui);color:var(--terra-dk);letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.balloon::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;width:12px;height:12px;background:#fff;border-right:2px solid var(--bege);border-bottom:2px solid var(--bege);transform:rotate(45deg)}
.trail-pal{position:absolute;top:150px;pointer-events:none}
.trail-pal.left{left:4px}.trail-pal.right{right:4px;top:330px}

/* ---------- Combina ---------- */
.icard{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px;overflow:hidden;transition:transform 80ms}
.icard:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.img-box{position:relative;display:grid;place-items:center;aspect-ratio:16/10;background:var(--bege);overflow:hidden}
.img-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img-box.big{border-radius:16px;aspect-ratio:4/3}
.img-box.cover{border-radius:16px}
.img-box.thumb{width:76px;height:76px;aspect-ratio:auto;border-radius:12px;flex:none}
.why{font-size:14.5px;line-height:21px;color:var(--salvia-dk);background:var(--salvia-lt);border-radius:12px;padding:10px 12px}
.whybox{background:var(--salvia-lt);border-radius:16px;padding:14px}
.whybox .bubble{background:#fff}

/* ---------- Checklist ---------- */
.crow{background:#fff;border:2px solid var(--bege);border-radius:16px;padding:10px 10px 12px 12px;transition:background-color 150ms}
.crow.is-done{background:var(--salvia-lt);border-color:var(--salvia)}
.crow-t{flex:1;font-weight:700;font-size:15.5px;line-height:1.35}
.crow.is-done .crow-t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--salvia-dk)}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--bege)}
.hist:last-child{border-bottom:0}

/* ---------- Missões ---------- */
.mission{display:flex;align-items:center;gap:12px;padding:10px 0}
.mission-txt{flex:1;min-width:0}
.mission-txt p{font-weight:700;font-size:15px;line-height:1.3;margin-bottom:6px}
.mission .prog{height:12px}

/* ---------- Board ---------- */
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bcell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--bege)}
.bcell img{width:100%;height:100%;object-fit:cover}
.bcell.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--bege-sh);background:#fff;cursor:pointer;font:800 11.5px var(--f-ui);letter-spacing:.4px;text-transform:uppercase;color:var(--terra-dk)}
.bcell.add:hover{background:var(--terra-lt)}
.bdel{position:absolute;top:6px;right:6px;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(58,46,40,.78);color:#fff}
.bdel::before{content:"";position:absolute;inset:-7px}
.prev{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px}
.prev:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.prev-thumbs{display:grid;grid-template-columns:repeat(3,26px);gap:3px;flex:none}
.prev-thumbs img,.prev-thumbs span{width:26px;height:26px;border-radius:6px;object-fit:cover;background:var(--bege)}

.board-wrap{display:flex;justify-content:center}
.board-canvas{display:block;width:100%;max-width:340px;aspect-ratio:9/16;height:auto;border-radius:16px;border:2px solid var(--bege);background:var(--bege)}
.board-wrap .board-canvas{box-shadow:0 4px 0 var(--bege-sh)}
.stk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:14px;font:800 10.5px/1.2 var(--f-ui);letter-spacing:.3px;text-transform:uppercase;color:var(--muted);transition:transform 80ms}
.stk img{width:44px;height:44px;object-fit:contain}
.stk:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.stk.on{background:var(--salvia-lt);border-color:var(--salvia);color:var(--salvia-dk)}
.prev-card{display:block;width:100%;text-align:left;padding:8px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px}
.prev-card:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.prev-card .board-canvas{max-width:none;border-radius:10px;border:0}
/* ---------- Aprender ---------- */
.reading p{font-size:17px;line-height:28px;margin-bottom:16px}
.tcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px}
.tcard:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}

/* ---------- Eu ---------- */
.avatar{position:relative;width:104px;height:104px;border-radius:50%;background:var(--terra);display:grid;place-items:center;font-family:var(--f-display);font-size:44px;font-weight:800;color:var(--texto);box-shadow:0 5px 0 var(--terra-sh)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar-edit{position:absolute;right:-4px;bottom:-2px;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--bege);box-shadow:0 3px 0 var(--bege-sh);cursor:pointer}
.paid{display:inline-flex;text-align:left;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:var(--salvia-lt);color:var(--salvia-dk);font-weight:800;font-size:14px}
.stile{display:flex;align-items:center;gap:10px;padding:12px;background:#fff;border:2px solid var(--bege);border-radius:16px}
.stile b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.stile span{font-size:12.5px;font-weight:700;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal-h{font:800 11.5px var(--f-ui);color:var(--muted)}
.cal-d{display:grid;place-items:center;aspect-ratio:1;border-radius:50%;font-weight:700;font-size:13.5px}
.cal-d.on{background:var(--terra);color:var(--texto);font-weight:800}
.cal-d.miss{color:var(--cinza);background:#F3EEE8}
.cal-d.fut{color:#C9BFB6}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--terra-dk)}
.legend{display:inline-flex;align-items:center;gap:6px}
.lg{width:12px;height:12px;border-radius:50%;display:inline-block}
.lg.on{background:var(--terra)}.lg.miss{background:#E5DDD4}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:#fff;border:2px solid var(--bege);border-bottom-width:4px;border-radius:16px;text-align:center;font:800 11.5px/1.25 var(--f-ui)}
.badge:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.badge-ic{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--mel-lt);box-shadow:0 3px 0 var(--mel)}
.badge.locked{color:var(--cinza)}
.badge.locked .badge-ic{filter:grayscale(1);opacity:.45;box-shadow:0 3px 0 var(--bege-sh);background:var(--bege)}
.menu-ic{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--creme)}
.switch{position:relative;flex:none;width:52px;height:30px;border-radius:999px;background:var(--bege-sh);transition:background-color 150ms}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s var(--spring)}
.switch.on{background:var(--salvia-dk)}
.switch.on::after{transform:translateX(22px)}

/* ---------- Modal / toast / celebração ---------- */
.backdrop{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(58,46,40,.5);animation:fade .2s ease-out}
.backdrop.noanim,.backdrop.noanim .sheet{animation:none}
.sheet{width:100%;max-width:430px;max-height:92vh;max-height:92dvh;overflow:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));animation:sheetUp .32s var(--spring)}
.backdrop.center{align-items:center;padding:16px}
.backdrop.center .sheet{border-radius:24px;animation:popIn .38s var(--spring)}
.sheet.full{min-height:70vh}
.toast{position:fixed;left:50%;top:70px;z-index:150;transform:translateX(-50%);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);width:max-content;padding:12px 16px;background:var(--texto);color:#fff;border-radius:14px;font-weight:700;font-size:14.5px;line-height:1.35;box-shadow:0 4px 0 #1F1814;animation:toastIn .35s var(--spring)}
.toast.out{opacity:0;transform:translate(-50%,-10px);transition:all .3s}
.xp-pill{position:fixed;left:50%;top:42%;z-index:160;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:var(--mel);color:var(--texto);font:800 20px var(--f-ui);box-shadow:0 4px 0 var(--mel-sh);animation:xpUp 1.3s ease-out forwards;pointer-events:none}
.stat-card{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:#fff}
.stat-k{background:var(--c);color:var(--texto);font:800 10.5px var(--f-ui);letter-spacing:.5px;text-transform:uppercase;padding:5px 2px}
.stat-v{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 2px;font:800 20px var(--f-ui)}
.sc-mel{--c:var(--mel)}.sc-sage{--c:var(--salvia)}.sc-terra{--c:var(--terra)}
.bignum{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;color:var(--terra-dk)}
.cf-box{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden}
.cf{position:absolute;top:-16px;width:9px;height:14px;border-radius:3px;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}

/* Selo "Powered by Netlify" (plano gratuito): sobe o rodapé e as abas para o selo não cobrir os botões */
body.nl-badge-on .footbar{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
body.nl-badge-on .tabbar{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
body.nl-badge-on .screen{padding-bottom:250px}
body.nl-badge-on .screen.app{padding-bottom:180px}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes toastIn{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes xpUp{0%{transform:translate(-50%,10px) scale(.7);opacity:0}20%{transform:translate(-50%,0) scale(1.08);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--r))}}
@keyframes dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* =========================================================
   NOVO VISUAL (2026-11): limpo, neutro e premium
   Botões terracota lisos, campos com borda sálvia, cards suaves
   ========================================================= */
:root{--terra-btn:#C47A5F;--terra-btn-dk:#A9634A;--card:#FBF8F4;--line:#E6DDD3;--shadow:0 6px 22px rgba(58,46,40,.07)}
body{font-weight:400}
.display,.h1{font-family:var(--f-ui);font-weight:700;letter-spacing:-.6px}
.display{font-size:34px;line-height:40px}
.h1{font-size:28px;line-height:34px}
.h2{font-weight:700;font-size:20px}
.brandbar{justify-content:center;border-bottom:0;min-height:56px;position:relative}
.brandbar .brand{font-size:15px;font-weight:500;gap:8px}
.brandbar .brand b{font-family:var(--f-display);font-weight:500;font-size:19px}
.brandbar.has-right{justify-content:space-between}
.brandbar>.ibtn{position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.unit-head.sage,.unit-head{box-shadow:var(--shadow)}
.brand-dot{color:var(--muted);margin:0 2px}
/* botões */
.btn{border-radius:14px;min-height:54px;text-transform:none;letter-spacing:0;font:600 17px/1.15 var(--f-ui)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn-primary,.btn-premium{background:var(--terra-btn);color:#fff;box-shadow:0 6px 16px rgba(196,122,95,.28)}
.btn-primary:hover:not(:disabled){background:var(--terra-btn-dk);filter:none}
.btn-sage{background:var(--salvia);color:var(--texto);box-shadow:0 6px 16px rgba(168,184,160,.3)}
.btn-mel{box-shadow:none}
.btn-outline{background:transparent;color:var(--texto);border:1.5px solid var(--salvia);box-shadow:none}
.btn-outline:active:not(:disabled){background:var(--salvia-lt);transform:scale(.98)}
.btn-ghost{color:var(--texto);font-weight:500}
.btn-sm{min-height:40px;font-size:14px;border-radius:12px}
.btn:disabled,.btn.is-disabled{background:#E9E2DA;color:#A99E95;box-shadow:none}
/* campos */
.lbl-f{font-weight:500;font-size:15px;margin:0 0 8px 4px}
.input{background:transparent;border:1.5px solid #B9C6B2;border-radius:14px;min-height:54px;padding:14px 16px;font-size:17px}
.input:focus{border-color:var(--salvia-dk);background:#fff}
.field-ic{position:relative}.field-ic>svg{position:absolute;left:16px;top:16px;color:var(--salvia-dk);pointer-events:none}.field-ic .input{padding-left:50px}
/* cards e opções */
.card,.crow,.stile,.prev,.prev-card,.tcard,.icard,.badge{background:var(--card);border:1px solid var(--line);border-bottom-width:1px;border-radius:18px;box-shadow:var(--shadow)}
.tile{background:var(--card);border:1px solid var(--line);border-bottom-width:1px;border-radius:16px;box-shadow:0 3px 12px rgba(58,46,40,.05);font-weight:400;font-size:17px;padding:16px}
.tile:active,.icard:active,.tcard:active,.prev:active,.prev-card:active,.badge:active{transform:scale(.99);border-bottom-width:1px;margin-bottom:0}
.tile .key{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--texto);font-size:20px;font-weight:400;color:var(--texto)}
.tile.sel{background:var(--card);border-color:var(--terra);color:var(--texto)}
.tile.sel .key{background:var(--terra-btn);border-color:var(--terra-btn);color:#fff}
.tile.chip .key,.tile.chip .cbox{width:26px;height:26px;border-radius:8px}
.check-dot{display:none}
.cbox{border:1.5px solid #CFC5BB;border-radius:8px;background:transparent}
.tile.sel .cbox,.cbox.on{background:var(--salvia);border-color:var(--salvia);color:#fff}
.crow.is-done{background:var(--card);border-color:var(--line)}
.tag{text-transform:none;letter-spacing:0;font-weight:600;font-size:13px;height:28px;border-radius:999px;padding:0 12px}
.tag-terra{background:#E8B5A3;color:var(--texto)}
.sec-h{text-transform:none;letter-spacing:0;font-weight:700;font-size:18px}
/* progresso */
.prog{height:12px;background:#E9E2D6}
.prog>i{background:var(--salvia)}.prog>i::after{display:none}
.prog.mel>i{background:var(--mel)}
.pct{font-size:14px;color:var(--muted);min-width:38px}
/* chips */
.chip-f{border:0;border-radius:14px;background:#C9D5C3;color:var(--texto);text-transform:none;letter-spacing:0;font-weight:500;font-size:15px;min-height:44px;padding:0 16px}
.chip-f:active{transform:scale(.97);border-bottom-width:0;margin-bottom:0}
.chip-f.on{background:#E0A58F;color:#fff}
.chip-f b{color:inherit}
.seg{background:#EAE4DC;border-radius:16px}
.seg button{text-transform:none;letter-spacing:0;font-weight:600;font-size:16px}
.seg button.on{background:var(--card);color:var(--texto);box-shadow:inset 0 -3px 0 var(--salvia)}
/* falas da Ori */
.bubble{background:var(--card);border:1px solid var(--line);font-weight:400}
.bubble::before{display:none}
.ori-card{display:flex;align-items:center;gap:14px;padding:20px 18px;border-radius:22px;background:#C3CFBC}
.ori-card h2{font-weight:700;font-size:24px}
.ori-card p{font-size:16px;line-height:1.45}
.ori-card .ph{font-style:italic;margin-top:8px}
/* lista de checks (Hoje) */
.mini-check{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#F1ECE5;margin-top:8px;width:100%;text-align:left}
.mini-check .dot{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--salvia);color:#fff;flex:none}
.mini-check.on .dot{background:var(--terra-btn);border-color:var(--terra-btn)}
.mini-check .ok{margin-left:auto;font-size:13px;padding:3px 10px;border-radius:999px;background:#C9D5C3}
/* grupos do checklist */
.gico{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--salvia)}
/* trilha da semana e unidade */
.unit-head{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--texto)}
.unit-head.sage{background:var(--card)}
.unit-title{font-family:var(--f-ui);font-weight:700}
.node{box-shadow:0 5px 0 var(--terra-sh)}
.node-cap,.unit-kicker{text-transform:none;letter-spacing:0}
.balloon{text-transform:none;letter-spacing:0}
/* menu da aba Eu */
.eu-menu .tile{border:0;box-shadow:0 3px 12px rgba(58,46,40,.05)}
.eu-menu .tile:nth-child(odd){background:#C9D5C3}
.eu-menu .tile:nth-child(even){background:#EBC2B2}
.eu-menu .menu-ic{background:rgba(255,255,255,.45);border-radius:50%}
.prof-card{display:flex;align-items:center;gap:16px}
.prof-card .avatar{width:96px;height:96px;font-size:40px;box-shadow:none;flex:none}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:#C47A5F;color:#fff;font-size:15px;font-weight:500}
.paid{background:#B9C7B2;color:var(--texto);border-radius:18px;padding:14px 16px;font-weight:600;width:100%}
/* abas */
.tabbar{background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(58,46,40,.05)}
.tabbar button{text-transform:none;letter-spacing:0;font-weight:500;font-size:11px;border:0}
.tabbar button[aria-current="page"]{background:transparent;color:var(--salvia-dk);font-weight:700}
.footbar{border-top:0;background:linear-gradient(to top,var(--creme) 70%,rgba(247,243,238,0))}
/* logo */
.logo-big{display:flex;align-items:center;justify-content:center;gap:12px}
.logo-big b{display:block;font-family:var(--f-display);font-weight:500;font-size:44px;line-height:1}
.logo-big span{display:block;font-size:16px;letter-spacing:.4px;color:var(--texto);margin-top:4px}
.or-sep{text-align:center;color:var(--muted);margin:14px 0}
/* Ori assistente */
.ori-fab{position:fixed;z-index:45;right:max(14px,calc(50% - 215px + 14px));bottom:calc(92px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:6px;padding:8px 14px 8px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(58,46,40,.16);font-weight:700;font-size:15px;color:var(--texto)}
.ori-fab:active{transform:scale(.96)}
.chat-log{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:12px 14px;border-radius:18px;font-size:16px;line-height:1.5}
.msg.ori{align-self:flex-start;background:#E4EBE0;border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--terra-btn);color:#fff;border-bottom-right-radius:6px}
.msg .btn-outline{background:var(--card)}
.ori-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.ori-chips .chip-f{min-height:38px;font-size:14px;background:#EFE9E1}
.ori-input{display:flex;gap:8px}
.ori-input .input{min-height:50px}

/* Combina em card horizontal */
.hcard{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.hcard-main{display:flex;gap:14px;width:100%;text-align:left;align-items:flex-start}
.img-box.hthumb{width:112px;height:132px;aspect-ratio:auto;border-radius:14px;flex:none}
.favbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;border:1.5px solid #E0A58F;background:#F6E3DA;color:#A9634A;font-weight:500;font-size:15px}
.favbtn.on{background:#E0A58F;color:#fff}
/* Checklist em lista dentro do card */
.crow2{padding:12px 0;border-top:1px solid var(--line)}
.crow2:first-child{border-top:0}
.crow2 .crow-t{flex:1;font-weight:500;font-size:16px;line-height:1.35}
.crow2.is-done .crow-t{text-decoration:line-through;color:var(--salvia-dk)}
.crow2 .input.sm{min-height:40px;font-size:15px;border-width:1px}
/* Board */
.bcell2{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--bege);box-shadow:var(--shadow)}
.bcell2 img{width:100%;height:100%;object-fit:cover}
.bcell2.empty-ph{display:grid;place-items:center;cursor:pointer;opacity:.75}
.prev-row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 14px 10px 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.thumb-cv{width:54px;height:96px;border-radius:10px;flex:none;background:var(--bege)}

.price{font-family:var(--f-ui);font-weight:700;letter-spacing:-1px;color:var(--terra-btn)}

/* =========================================================
   VISUAL 2026-11 (pastel): fundo creme, cards lavanda, azul, rosa e verde
   ========================================================= */
:root{--creme:#FAF8F3;--texto:#2E2E2E;--muted:#8B8A94;--cinza:#A9A8B2;
 --salvia:#93CBA6;--salvia-lt:#E4F3EA;--salvia-dk:#3F7A55;--salvia-sh:#6FAE86;
 --terra:#F2AFC6;--terra-lt:#FCE7EF;--terra-dk:#B4557A;--terra-sh:#E58FAE;
 --mel:#7B9CF0;--mel-lt:#E8EEFD;--mel-dk:#3E5FB8;--mel-sh:#5D7FD6;
 --bege:#EDEFFA;--bege-sh:#DCDFF2;--terra-btn:#2E2E2E;--terra-btn-dk:#000;
 --card:#EDEFFA;--line:#E4E6F4;--shadow:none}
body,#app{background:#FAF8F3;color:#2E2E2E}
.display,.h1{font-weight:600;letter-spacing:-1px}
.h2{font-weight:600;letter-spacing:-.4px}
.muted,.lead{color:#8B8A94}
/* topo */
.brandbar{background:#FAF8F3;min-height:64px;padding:10px 16px}
.brandbar .brand{background:#fff;border-radius:999px;padding:6px 14px 6px 8px;box-shadow:0 1px 0 rgba(46,46,46,.04)}
.stat{background:#fff;border-radius:999px;padding:6px 12px;min-height:40px}
.date-pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500}
.greet{font-size:36px;line-height:1.08;font-weight:600;letter-spacing:-1.4px;margin:0}
.greet span{color:#A3A2AD;font-weight:500}
.brandbar.has-right .brand-sub{display:none}
.greet+.mini-row{margin-top:26px}
/* cartões de resumo */
.mini-row{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.mini-row::-webkit-scrollbar{display:none}
.mini{flex:none;width:132px;min-height:128px;text-align:left;background:#fff;border-radius:26px;padding:14px;display:flex;flex-direction:column;align-items:flex-start}
.mini .mc{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;color:#2E2E2E;margin-bottom:auto}
.mini small{font-size:13px;color:#2E2E2E;margin-top:14px}.mini b{font-size:15px;font-weight:600}
/* botões */
.btn{border-radius:999px;font-weight:600}
.btn-primary,.btn-premium{background:#2E2E2E;color:#fff;box-shadow:none}
.btn-primary:hover:not(:disabled){background:#000}
.btn-sage{background:#93CBA6;color:#2E2E2E;box-shadow:none}
.btn-outline{background:#fff;color:#2E2E2E;border:1px solid #E4E6F4}
.btn-outline:active:not(:disabled){background:#EDEFFA}
.btn:disabled,.btn.is-disabled{background:#ECECF1;color:#A9A8B2}
.link{color:#3E5FB8}
/* cards */
.card,.crow,.stile,.prev,.prev-card,.tcard,.icard,.badge,.hcard,.prev-row,.unit-head{background:#EDEFFA;border:0;border-radius:28px;box-shadow:none}
.ori-card{background:#fff;border-radius:28px}
.paid{background:#E4F3EA;border-radius:24px}
.mini-check{background:#fff;border-radius:20px}
.mini-check .dot{border-color:#7B9CF0}.mini-check.on .dot{background:#2E2E2E;border-color:#2E2E2E}
.mini-check .ok{background:#E4F3EA}
.crow2{border-top-color:#DCDFF2}
.whybox{background:#fff;border-radius:24px}
.bubble{background:#fff;border:0}
/* campos */
.input{background:#fff;border:1px solid #E4E6F4;border-radius:18px}
.input:focus{border-color:#7B9CF0;background:#fff}
.field-ic>svg{color:#7B9CF0}
/* teste */
.tile{background:#EDEFFA;border:0;border-radius:24px;box-shadow:none}
.tile .key{border-color:#2E2E2E}
.tile.sel{background:#fff;box-shadow:inset 0 0 0 2px #7B9CF0}
.tile.sel .key{background:#7B9CF0;border-color:#7B9CF0}
.cbox{border-color:#C9CCE3}.tile.sel .cbox,.cbox.on{background:#93CBA6;border-color:#93CBA6}
/* progresso, etiquetas, filtros */
.prog{background:#E4E6F4}.prog>i,.prog.sage>i{background:#7B9CF0}.prog.mel>i{background:#93CBA6}
.tag{background:#E4F3EA;color:#2E2E2E}.tag-terra{background:#FCE7EF;color:#2E2E2E}.tag-mel{background:#E8EEFD;color:#2E2E2E}
.pill{background:#2E2E2E}
.chip-f{background:#fff;color:#2E2E2E;border-radius:999px}
.chip-f.on{background:#2E2E2E;color:#fff}
.seg{background:#fff;border-radius:999px;padding:5px}
.seg button{border-radius:999px;font-weight:500}
.seg button.on{background:#EDEFFA;box-shadow:none}
.gico{border-color:#7B9CF0;background:#fff}
.favbtn{background:#FCE7EF;border-color:#F2AFC6;color:#B4557A;border-radius:999px}.favbtn.on{background:#F2AFC6;color:#2E2E2E}
.eu-menu .tile:nth-child(odd){background:#EDEFFA}.eu-menu .tile:nth-child(even){background:#FCE7EF}
.eu-menu .menu-ic{background:#fff}
.avatar{background:#7B9CF0;color:#fff}
.price{color:#2E2E2E}
.premium-card{background:#EDEFFA;border:0;border-radius:28px}
.step-n{background:#7B9CF0;color:#fff;box-shadow:none}
.node{box-shadow:0 5px 0 rgba(0,0,0,.08)}
/* barra de baixo flutuante */
.tabbar{left:50%;bottom:calc(12px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:400px;padding:8px;border:0;border-radius:999px;background:#fff;box-shadow:0 10px 30px rgba(46,46,46,.10);grid-template-columns:repeat(6,1fr);gap:2px}
.tabbar button{min-height:50px;border-radius:999px;color:#2E2E2E}
.tabbar button span{display:none}
.tabbar button[aria-current="page"]{background:#EDEFFA;color:#2E2E2E}
.tabbar button[aria-current="page"] svg{transform:none}
.screen.app{padding-bottom:150px}
.ori-fab{bottom:calc(92px + env(safe-area-inset-bottom));background:#fff;border:0;box-shadow:0 8px 24px rgba(46,46,46,.12)}
.footbar{background:linear-gradient(to top,#FAF8F3 70%,rgba(250,248,243,0))}
.msg.ori{background:#EDEFFA}.msg.me{background:#2E2E2E}

/* Combina estilo Pinterest */
.pin-tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px;border-bottom:1px solid #ECEBF2}
.pin-tabs::-webkit-scrollbar{display:none}
.pin-tabs button{flex:none;padding:10px 0 12px;font-size:17px;font-weight:600;color:#8B8A94;border-bottom:3px solid transparent;border-radius:0}
.pin-tabs button.on{color:#2E2E2E;border-bottom-color:#2E2E2E}
.masonry{column-count:2;column-gap:12px}
.pin{break-inside:avoid;margin-bottom:16px;display:inline-block;width:100%}
.pin-img{position:relative;display:grid;place-items:center;width:100%;border-radius:22px;overflow:hidden;color:#2E2E2E}
.pin-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pin-match{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.9);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.pin-cap{display:flex;align-items:flex-start;gap:6px;padding:8px 2px 0}
.pin-title{flex:1;text-align:left;font-size:15px;font-weight:500;line-height:1.3;color:#2E2E2E;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin-fav{flex:none;width:30px;height:30px;display:grid;place-items:center;color:#2E2E2E}
.pin-fav.on{color:#E58FAE}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
</head>

function isDemoHost(){try{return location.protocol==='file:'||/claude/i.test(location.hostname)||!location.hostname}catch(e){return true}}
async function api(path,opt={}){
 const ctl=window.AbortController?new AbortController():null;const t=setTimeout(()=>ctl&&ctl.abort(),opt.timeout||12000);
 try{const h={'content-type':'application/json'};if(opt.token)h.authorization='Bearer '+opt.token;const r=await fetch('/.netlify/functions/'+path,{method:opt.method||'GET',body:opt.body,signal:ctl&&ctl.signal,cache:'no-store',headers:h});const j=await r.json().catch(()=>({}));return{ok:r.ok,status:r.status,data:j||{}}}
 catch(e){return{ok:false,status:0,data:{}}}finally{clearTimeout(t)}
}
async function detectPay(){
 if(CONFIG.metodo==='codigo'){PAY.mode='code';return}
 if(isDemoHost()){PAY.mode='demo';return}
 PAY.mode='checking';
 const r=await api('pix-config',{timeout:8000});
 if(r.ok&&r.data.real){PAY.mode='real';if(r.data.price)PAY.price=Number(r.data.price)}
 else if(CONFIG.metodo==='auto')PAY.mode='code';
 else PAY.mode=r.ok?'off':'error';
}
async function syncAccess(u){
 if(CONFIG.metodo==='codigo'||PAY.mode!=='real'||!u||u.paid)return false;
 const r=await api('pix-access?email='+encodeURIComponent(u.email));
 if(r.ok&&r.data.paid){u.paid=true;u.payMethod='pix';u.payDate=u.payDate||today();u.pix=null;save();return true}
 return false;
}

 prayers:['Senhor, que a minha alegria aponte para ti hoje.','Pai, guarda a minha boca e me ensina a ouvir antes de falar.','Jesus, me ajuda a terminar o que eu comecei com amor.','Espírito Santo, dá raízes profundas à minha fé.','Senhor, usa as minhas palavras para encorajar alguém hoje.','Pai, que eu seja constante mesmo quando a emoção passar.','Jesus, obrigada pela alegria que vem de ti.'],
 phrases:['Sua alegria é uma forma de servir.','Encorajar alguém hoje também é obra de Deus.','Constância transforma entusiasmo em fruto.','Antes de falar, respire e ore por um segundo.','Termine uma coisinha hoje e celebre.','Deus ama o seu riso.','Sua voz pode ser abrigo para alguém hoje.'],
 chars:[{n:'Pedro',ref:'Mateus 14:28-31; João 21:15-17',story:'Pedro pediu para andar sobre as águas, deu os primeiros passos e afundou quando olhou para o vento. Depois prometeu nunca negar Jesus e negou três vezes. Mesmo assim, Jesus o restaurou perguntando três vezes: "Você me ama?".',lesson:'Mostra traços sanguíneos: coragem e impulso. A lição é que Jesus não desiste de corações impulsivos: ele os transforma em rocha.'},
  {n:'A mulher samaritana',ref:'João 4:28-30, 39',story:'Depois de conversar com Jesus no poço, ela deixou o cântaro e correu para a cidade dizendo: "Venham ver um homem que me disse tudo o que tenho feito". Muitos creram por causa do seu testemunho.',lesson:'Lembra o temperamento sanguíneo: comunicação espontânea. A lição é que a sua história, entregue a Jesus, vira testemunho.'},
  {n:'Miriã',ref:'Êxodo 15:20-21; Números 12',story:'Depois da travessia do mar, Miriã pegou o tamborim e liderou as mulheres em louvor e dança. Em outro momento, falou contra Moisés e precisou ser corrigida por Deus.',lesson:'Mostra traços sanguíneos: alegria que contagia e palavras rápidas. A lição é que a mesma boca que louva precisa aprender a guardar as palavras.'}],
 themes:[{t:'Constância com Deus',d:'Escolha um horário fixo de oração e mantenha por 7 dias.',txt:'d12'},{t:'Palavras que edificam',d:'Antes de comentar algo, pergunte: isso edifica?',txt:'d7'},{t:'Terminar o que começou',d:'Escolha um projeto parado e dê o próximo passo.',txt:'d12'},{t:'Profundidade',d:'Leia um capítulo da Bíblia devagar e anote uma frase.',txt:'d15'}],
 why:'Combina com seu jeito sanguíneo:',
 check:{orei:'Orar enquanto caminho, conversando com Deus',li:'Ler um salmo de louvor em voz alta',servi:'Mandar uma mensagem de encorajamento',agradeci:'Agradecer em voz alta por 3 pessoas'}},
{id:'colerica',key:'C',name:'Colérica',traits:'Coléricos',title:'Coragem que Lidera',color:'#C47A5F',
 palette:['#C47A5F','#3A2E28','#EBC2B2','#E8B04A'],
 short:'Determinada, prática e corajosa: você faz as coisas acontecerem.',
 desc:['Quando todos ainda estão pensando, você já está agindo. Você enxerga o objetivo, organiza as pessoas e não desiste diante do primeiro obstáculo. No meio cristão, esse jeito costuma ser chamado de temperamento colérico.',
  'Sua coragem é um presente para a igreja, para a família e para o trabalho. Muitos ministérios existem porque alguém como você teve iniciativa. Mas a mesma força que move montanhas pode atropelar pessoas, e a pressa pode deixar pouco espaço para ouvir, descansar e esperar em Deus.',
  'Seu desafio é unir firmeza e mansidão. Liderar como Jesus é servir, não controlar. E descansar não é perder tempo: é confiar que o resultado está nas mãos de Deus.',
  'Paulo, que perseguia a igreja com zelo e depois se tornou o apóstolo mais incansável, mostra que Deus não apaga a sua determinação: ele a direciona.'],
 forces:['Liderança natural','Determinação diante de obstáculos','Iniciativa para começar','Praticidade para resolver'],
 challenges:['Impaciência com o ritmo dos outros','Querer controlar tudo e todos','Dificuldade de descansar e de pedir ajuda'],
 fruit:{n:'Paciência, mansidão e amor',t:'O Espírito Santo transforma a sua força em força com ternura. A paciência ajuda você a respeitar o tempo dos outros e o tempo de Deus. A mansidão não é fraqueza: é força sob controle. E o amor lembra que as pessoas valem mais do que as metas.'},
 verses:[{r:'Mateus 11:29',t:'Aprendam de mim, pois sou manso e humilde de coração, e vocês encontrarão descanso para as suas almas.'},{r:'Provérbios 16:32',t:'Melhor é o homem paciente do que o guerreiro, mais vale controlar o seu espírito do que conquistar uma cidade.'},{r:'Provérbios 16:9',t:'Em seu coração o homem planeja o seu caminho, mas o Senhor determina os seus passos.'},{r:'Salmos 46:10',t:'Parem de lutar! Saibam que eu sou Deus!'},{r:'Filipenses 3:13-14',t:'Esquecendo-me das coisas que ficaram para trás e avançando para as que estão adiante, prossigo para o alvo.'},{r:'1 Coríntios 13:4',t:'O amor é paciente, o amor é bondoso.'},{r:'Colossenses 3:23',t:'Tudo o que fizerem, façam de todo o coração, como para o Senhor.'}],
 prayers:['Senhor, que a minha força sirva às pessoas e não as atropele.','Pai, me ensina a descansar confiando em ti.','Jesus, me dá paciência com quem caminha em outro ritmo.','Espírito Santo, guarda a minha boca de palavras duras.','Senhor, que os meus planos se alinhem aos teus.','Pai, me ajuda a pedir ajuda sem orgulho.','Jesus, que eu lidere servindo, como tu.'],
 phrases:['Força com mansidão é força de Cristo.','Descansar também é obediência.','Pessoas valem mais do que metas.','Peça ajuda hoje: isso é sabedoria.','Seus planos ficam melhores nas mãos de Deus.','Uma palavra gentil abre portas que a pressa fecha.','Você não precisa provar nada a ninguém.'],
 chars:[{n:'Paulo',ref:'Atos 9; Filipenses 3:13-14; 2 Timóteo 4:11',story:'Paulo perseguia os cristãos com zelo até encontrar Jesus no caminho para Damasco. Depois viajou, plantou igrejas e escreveu cartas. Chegou a se separar de Barnabé por causa de Marcos e, anos depois, pediu: "Traga Marcos, porque ele me é útil".',lesson:'Mostra traços coléricos: zelo, foco e firmeza. A lição é que Deus redireciona a determinação e ensina a liderar com graça e reconciliação.'},
  {n:'Débora',ref:'Juízes 4-5',story:'Débora era profetisa e julgava Israel debaixo de uma palmeira. Chamou Baraque para a batalha e, quando ele hesitou, respondeu: "Irei com você". Depois da vitória, cantou louvores a Deus.',lesson:'Lembra o temperamento colérico: coragem e liderança. A lição é que a liderança dela era cheia de fé e dava os créditos a Deus.'},
  {n:'Marta',ref:'Lucas 10:38-42; João 11:20-27',story:'Marta recebeu Jesus em casa e se agitou com tantas tarefas que reclamou da irmã. Jesus respondeu com carinho que só uma coisa era necessária. Mais tarde, foi ela quem correu ao encontro de Jesus e declarou: "Eu tenho crido que tu és o Cristo, o Filho de Deus".',lesson:'Mostra traços coléricos: praticidade e iniciativa. A lição é que servir é lindo, mas estar com Jesus vem primeiro.'}],
 themes:[{t:'Descanso que é fé',d:'Separe um período desta semana sem produtividade, só para estar com Deus.',txt:'d5'},{t:'Força com mansidão',d:'Responda a uma situação difícil com calma, antes de agir.',txt:'d7'},{t:'Soltar o controle',d:'Entregue a Deus, em oração, algo que você não controla.',txt:'d11'},{t:'Liderar servindo',d:'Ajude alguém num projeto que não é seu.',txt:'d14'}],
 why:'Combina com seu jeito colérico:',
 check:{orei:'Entregar a Deus a minha lista do dia',li:'Ler um capítulo de Provérbios',servi:'Ajudar alguém num projeto que não é meu',agradeci:'Agradecer por algo que não dependeu de mim'}},
{id:'melancolica',key:'M',name:'Melancólica',traits:'Melancólicos',title:'Profundidade que Adora',color:'#8FA5B8',
 palette:['#A8B8A0','#8FA5B8','#EAE2D9','#3A2E28'],
 short:'Sensível, profunda e detalhista: você sente e pensa com o coração inteiro.',
 desc:['Você percebe o que quase ninguém vê: um olhar triste, uma palavra fora do lugar, a beleza escondida numa letra de louvor. Você ama com profundidade, é fiel aos seus valores e faz tudo com capricho. No meio cristão, esse jeito costuma ser chamado de temperamento melancólico.',
  'Sua sensibilidade torna você uma intercessora natural, uma amiga leal e, muitas vezes, uma artista. Você precisa de tempo e silêncio para processar a vida. O outro lado é que essa mesma profundidade pode virar autocrítica, perfeccionismo e tristeza guardada.',
  'Seu desafio é receber a graça. Deus não espera perfeição de você: ele já a ama inteira. A alegria e a paz do Espírito Santo podem iluminar os lugares onde a sua mente costuma ver só o que falta.',
  'Moisés, que se achava incapaz de falar, e Ana, que derramou a alma em oração, mostram que Deus usa corações sensíveis de maneiras poderosas.'],
 forces:['Sensibilidade e empatia profundas','Fidelidade e lealdade','Organização e capricho','Criatividade e senso de beleza'],
 challenges:['Perfeccionismo e autocrítica','Tristeza e pessimismo nos dias difíceis','Guardar mágoas por muito tempo'],
 fruit:{n:'Alegria e paz',t:'O Espírito Santo não tira a sua profundidade: ele a enche de luz. A alegria lembra que a sua história não termina na tristeza. A paz acalma a mente que pensa demais e ensina você a descansar na graça, e não na perfeição.'},
 verses:[{r:'Salmos 139:14',t:'Eu te louvo porque me fizeste de modo especial e admirável.'},{r:'2 Coríntios 12:9',t:'Minha graça é suficiente a você, pois o meu poder se aperfeiçoa na fraqueza.'},{r:'Salmos 34:18',t:'O Senhor está perto dos que têm o coração quebrantado e salva os de espírito abatido.'},{r:'Filipenses 4:6-7',t:'Não andem ansiosos por coisa alguma, mas em tudo, pela oração e súplicas, e com ação de graças, apresentem seus pedidos a Deus.'},{r:'Romanos 8:1',t:'Agora já não há condenação para os que estão em Cristo Jesus.'},{r:'João 14:27',t:'Deixo-lhes a paz; a minha paz lhes dou.'},{r:'Romanos 15:13',t:'Que o Deus da esperança os encha de toda alegria e paz, por sua confiança nele.'}],
 prayers:['Senhor, que a tua graça seja maior do que a minha autocrítica.','Pai, acalma a minha mente e me dá a tua paz.','Jesus, me ajuda a soltar as mágoas que eu guardo.','Espírito Santo, enche de alegria os meus pensamentos hoje.','Senhor, usa a minha sensibilidade para cuidar de alguém.','Pai, eu não preciso ser perfeita para ser amada por ti.','Jesus, obrigada por me fazer de modo especial e admirável.'],
 phrases:['Você não precisa ser perfeita para ser amada.','Sua sensibilidade é um dom, não um defeito.','A graça de Deus cobre o que falta em você.','Hoje, repare em três coisas boas.','Feito com amor vale mais do que perfeito.','Deus escuta até as orações sem palavras.','Sua profundidade é lugar de encontro com Deus.'],
 chars:[{n:'Moisés',ref:'Êxodo 3-4; Números 12:3',story:'Diante da sarça ardente, Moisés perguntou: "Quem sou eu?" e disse que nunca teve facilidade para falar. Deus prometeu estar com ele. Mais tarde, a Bíblia o descreve como um homem muito manso e humilde.',lesson:'Mostra traços melancólicos: insegurança e profundidade. A lição é que Deus usa quem se sente incapaz, porque a força vem dele.'},
  {n:'Ana',ref:'1 Samuel 1:10-18',story:'Ana sofria por não ter filhos e era provocada. No templo, orou em silêncio, só mexendo os lábios, a ponto de o sacerdote achar que estava embriagada. Ela explicou que estava derramando a alma diante do Senhor. Depois daquela oração, seu rosto já não estava triste.',lesson:'Lembra o temperamento melancólico: dor profunda e oração intensa. A lição é que entregar a dor a Deus traz paz antes mesmo da resposta.'},
  {n:'Ester',ref:'Ester 4:14-16',story:'Diante de uma ameaça ao seu povo, Ester não agiu por impulso: pediu três dias de jejum, planejou com sabedoria e só então foi até o rei, dizendo: "Se eu tiver que morrer, morrerei".',lesson:'Mostra traços melancólicos: cautela e planejamento. A lição é que a prudência, somada à fé, vira coragem.'},
  {n:'Elias',ref:'1 Reis 19:4-8',story:'Depois de uma grande vitória, Elias ficou exausto e desanimado a ponto de pedir para morrer. Deus não o repreendeu: deixou-o dormir, mandou comida e disse: "Levante-se e coma, pois a sua viagem será muito longa".',lesson:'Lembra o temperamento melancólico: altos e baixos emocionais. A lição é que Deus cuida do corpo e da alma cansada com ternura.'}],
 themes:[{t:'Graça, não perfeição',d:'Faça algo bem feito, mas não perfeito, e entregue.',txt:'d3'},{t:'Ansiedade entregue a Deus',d:'Escreva suas preocupações e ore por cada uma.',txt:'d2'},{t:'Soltar mágoas',d:'Ore por alguém que te feriu, mesmo que com poucas palavras.',txt:'d8'},{t:'Gratidão que ilumina',d:'Anote três motivos de gratidão todas as noites.',txt:'d16'}],
 why:'Combina com seu jeito melancólico:',
 check:{orei:'Escrever uma oração no meu diário',li:'Ler um salmo devagar e meditar',servi:'Orar por alguém que está sofrendo',agradeci:'Anotar 3 coisas bonitas de hoje'}},
{id:'fleumatica',key:'F',name:'Fleumática',traits:'Fleumáticos',title:'Paz que Sustenta',color:'#A8B8A0',
 palette:['#A8B8A0','#C9D5C3','#F7F3EE','#3A2E28'],
 short:'Calma, leal e pacificadora: você é porto seguro para quem está por perto.',
 desc:['Você é aquela presença tranquila que acalma o ambiente. Ouve sem julgar, evita brigas, cumpre o que promete e está sempre lá. As pessoas confiam em você porque você é constante. No meio cristão, esse jeito costuma ser chamado de temperamento fleumático.',
  'Sua paz é um presente raro num mundo apressado. Você serve sem precisar de holofote e mantém a unidade nos grupos. Mas, para evitar conflitos, pode guardar o que sente, adiar decisões e deixar de usar os dons que Deus colocou em você.',
  'Seu desafio é sair da zona de conforto com fé. Deus quer usar a sua calma, mas também a sua voz e a sua iniciativa. A fidelidade que você já tem pode florescer em bondade ativa.',
  'Abraão, que saiu sem saber para onde ia, e Rute, que permaneceu fiel quando tudo era incerto, mostram que corações constantes podem dar grandes passos de fé.'],
 forces:['Calma que acalma','Lealdade e constância','Escuta paciente','Dom de pacificar'],
 challenges:['Passividade e medo de mudanças','Procrastinação nas decisões','Dificuldade de dizer o que sente'],
 fruit:{n:'Fidelidade com iniciativa e bondade ativa',t:'O Espírito Santo transforma a sua constância em fidelidade que age. Bondade não é só não fazer mal: é ir até o outro. Deus dá coragem para você falar, decidir e dar o próximo passo, sem perder a paz que é a sua marca.'},
 verses:[{r:'Isaías 41:10',t:'Por isso não tema, pois estou com você; não tenha medo, pois sou o seu Deus.'},{r:'Josué 1:9',t:'Seja forte e corajoso! Não se apavore nem desanime, pois o Senhor, o seu Deus, estará com você por onde você andar.'},{r:'2 Timóteo 1:7',t:'Pois Deus não nos deu espírito de covardia, mas de poder, de amor e de equilíbrio.'},{r:'Mateus 5:9',t:'Bem-aventurados os pacificadores, pois serão chamados filhos de Deus.'},{r:'Salmos 37:7',t:'Descanse no Senhor e aguarde por ele com paciência.'},{r:'Tiago 2:17',t:'A fé, por si só, se não for acompanhada de obras, está morta.'},{r:'Isaías 40:31',t:'Aqueles que esperam no Senhor renovam as suas forças.'}],
 prayers:['Senhor, me dá coragem para dar o próximo passo hoje.','Pai, me ajuda a falar o que sinto com amor.','Jesus, que a minha paz seja ativa e generosa.','Espírito Santo, me tira da zona de conforto com fé.','Senhor, obrigada pela calma que vem de ti.','Pai, me ensina a decidir sem medo de errar.','Jesus, usa a minha constância para abençoar alguém.'],
 phrases:['Sua paz é um presente para quem está perto.','Um pequeno passo de fé hoje já é muito.','Sua voz também importa.','Fidelidade é bonita quando vira ação.','Decida uma coisa pendente hoje.','Deus está com você no próximo passo.','Pacificar é diferente de se calar.'],
 chars:[{n:'Abraão',ref:'Gênesis 12:1-4; 13:8-9; Hebreus 11:8',story:'Abraão saiu da sua terra sem saber para onde ia, apenas confiando em Deus. Em um conflito com o sobrinho Ló, deixou que ele escolhesse a terra primeiro, para manter a paz. Também teve momentos de medo, mas aprendeu a confiar.',lesson:'Mostra traços fleumáticos: paciência e espírito pacificador. A lição é que a fé tranquila também sabe dar passos ousados.'},
  {n:'Rute',ref:'Rute 1:16-17; 2:2-3',story:'Depois de perder o marido, Rute decidiu ficar com a sogra Noemi: "Aonde você for, irei; o seu povo será o meu povo e o seu Deus será o meu Deus". Trabalhou com humildade nos campos e foi reconhecida como mulher de valor.',lesson:'Lembra o temperamento fleumático: lealdade e constância. A lição é que a fidelidade silenciosa é vista e honrada por Deus.'},
  {n:'Maria de Betânia',ref:'Lucas 10:39; João 12:3',story:'Enquanto a irmã se agitava, Maria sentou-se aos pés de Jesus para ouvi-lo. Mais tarde, derramou um perfume caro sobre ele, num gesto de adoração.',lesson:'Mostra traços fleumáticos: calma e presença. A lição é que estar aos pés de Jesus é a "boa parte" que ninguém tira de você.'},
  {n:'Abigail',ref:'1 Samuel 25',story:'Quando o marido insensato ofendeu Davi, Abigail agiu rápido: levou provisões, falou com sabedoria e evitou uma tragédia. Davi louvou a Deus e reconheceu o bom senso dela.',lesson:'Lembra o temperamento fleumático no melhor sentido: uma pacificadora com iniciativa. A lição é que buscar a paz às vezes exige agir.'}],
 themes:[{t:'Um passo de fé',d:'Escolha uma decisão que você vem adiando e dê o primeiro passo.',txt:'d12'},{t:'Sua voz importa',d:'Diga com carinho algo que você sente e costuma guardar.',txt:'d6'},{t:'Bondade ativa',d:'Faça um gesto concreto de cuidado por alguém.',txt:'d10'},{t:'Coragem para servir',d:'Ofereça um dom seu na igreja ou em casa.',txt:'d10'}],
 why:'Combina com seu jeito fleumático:',
 check:{orei:'5 minutos de oração em silêncio',li:'Ler um capítulo dos Evangelhos',servi:'Dar um passo de serviço que eu vinha adiando',agradeci:'Agradecer a alguém pessoalmente'}}
];

const TEMP_NOTE='Os 4 temperamentos são uma ferramenta antiga de autoconhecimento, popularizada no meio cristão por Tim LaHaye e Florence Littauer. Não são verdade bíblica nem científica: são um mapa simples para você se observar e crescer com Deus.';
