 metas:()=>{ui.editGoal=null;ui.goalDraft='';metasModal()},
 goalType:el=>{const i=$('#goalT');if(i)ui.goalDraft=i.value;ui.goalType=el.dataset.v;refreshModal()},
 goalEditType:el=>{const i=LAYER().querySelector('form[data-form="goalEdit"] input');const u=U();const g=u.goals.find(x=>x.id===ui.editGoal);if(g&&i)ui.goalEditDraft=i.value;ui.goalEditType=el.dataset.v;refreshModal();const i2=LAYER().querySelector('form[data-form="goalEdit"] input');if(i2&&ui.goalEditDraft!=null)i2.value=ui.goalEditDraft},
 toggleGoal:el=>{const u=U();const g=u.goals.find(x=>x.id===el.dataset.id);if(!g)return;g.done=!g.done;
  if(g.done){sfx('ok');if(!g.xp){g.xp=true;addXP(10)}markActive();checkAch();toast(`${ic('target',18)} ${g.type} cumprid${g.type==='Meta'?'a':'o'}!`)}else sfx('tap');
  save();refreshModal();render()},
 editGoal:el=>{const u=U();const g=u.goals.find(x=>x.id===el.dataset.id);if(!g)return;ui.editGoal=g.id;ui.goalEditType=g.type;ui.goalEditDraft=null;refreshModal()},
 cancelEditGoal:()=>{ui.editGoal=null;refreshModal()},
 delGoal:el=>{const u=U();const g=u.goals.find(x=>x.id===el.dataset.id);if(!g)return;
  confirmBox({title:'Excluir meta?',text:`“${esc(g.t)}” vai sair da sua lista.`,ok:'Excluir',danger:true,onOk:()=>{u.goals=u.goals.filter(x=>x.id!==g.id);save();render();metasModal();toast('Excluída.')}})},
 editPrefs:()=>{closeModal();ui.prefs=null;go('personalizacao')},
 seeResult:()=>go('resultado'),
 retake:()=>confirmBox({title:'Refazer o teste?',text:'Suas respostas e seu perfil atual serão substituídos. Pagamento, checklist, boards, metas e favoritos continuam salvos.',ok:'Refazer teste',cancel:'Agora não',mood:'think',onOk:()=>{const u=U();u.answers=Array(N_Q).fill(null);u.testDone=false;u.profile=null;u.profile2=null;u.scores={};u.resultSeen=false;ui.q=0;save();go('teste')}}),
 editProfile:()=>profileModal(),
 toggleSound:()=>{const u=U();u.sound=!u.sound;save();render();if(u.sound)sfx('ok');toast(u.sound?'Sons e vibração ligados.':'Sons e vibração desligados.')},
 achInfo:el=>{const u=U();const a=ACH.find(x=>x.id===el.dataset.id);if(!a)return;const on=u.ach.includes(a.id);
  openModal(()=>`<div class="text-center"><div class="flex justify-center"><span class="badge-ic" style="width:96px;height:96px${on?'':';filter:grayscale(1);opacity:.5'}">${ic(on?a.ic:'lock',52,on?'':'c-gray')}</span></div><h2 class="h1 mt-4">${a.n}</h2><p class="muted mt-2">${on?'Desbloqueada! ':'Para desbloquear: '}${a.d}</p></div><button class="btn btn-primary mt-6" data-act="closeModal">Entendi</button>`,{center:true})},
 shareStreak:async el=>{const n=el.dataset.n;const txt=`Estou há ${n} dias seguidos cuidando de mim no Orivie - Sua Personalidade!`;
  try{if(navigator.share){await navigator.share({title:'Orivie - Sua Personalidade',text:txt});return}}catch(e){if(e&&e.name==='AbortError')return}
  const ok=await copyText(txt);toast(ok?'Texto copiado para compartilhar!':'Não consegui compartilhar agora.')}
};

/* =========================================================
   EVENTOS GLOBAIS
   ========================================================= */
document.addEventListener('click',e=>{
 if(e.target.matches&&e.target.matches('[data-backdrop]')){if(ui.modal&&!ui.modal.lock)closeModal();return}
 const el=e.target.closest('[data-act]');
 if(!el||el.disabled)return;
 const fn=ACT[el.dataset.act];
 if(fn){try{fn(el,e)}catch(err){console.error(err);toast('Opa! Tenta de novo?')}}
});
document.addEventListener('submit',e=>{const f=e.target;const k=f.dataset&&f.dataset.form;if(!k||!FORMS[k])return;e.preventDefault();try{const r=FORMS[k](f);if(r&&r.catch)r.catch(err=>{console.error(err);toast('Opa! Tenta de novo?')})}catch(err){console.error(err)}});
document.addEventListener('input',e=>{
 const el=e.target;if(el.dataset.mask)mask(el);
 if(el.classList.contains('bad')){el.classList.remove('bad');const er=el.parentElement&&el.parentElement.querySelector('.err');if(er)er.textContent=''}
 const k=el.dataset.in;if(!k)return;const u=U();if(!u)return;
 if(k==='note'){const it=u.checklist&&u.checklist.items.find(i=>i.id===el.dataset.id);if(it){it.note=el.value.slice(0,200);save()}}
 const redraw=()=>{clearTimeout(ui.bt);ui.bt=setTimeout(()=>{const c=$('#bprev');if(c)drawBoard(c,{...u[BK()],kind:bkind()})},220)};
 if(k==='bgrat'){const b=u[BK()];if(!Array.isArray(b.grat))b.grat=['','',''];b.grat[+el.dataset.i]=el.value.slice(0,40);save();redraw()}
 if(k==='bgoal'){const b=u[BK()];if(!Array.isArray(b.goals))b.goals=['','',''];b.goals[+el.dataset.i]=el.value.slice(0,44);save();redraw()}
 if(k==='bphrase'){u[BK()].phrase=el.value.slice(0,90);save();redraw()}
 if(k==='btitle'){u[BK()].title=el.value.slice(0,40);save();redraw()}
 if(k==='tnote'){const id=el.dataset.id;if(el.value.trim())u.notes[id]=el.value.slice(0,1000);else delete u.notes[id];save()}
});
document.addEventListener('change',async e=>{
 const el=e.target;const kind=el.dataset&&el.dataset.file;if(!kind)return;
 const u=U();if(!u)return;const files=[...(el.files||[])];el.value='';if(!files.length)return;
 if(kind==='board'){
  const b=u[BK()];const before=b.photos.length;const room=BOARD_MAX-before;
  if(files.length>room)toast(`Cabem mais ${room} imagem${room===1?'':'ns'} neste board.`);
  let fails=0;
  for(const f of files.slice(0,Math.max(0,room))){const d=await compress(f,720,.7);if(d)b.photos.push(d);else fails++}
  if(fails)toast('Não consegui abrir uma das imagens.');
  if(!save()){b.photos=b.photos.slice(0,before);LS.set(K_USERS,DB.users)}else if(b.photos.length>before)sfx('ok');
  render();
 }
 if(kind==='exp'){
  const x=u.exps.find(e=>e.id===el.dataset.id);if(!x)return;const d=await compress(files[0],720,.72);
  if(!d){toast('Não consegui abrir essa imagem.');return}
  const old=x.photo;x.photo=d;if(!save()){x.photo=old;toast('Sem espaço para mais fotos. Apague algumas antigas.')}else{sfx('ok');refreshModal();render()}
 }
 if(kind==='avatar'){
  const d=await compress(files[0],320,.82);
  if(!d){toast('Não consegui abrir essa imagem.');return}
  const old=u.photo;u.photo=d;if(!save()){u.photo=old;LS.set(K_USERS,DB.users)}else{sfx('ok');toast('Foto atualizada!')}
  render();
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&ui.modal&&!ui.modal.lock){closeModal();return}
 if(route()!=='teste'||ui.modal)return;
 const tag=(e.target&&e.target.tagName)||'';if(tag==='INPUT'||tag==='TEXTAREA')return;
 let idx='12345'.indexOf(e.key);if(idx<0)idx='ABCDE'.indexOf(String(e.key).toUpperCase());
 if(idx>=0&&e.key.length===1){e.preventDefault();pickAnswer('ABCDE'[idx]);return}
 if(e.key==='Enter'&&tag!=='BUTTON'){const b=$('[data-act="qNext"]');if(b&&!b.disabled){e.preventDefault();b.click()}}
});
window.addEventListener('hashchange',()=>{let h='';try{h=location.hash}catch(e){}if(ui.ownHash&&h===ui.ownHash){ui.ownHash=null;return}ui.ownHash=null;const r=hashRoute();if(r===ui.route)return;if(ui.modal&&!ui.modal.lock)closeModal();ui.route=r;render()});
window.addEventListener('storage',e=>{if(e.key===K_USERS||e.key===K_SESSION){loadDB();render()}});

/* =========================================================
   INÍCIO
   ========================================================= */
try{loadDB()}catch(e){DB={users:{},session:null}}
function watchBadge(){const check=()=>{try{document.body.classList.toggle('nl-badge-on',!!document.getElementById('nl-badge-frame'))}catch(e){}};check();try{new MutationObserver(check).observe(document.body,{childList:true})}catch(e){}}
watchBadge();
ui.route=hashRoute();
PAY.mode=CONFIG.metodo==='codigo'?'code':isDemoHost()?'demo':'checking';
ui.cloudReady=detectCloud().then(on=>{if(on)return refreshCloud()}).catch(()=>{});
render();
detectPay().then(async()=>{const u=U();if(u&&await syncAccess(u)){go(stepFor(u));return}if(route()==='pagamento')render()});
</script>
