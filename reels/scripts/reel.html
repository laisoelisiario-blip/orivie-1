<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Orivie Reels</title>
<style>
@font-face{font-family:Playfair;src:url(../assets/fonts/PlayfairDisplay-normal.woff2) format("woff2");font-style:normal;font-weight:400 900}
@font-face{font-family:Playfair;src:url(../assets/fonts/PlayfairDisplay-italic.woff2) format("woff2");font-style:italic;font-weight:400 900}
@font-face{font-family:DMSans;src:url(../assets/fonts/DMSans-normal.woff2) format("woff2");font-weight:100 1000}
:root{
  --creme:#F7F3EE; --bege:#EAE2D9; --bege-sh:#D5C8BA; --branco:#FFFFFF; --texto:#3A2E28; --muted:#75655B;
  --salvia:#A8B8A0; --salvia-dk:#4F6249; --salvia-sh:#879A7E; --salvia-lt:#EDF1EA;
  --terra:#D9A08B; --terra-dk:#94553F; --terra-sh:#B97F6A; --terra-lt:#F8EAE3;
  --salvia-clara:#C9D6C1; --salvia-esc:#4F6249; --marrom-esc:#3A2E28; --marrom:#75655B;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#2a211b}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.abs{position:absolute}

/* ---------- CENA 1: luz da janela ---------- */
#s1{background:linear-gradient(170deg,#d9c8b3 0%,#cdb79e 45%,#a98d74 100%)}
#s1 .wall{position:absolute;inset:-80px}
#s1 .beam{position:absolute;left:-200px;top:-300px;width:1500px;height:2600px;
  background:linear-gradient(115deg,rgba(255,240,215,0) 25%,rgba(255,238,210,.55) 42%,rgba(255,236,205,.18) 60%,rgba(255,240,215,0) 75%);
  filter:blur(30px);mix-blend-mode:screen}
#s1 .panes{position:absolute;left:250px;top:330px;width:760px;height:1100px;transform:skewY(-14deg) rotate(-4deg);filter:blur(18px)}
#s1 .pane{position:absolute;background:rgba(255,242,222,.62);border-radius:6px}
#s1 .curtain{position:absolute;inset:-100px;background:repeating-linear-gradient(90deg,rgba(255,255,255,0) 0 60px,rgba(255,250,240,.10) 90px,rgba(255,255,255,0) 140px);filter:blur(14px);mix-blend-mode:soft-light}
#s1 .plant{position:absolute;left:-120px;bottom:180px;width:560px;height:900px;filter:blur(22px);opacity:.55}
.dust{position:absolute;border-radius:50%;background:rgba(255,246,228,.9)}

/* ---------- CENA 2: espelho ---------- */
#s2{background:radial-gradient(120% 80% at 50% 40%,#b8a490 0%,#8c7562 55%,#5d4a3d 100%)}
#s2 .mirror{position:absolute;left:190px;top:400px;width:700px;height:1000px;border-radius:50%;
  box-shadow:0 40px 120px rgba(40,25,15,.55), inset 0 0 0 10px #b89a72, inset 0 0 0 14px #8a6f50, inset 0 0 120px rgba(255,255,255,.25);
  overflow:hidden;background:radial-gradient(90% 70% at 40% 30%,#efe3d4,#cdbba6 60%,#9f8a76)}
#s2 .ghost{position:absolute;left:50%;top:52%;width:380px;height:560px;margin:-280px 0 0 -190px;border-radius:50% 50% 44% 44%;
  background:radial-gradient(60% 50% at 50% 35%,rgba(110,85,68,.55),rgba(110,85,68,0) 70%);filter:blur(10px)}
#s2 .glint{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.35) 48%,rgba(255,255,255,0) 60%)}

/* ---------- CENA 3: diário e café ---------- */
#s3{background:#d8c7b2}
#s3 .table{position:absolute;inset:-60px;background:
  radial-gradient(70% 60% at 50% 45%,rgba(255,250,240,.55),rgba(255,250,240,0) 70%),
  repeating-linear-gradient(92deg,#c7ae92 0 3px,#cbb398 3px 9px,#c2a88b 9px 14px)}
#s3 .journal{position:absolute;left:150px;top:420px;width:800px;height:1040px;border-radius:10px;transform:rotate(-6deg);
  background:linear-gradient(90deg,#efe5d6 0,#f8f2e8 6%,#faf6ef 100%);box-shadow:0 30px 70px rgba(70,45,25,.35)}
#s3 .lines{position:absolute;inset:120px 60px 60px 90px;background:repeating-linear-gradient(180deg,transparent 0 78px,rgba(140,160,170,.28) 78px 80px)}
#s3 .hand{position:absolute;left:96px;font-family:Playfair;font-style:italic;font-size:62px;color:#4a3b30;white-space:nowrap;overflow:hidden}
#s3 .pen{position:absolute;width:24px;height:520px;border-radius:12px;background:linear-gradient(90deg,#2f2722,#5b4a3e 50%,#2f2722);transform-origin:50% 100%;box-shadow:12px 20px 30px rgba(60,40,20,.35)}
#s3 .cup{position:absolute;right:-150px;top:120px;width:470px;height:470px;border-radius:50%;
  background:radial-gradient(circle,#4a2f20 0 46%,#6b4530 52%,#f4ede4 54%,#fffaf3 66%,#e8ddd0 72%,rgba(0,0,0,0) 73%);
  box-shadow:-20px 30px 60px rgba(60,35,20,.35);filter:blur(5px)}
#s3 .steam{position:absolute;width:90px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(255,255,255,0));filter:blur(18px)}
#s3 .dof{position:absolute;inset:0;backdrop-filter:blur(9px);-webkit-mask-image:radial-gradient(60% 45% at 50% 52%,transparent 55%,#000 100%);mask-image:radial-gradient(60% 45% at 50% 52%,transparent 55%,#000 100%)}

/* ---------- CENA 4: app ---------- */
#s4{background:radial-gradient(110% 80% at 50% 30%,#FBF8F4 0%,#F1E8DE 55%,#E3D3C3 100%)}
.shot{position:absolute;left:0;top:46px;width:100%;opacity:0}
#screen{background:#F7F3EE!important}
.status{position:absolute;left:0;right:0;top:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:6px 40px 0 44px;font-family:DMSans;font-weight:600;font-size:17px;color:#3A2E28;z-index:4}
.status .sb{display:flex;gap:4px}.status .sb i{display:block;width:18px;height:10px;border-radius:3px;background:#3A2E28}
#tap{position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(79,98,73,.25);opacity:0;z-index:6}
#s4 .orb{position:absolute;border-radius:50%;filter:blur(60px)}
#phone{position:absolute;left:300px;top:350px;width:480px;height:1052px;border-radius:84px;background:#1d1a17;padding:16px;
  box-shadow:0 60px 120px rgba(90,60,40,.32),0 0 0 2px #3a332d inset}
#phone .screen{position:relative;width:100%;height:100%;border-radius:70px;overflow:hidden;background:var(--branco)}
#phone .notch{position:absolute;left:50%;top:18px;width:150px;height:40px;margin-left:-75px;border-radius:20px;background:#111;z-index:5}
.app{position:absolute;inset:0;padding:96px 38px 40px;font-family:DMSans;color:var(--marrom-esc)}
.app .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.app .logo{font-family:Playfair;font-weight:500;letter-spacing:7px;font-size:30px;color:var(--marrom-esc)}
.app .dot{width:44px;height:44px;border-radius:50%;background:var(--salvia-clara)}
.app h3{font-family:Playfair;font-weight:500;font-size:50px;line-height:1.02;margin-bottom:16px}
.app h3 i{color:var(--salvia-esc)}
.app p{font-size:21px;line-height:1.45;color:#7a6657}
.btn{display:block;text-align:center;font-family:DMSans;font-weight:500;font-size:22px;padding:24px;border-radius:40px;background:var(--salvia-esc);color:#fff;margin-top:26px}
.card{border-radius:28px;background:#fff;padding:24px;box-shadow:0 8px 28px rgba(90,70,50,.08);margin-top:18px}
.opt{border:2px solid #e6dccf;border-radius:24px;padding:22px 24px;font-size:22px;margin-top:16px;background:#fff;display:flex;gap:16px;align-items:center}
.opt .r{width:26px;height:26px;border-radius:50%;border:2px solid #cdbfae;flex:none}
.opt.sel{border-color:var(--salvia-esc);background:#f1f5ee}
.opt.sel .r{border:8px solid var(--salvia-esc)}
.prog{height:8px;border-radius:4px;background:#ece3d7;margin:10px 0 30px}
.prog b{display:block;height:100%;border-radius:4px;background:var(--salvia)}
.trait{margin-top:20px;font-size:19px}
.trait .t{display:flex;justify-content:space-between;margin-bottom:8px}
.trait .bg{height:12px;border-radius:6px;background:#ede5da}
.trait .bg b{display:block;height:100%;border-radius:6px;background:var(--salvia)}
.chip{display:inline-block;font-family:DMSans;font-weight:500;font-size:16px;letter-spacing:1px;padding:8px 14px;border-radius:20px;background:#eef2ea;color:var(--salvia-esc);text-transform:uppercase}
.rec{display:flex;gap:18px;align-items:center}
.rec .ic{width:74px;height:74px;border-radius:22px;flex:none}
.rec b{font-family:DMSans;font-weight:500;font-weight:normal;font-size:22px;display:block;margin-bottom:4px}
.rec span{font-size:18px;color:#8a7666}

/* ---------- CENA 5: sol + assinatura ---------- */
#s5a{background:linear-gradient(180deg,#f3d9b0 0%,#e7c393 40%,#b98f68 100%)}
#s5a .sun{position:absolute;width:1400px;height:1400px;border-radius:50%;background:radial-gradient(circle,rgba(255,250,235,1) 0,rgba(255,236,200,.85) 12%,rgba(255,220,170,.25) 35%,rgba(255,210,160,0) 60%)}
#s5a .flare{position:absolute;border-radius:50%;mix-blend-mode:screen}
#s5a .path{position:absolute;left:-100px;right:-100px;bottom:-200px;height:900px;background:linear-gradient(180deg,rgba(140,110,80,0),rgba(120,90,65,.55));filter:blur(10px)}
#s5a .grass{position:absolute;left:-60px;right:-60px;bottom:-40px;height:700px;filter:blur(16px);
  background:radial-gradient(40% 50% at 15% 80%,rgba(130,145,100,.8),transparent 70%),radial-gradient(40% 50% at 85% 85%,rgba(120,138,95,.8),transparent 70%)}
#s5b{background:radial-gradient(90% 60% at 50% 45%,#FBF8F4 0%,#F7F3EE 60%,#EAE2D9 100%)}
#logo{position:absolute;left:50%;top:640px;width:860px;margin-left:-430px}
#tag{position:absolute;left:0;right:0;top:1000px;text-align:center;font-family:Playfair;font-style:italic;font-size:50px;color:var(--texto)}
#cta{position:absolute;left:50%;top:1110px;font-family:DMSans;font-weight:700;font-size:32px;letter-spacing:3px;text-transform:uppercase;color:var(--texto);background:var(--terra);padding:26px 70px;border-radius:24px;box-shadow:0 7px 0 var(--terra-sh)}

/* ---------- Tipografia sobreposta ---------- */
#headline{position:absolute;left:70px;right:70px;top:190px;text-align:center;font-family:Playfair;font-style:italic;font-weight:500;font-size:88px;line-height:1.05;color:#fff;text-shadow:0 4px 40px rgba(50,30,20,.45)}
#headline .w{display:inline-block}
#caption{position:absolute;left:90px;right:150px;top:1430px;text-align:center;font-family:DMSans;font-weight:500;font-size:46px;line-height:1.28;color:#fff;
  text-shadow:0 2px 14px rgba(30,20,12,.55),0 0 2px rgba(30,20,12,.4)}
#caption .w{display:inline-block;white-space:pre}
#caption .hl{color:var(--salvia-clara)}
#caption.dark{color:var(--marrom-esc);text-shadow:none}
#caption.dark .hl{color:var(--salvia-esc)}
#scrim{position:absolute;left:0;right:0;bottom:0;height:580px;pointer-events:none;background:linear-gradient(180deg,rgba(28,18,12,0),rgba(28,18,12,.40) 35%,rgba(28,18,12,.55))}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 85% at 50% 48%,rgba(0,0,0,0) 55%,rgba(30,18,10,.42) 100%)}
#fade{position:absolute;inset:0;background:#1c1510;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1">
    <div class="wall">
      <div class="panes" id="panes"></div>
      <div class="beam"></div>
      <div class="curtain" id="curtain"></div>
      <svg class="plant" viewBox="0 0 560 900"><g fill="#5f6b4c">
        <ellipse cx="160" cy="300" rx="70" ry="210" transform="rotate(-25 160 300)"/><ellipse cx="300" cy="380" rx="60" ry="230" transform="rotate(18 300 380)"/>
        <ellipse cx="200" cy="560" rx="80" ry="200" transform="rotate(-50 200 560)"/><ellipse cx="380" cy="600" rx="60" ry="180" transform="rotate(40 380 600)"/></g></svg>
    </div>
    <div id="dust1"></div>
    <img class="media" data-scene="1">
  </div>

  <div class="scene" id="s2">
    <div class="mirror" id="mirror"><div id="ghosts"></div><div class="glint" id="glint"></div></div>
    <img class="media" data-scene="2">
  </div>

  <div class="scene" id="s3">
    <div class="table" id="table"></div>
    <div class="journal" id="journal">
      <div class="lines"></div>
      <div class="hand" id="h1" style="top:178px">quem eu sou de verdade?</div>
      <div class="hand" id="h2" style="top:338px">o que me faz bem…</div>
      <div class="hand" id="h3" style="top:498px">o que combina comigo</div>
    </div>
    <div class="pen" id="pen"></div>
    <div class="cup" id="cup"></div>
    <div id="steam"></div>
    <div class="dof"></div>
    <img class="media" data-scene="3">
  </div>

  <div class="scene" id="s4">
    <div class="orb" style="left:-260px;top:260px;width:760px;height:760px;background:#F3D9CC"></div>
    <div class="orb" style="right:-280px;bottom:260px;width:780px;height:780px;background:#C9D6C1"></div>
    <div id="phone"><div class="screen" id="screen">
      <div class="status"><span>9:41</span><span class="sb"><i></i><i></i><i></i></span></div><div class="notch"></div>
      <img class="shot" id="a1" src="../assets/app/01-boas-vindas.png">
      <img class="shot" id="a2" src="../assets/app/03-teste-pergunta.png">
      <img class="shot" id="a2b" src="../assets/app/04-teste-selecionada.png">
      <img class="shot" id="a3" src="../assets/app/05-resultado.png">
      <img class="shot" id="a4" src="../assets/app/06-app-combina.png">
      <div id="tap"></div>
    </div></div>
  </div>

  <div class="scene" id="s5a">
    <div class="sun" id="sun"></div>
    <div class="path"></div><div class="grass"></div>
    <div id="flares"></div><div id="bokeh"></div>
    <img class="media" data-scene="5">
  </div>

  <div class="scene" id="s5b">
    <img id="logo" src="../assets/orivie-logo-horizontal.png">
    <div id="tag">Sua personalidade. Seu jeito de viver.</div>
    <div id="cta">Descubra-se</div>
  </div>

  <div id="scrim"></div><div id="vignette"></div>
  <div id="headline"></div>
  <div id="caption"></div>
  <div id="fade"></div>
</div>

<script>
const TL = window.TIMELINE || {captions:[]};
const MEDIA = window.MEDIA || {};
const $ = s => document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const ease=x=>1-Math.pow(1-clamp(x),3);
function rnd(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return (s-1)/2147483646}}

/* janelas de cena (s), com fusão suave nas fronteiras */
const SC={s1:[0,5],s2:[5,11],s3:[11,17],s4:[17,25],s5a:[25,27.4],s5b:[27.4,30.5]};
const XF=0.55;
function alpha(id,t){const[a,b]=SC[id];return Math.min(a===0?1:ss(a-XF/2,a+XF/2,t),ss(b+XF/2,b-XF/2,t))}

/* textos de tela */
const HEAD=[
 {t0:0.9,t1:4.75,html:"Você sabe quem<br>realmente é?",dark:true},
 {t0:5.6,t1:10.75,html:"Tantas versões.<br>Tantas dúvidas.",dark:false},
 {t0:11.6,t1:16.75,html:"Existe muito para<br>descobrir sobre você.",dark:true},
 {t0:17.5,t1:20.9,html:"Conheça o Orivie.",dark:true},
 {t0:21.2,t1:24.75,html:"Descubra sua<br>personalidade.",dark:true},
];
const HL=["exatamente","quem","você","é?","perdendo","si","mesma.","personalidade,","personalidade","sentimentos","combina","Orivie","Orivie.","jeito","novo.","Descubra-se"];
const HLPH=[["quem","você","é?"],["se","perdendo","de","si","mesma."],["personalidade,"],["sentimentos"],["realmente","combina"],["Orivie"],["descobrir","sua","personalidade"],["jeito","novo."],["Descubra-se"],["Orivie."]];

/* ---- construção ---- */
(function build(){
  const p=$("#panes");
  [[0,0],[390,0],[0,560],[390,560]].forEach(([x,y])=>{const d=document.createElement("div");d.className="pane";Object.assign(d.style,{left:x+"px",top:y+"px",width:"360px",height:"530px"});p.appendChild(d)});
  const r=rnd(11),d1=$("#dust1");
  for(let i=0;i<70;i++){const e=document.createElement("div");e.className="dust";const s=2+r()*7;
    Object.assign(e.style,{width:s+"px",height:s+"px",filter:`blur(${r()<.4?3:1}px)`});e.dataset.x=r()*1080;e.dataset.y=r()*1920;e.dataset.v=0.2+r();e.dataset.p=r()*6.28;d1.appendChild(e)}
  const g=$("#ghosts");for(let i=0;i<4;i++){const e=document.createElement("div");e.className="ghost";g.appendChild(e)}
  const st=$("#steam");for(let i=0;i<4;i++){const e=document.createElement("div");e.className="steam";st.appendChild(e)}
  const fl=$("#flares"),r2=rnd(5);
  [[180,"rgba(255,225,180,.35)"],[90,"rgba(200,230,200,.25)"],[260,"rgba(255,210,170,.18)"],[60,"rgba(255,255,255,.35)"]].forEach(([s,c])=>{const e=document.createElement("div");e.className="flare";Object.assign(e.style,{width:s+"px",height:s+"px",background:`radial-gradient(circle,${c},rgba(0,0,0,0) 70%)`});fl.appendChild(e)});
  const bk=$("#bokeh"),r3=rnd(23);for(let i=0;i<26;i++){const e=document.createElement("div");const z=30+r3()*110;e.className="flare";
    Object.assign(e.style,{width:z+"px",height:z+"px",background:"radial-gradient(circle,rgba(255,240,205,.55),rgba(255,230,190,.25) 55%,rgba(0,0,0,0) 72%)",filter:`blur(${r3()*6}px)`});e.dataset.x=r3()*1080;e.dataset.y=600+r3()*1300;e.dataset.v=r3();bk.appendChild(e)}
  for(const [n,src] of Object.entries(MEDIA)){const m=document.querySelector(`.media[data-scene="${n}"]`);if(m){m.src=src;m.style.display="block"}}
})();

function setCaption(t){
  const el=$("#caption");const c=TL.captions.find(c=>t>=c.t0-0.05&&t<c.t1+(c.last?0.4:0.02));
  if(!c){el.innerHTML="";return}
  const words=c.text.split(" ");const span=(c.t1-c.t0)*0.82;let html="";
  // destaque: palavras-chave em verde-sálvia
  const hl=new Set();for(const ph of HLPH){for(let i=0;i+ph.length<=words.length;i++){if(ph.every((w,k)=>words[i+k]===w)){for(let k=0;k<ph.length;k++)hl.add(i+k)}}}
  words.forEach((w,i)=>{const wt=c.t0+span*(i/words.length);const a=ease((t-wt)/0.22);
    html+=`<span class="w${hl.has(i)?" hl":""}" style="opacity:${a};transform:translateY(${(1-a)*14}px)">${w}</span>${i<words.length-1?" ":""}`});
  const out=ss(c.t1+0.0,c.t1-0.15,t);
  el.innerHTML=html;el.style.opacity=c.last?1:out;
  el.className=(t>=27.2||(t>=17.15&&t<25.1))?"dark":"";
}
function setHeadline(t){
  const el=$("#headline");const h=HEAD.find(h=>t>=h.t0-0.01&&t<=h.t1+0.01);
  if(!h){el.style.opacity=0;return}
  const a=ss(h.t0,h.t0+0.9,t)*ss(h.t1,h.t1-0.45,t);
  el.innerHTML=h.html;el.style.opacity=a;el.style.transform=`translateY(${(1-ss(h.t0,h.t0+1.1,t))*22}px)`;el.style.filter=`blur(${(1-ss(h.t0,h.t0+0.8,t))*8}px)`;
  el.style.color=h.dark?"#3A2E28":"#fff";el.style.fontSize=(h.t0>=17?72:80)+"px";el.style.top=(h.t0>=17?150:190)+"px";el.style.textShadow=h.dark?"0 2px 30px rgba(255,250,240,.7)":"";
}
function mediaKB(id,t,a,b){const m=document.querySelector(`#${id} .media`);if(!m||m.style.display!=="block")return;const k=clamp((t-a)/(b-a));m.style.transform=`scale(${1.04+0.07*k}) translate(${-10*k}px,${-14*k}px)`}

window.render=function(t){
  for(const id in SC){$("#"+id).style.opacity=alpha(id,t)}
  /* Cena 1 — câmera empurrando devagar, poeira em câmera lenta */
  const k1=clamp(t/5.5);
  $("#s1 .wall").style.transform=`scale(${1.0+0.07*k1}) translate(${-12*k1}px,${-10*k1}px)`;
  $("#panes").style.opacity=0.85+0.15*Math.sin(t*0.9);
  $("#curtain").style.transform=`translateX(${Math.sin(t*0.7)*30}px)`;
  document.querySelectorAll("#dust1 .dust").forEach(e=>{const v=+e.dataset.v,p=+e.dataset.p;
    const x=(+e.dataset.x+Math.sin(t*0.3*v+p)*40+t*6*v)%1080,y=(+e.dataset.y-t*14*v+1920)%1920;
    const inBeam=clamp(1-Math.abs((x*0.7-y*0.55+380)/420));e.style.transform=`translate(${x}px,${y}px)`;e.style.opacity=(0.15+0.85*inBeam)*(0.6+0.4*Math.sin(t*1.3+p))});
  mediaKB("s1",t,0,5.5);
  /* Cena 2 — espelho e versões que se separam */
  const k2=clamp((t-4.6)/6.8);
  $("#mirror").style.transform=`scale(${1.08-0.06*k2}) rotate(${-1.5+2*k2}deg)`;
  document.querySelectorAll("#ghosts .ghost").forEach((g,i)=>{const dir=[-1,1,-0.5,0.6][i];const sp=ss(0,1,k2)*(i===0?0:1);
    g.style.transform=`translate(${dir*120*sp}px,${(i%2?-1:1)*20*sp}px) scale(${1-0.05*i})`;g.style.opacity=i===0?0.95:0.55*sp});
  $("#glint").style.transform=`translateX(${-700+1400*k2}px)`;
  mediaKB("s2",t,4.6,11.4);
  /* Cena 3 — escrita no diário, vapor do café */
  const k3=clamp((t-10.6)/6.8);
  $("#journal").style.transform=`rotate(${-6+1.5*k3}deg) scale(${1.0+0.06*k3})`;
  $("#table").style.transform=`scale(${1+0.05*k3})`;
  const W=[["#h1",11.5,13.4],["#h2",13.6,15.0],["#h3",15.2,16.7]];
  let penX=0,penY=0;
  W.forEach(([id,a,b])=>{const e=$(id);const full=e.scrollWidth;const f=clamp((t-a)/(b-a));e.style.width=(full*f+2)+"px";if(t>=a)[penX,penY]=[96+full*f,parseInt(e.style.top)]});
  const jr=-6+1.5*k3, rad=jr*Math.PI/180, cx=150+400, cy=420+520;
  const lx=penX-400, ly=penY+40-520; const sc=1+0.06*k3;
  const px=cx+(lx*Math.cos(rad)-ly*Math.sin(rad))*sc, py=cy+(lx*Math.sin(rad)+ly*Math.cos(rad))*sc;
  $("#pen").style.transform=`translate(${px-12}px,${py-520+Math.sin(t*22)*3}px) rotate(28deg)`;
  $("#pen").style.left="0";$("#pen").style.top="0";$("#pen").style.transformOrigin="12px 520px";
  $("#cup").style.transform=`translate(${-20*k3}px,${10*k3}px)`;
  document.querySelectorAll("#steam .steam").forEach((s,i)=>{const ph=(t*0.25+i/4)%1;
    s.style.transform=`translate(${780+Math.sin(t*0.8+i)*40}px,${320-ph*520}px) scaleX(${0.7+ph*0.8}) rotate(${Math.sin(t+i)*12}deg)`;s.style.opacity=Math.sin(ph*Math.PI)*0.85});
  mediaKB("s3",t,10.6,17.4);
  /* Cena 4 — app */
  const k4=clamp((t-16.7)/8.6);
  const enter=ease((t-16.9)/1.2);
  $("#phone").style.transform=`translateY(${(1-enter)*260}px) rotate(${(1-enter)*-4+Math.sin(t*0.6)*0.6}deg) scale(${0.96+0.04*k4})`;
  const SCR=[["#a1",16.5,19.2],["#a2",19.2,20.45],["#a2b",20.45,21.5],["#a3",21.5,23.4],["#a4",23.4,26]];
  SCR.forEach(([id,a,b])=>{const e=$(id);const vis=t>=a&&t<b;const soft=id==="#a2b";
    const i=id==="#a1"?1:(soft?1:ss(a,a+0.4,t));
    e.style.opacity=vis?i:0;e.style.transform=`translateX(${soft||id==="#a1"?0:(1-ease((t-a)/0.5))*80}px)`});
  const tp=$("#tap");const tk=(t-20.3)/0.5;tp.style.opacity=tk>0&&tk<1?(1-tk)*0.9:0;tp.style.left="95px";tp.style.top="395px";tp.style.transform=`scale(${0.4+tk*1.2})`;
  /* Cena 5 — luz do sol, depois assinatura */
  const k5=clamp((t-24.6)/3.2);
  $("#sun").style.transform=`translate(${-160+260*k5}px,${-520+60*k5}px) scale(${0.9+0.3*k5})`;
  document.querySelectorAll("#flares .flare").forEach((f,i)=>{const d=[0.3,0.6,0.85,1.1][i];const sx=540+(-160+260*k5)+700,sy=-520+60*k5+700;
    f.style.transform=`translate(${sx+(540-sx)*d*1.6}px,${sy+(1100-sy)*d*1.3}px)`;f.style.opacity=0.5+0.5*Math.sin(t*1.5+i)});
  document.querySelectorAll("#bokeh .flare").forEach(e=>{const v=+e.dataset.v;e.style.transform=`translate(${+e.dataset.x-60*k5*(v+.3)}px,${+e.dataset.y-30*k5*v}px)`;e.style.opacity=0.4+0.5*Math.sin(t*0.9+v*9)**2});
  $("#scrim").style.opacity=(1-ss(27.0,27.7,t))*(1-ss(16.8,17.3,t)+ss(24.8,25.3,t));
  $("#s5a").style.transform=`scale(${1.02+0.05*k5})`;
  mediaKB("s5a",t,24.6,27.8);
  const k6=t-27.4;
  $("#logo").style.opacity=ease((k6-0.1)/0.9);$("#logo").style.transform=`translateY(${(1-ease((k6-0.1)/1.0))*24}px) scale(${0.96+0.04*ease(k6/1.6)})`;
  $("#tag").style.opacity=ease((k6-0.8)/0.8);$("#tag").style.transform=`translateY(${(1-ease((k6-0.8)/0.8))*16}px)`;
  $("#cta").style.opacity=ease((k6-1.3)/0.7);$("#cta").style.transform=`translateX(-50%) translateY(${(1-ease((k6-1.3)/0.7))*16}px)`;
  setHeadline(t);setCaption(t);
  $("#fade").style.opacity=1-ss(0,0.6,t);
};
